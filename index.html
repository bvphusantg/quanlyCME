/* ======================================================================== *
 *  TRÌNH SOẠN NỘI DUNG GIẤY CHỨNG NHẬN (kiểu Word)
 *  Bổ sung: đường kẻ dạng hình vẽ (di chuyển – kéo dài – đổi độ dày)
 *           và gạch chân tự động bằng 1/3 độ dài dòng phía trên.
 * ======================================================================== */
const SHAPE = {
  canvas:null, page:null, overlay:null, sel:null,
  drag:null, scale:1
};

function shapeLayer(create){
  if(!SHAPE.canvas) return null;
  let l = SHAPE.canvas.querySelector('.cc-shapes');
  if(!l && create){
    l = document.createElement('div');
    l.className='cc-shapes';
    l.setAttribute('contenteditable','false');
    SHAPE.canvas.appendChild(l);
  }
  return l;
}
function shapeGeom(el){
  return {
    x: parseFloat(el.style.left)||0,
    y: parseFloat(el.style.top)||0,
    w: parseFloat(el.style.width)||0,
    h: parseFloat(el.dataset.th)||2,
    a: parseFloat(el.dataset.rot)||0
  };
}
function shapeApply(el, g){
  el.style.left = g.x+'px';
  el.style.top  = g.y+'px';
  el.style.width= Math.max(8,g.w)+'px';
  el.style.height = '12px';
  el.dataset.th = g.h;
  el.dataset.rot = g.a;
  el.style.transform = 'rotate('+g.a+'deg)';
  const body = el.querySelector('.cc-line-body');
  const st = el.dataset.lstyle||'solid';
  const col = el.dataset.color||'#000000';
  const th = Math.max(0.5, g.h);
  body.style.borderTop = (st==='double'? (th*3)+'px double '+col : th+'px '+st+' '+col);
}
function makeShapeEl(g, style, color){
  const el = document.createElement('div');
  el.className='cc-shape'; el.dataset.shape='line';
  el.setAttribute('contenteditable','false');
  el.dataset.lstyle = style||'solid';
  el.dataset.color = color||'#000000';
  el.style.position='absolute';
  el.style.transformOrigin='left center';
  el.innerHTML = '<div class="cc-line-body" style="position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);"></div>';
  shapeApply(el, g);
  return el;
}
function insertShapeLine(){
  const layer = shapeLayer(true);
  const w = SHAPE.canvas.offsetWidth || Math.round(SHAPE.canvas.getBoundingClientRect().width) || 640;
  const n = layer.querySelectorAll('.cc-shape').length;
  const g = { x: Math.round(w*0.25), y: 120 + (n%8)*22, w: Math.round(w*0.5), h:2, a:0 };
  const el = makeShapeEl(g, $('#lineStyleSel')?$('#lineStyleSel').value.split('-')[0]:'solid', $('#lineColorSel')?$('#lineColorSel').value:'#000000');
  layer.appendChild(el);
  selectShape(el);
  showToast('Đã chèn đường kẻ — kéo để di chuyển, kéo hai đầu để đổi độ dài','ok');
}
function selectShape(el){
  SHAPE.sel = el;
  drawShapeUI();
}
function clearShapeSel(){ SHAPE.sel=null; drawShapeUI(); }

function drawShapeUI(){
  const ov = SHAPE.overlay; if(!ov) return;
  ov.innerHTML='';
  const el = SHAPE.sel;
  if(!el || !el.isConnected){ SHAPE.sel=null; return; }
  const pr = SHAPE.page.getBoundingClientRect();
  const cr = SHAPE.canvas.getBoundingClientRect();
  const sc = pr.width / SHAPE.page.offsetWidth;
  SHAPE.scale = sc;
  const off = { x:(cr.left-pr.left)/sc, y:(cr.top-pr.top)/sc };
  const g = shapeGeom(el);
  const rad = g.a*Math.PI/180;
  const p1 = { x: off.x+g.x, y: off.y+g.y+6 };
  const p2 = { x: p1.x + g.w*Math.cos(rad), y: p1.y + g.w*Math.sin(rad) };

  const mk = (cls,x,y,role)=>{
    const h=document.createElement('div');
    h.className=cls; h.style.left=x+'px'; h.style.top=y+'px'; h.dataset.role=role;
    ov.appendChild(h); return h;
  };
  mk('sh-handle', p1.x, p1.y, 'start');
  mk('sh-handle', p2.x, p2.y, 'end');

  const bar = document.createElement('div');
  bar.className='sh-bar';
  bar.style.left = Math.max(0, Math.min(p1.x, p2.x))+'px';
  bar.style.top  = (Math.min(p1.y,p2.y) - 42)+'px';
  bar.innerHTML = `
    <span class="lbl">Dài</span><button data-act="w-">−</button><span class="val">${Math.round(g.w)}</span><button data-act="w+">+</button>
    <span class="lbl">Dày</span><button data-act="h-">−</button><span class="val">${g.h}</span><button data-act="h+">+</button>
    <span class="lbl">Xoay</span><button data-act="a-">↺</button><span class="val">${g.a}°</span><button data-act="a+">↻</button>
    <select data-act="style">
      ${['solid','dashed','dotted','double'].map(s=>`<option value="${s}" ${el.dataset.lstyle===s?'selected':''}>${({solid:'Nét liền',dashed:'Nét đứt',dotted:'Nét chấm',double:'Nét đôi'})[s]}</option>`).join('')}
    </select>
    <input type="color" data-act="color" value="${el.dataset.color||'#000000'}">
    <button data-act="dup">Nhân đôi</button>
    <button data-act="del" class="del">Xoá</button>`;
  ov.appendChild(bar);

  bar.addEventListener('mousedown', e=>e.stopPropagation());
  $all('[data-act]', bar).forEach(b=>{
    const act=b.dataset.act;
    const ev = (b.tagName==='SELECT'||b.type==='color')?'input':'click';
    b.addEventListener(ev, (e)=>{
      const g2 = shapeGeom(el);
      if(act==='w-') g2.w = Math.max(10, g2.w-10);
      else if(act==='w+') g2.w += 10;
      else if(act==='h-') g2.h = Math.max(0.5, Math.round((g2.h-0.5)*10)/10);
      else if(act==='h+') g2.h = Math.round((g2.h+0.5)*10)/10;
      else if(act==='a-') g2.a = Math.round(g2.a-1);
      else if(act==='a+') g2.a = Math.round(g2.a+1);
      else if(act==='style') el.dataset.lstyle = e.target.value;
      else if(act==='color') el.dataset.color = e.target.value;
      else if(act==='dup'){
        const cp = makeShapeEl({x:g2.x+14,y:g2.y+14,w:g2.w,h:g2.h,a:g2.a}, el.dataset.lstyle, el.dataset.color);
        shapeLayer(true).appendChild(cp); selectShape(cp); return;
      }
      else if(act==='del'){ el.remove(); clearShapeSel(); return; }
      shapeApply(el, g2); drawShapeUI();
    });
  });

  /* Kéo hai đầu để đổi độ dài & góc nghiêng */
  $all('.sh-handle', ov).forEach(h=>{
    h.addEventListener('mousedown', e=>{
      e.preventDefault(); e.stopPropagation();
      SHAPE.drag = { mode:'resize', role:h.dataset.role, el, startX:e.clientX, startY:e.clientY, g:shapeGeom(el), off };
    });
  });
}

let SHAPE_BOUND = false;
function bindShapeInteractions(){
  const canvas = SHAPE.canvas;
  canvas.addEventListener('mousedown', e=>{
    const sh = e.target.closest ? e.target.closest('.cc-shape') : null;
    if(sh){
      e.preventDefault();
      selectShape(sh);
      SHAPE.drag = { mode:'move', el:sh, startX:e.clientX, startY:e.clientY, g:shapeGeom(sh) };
    }else if(SHAPE.sel){ clearShapeSel(); }
  });
  if(SHAPE_BOUND) return;
  SHAPE_BOUND = true;
  document.addEventListener('mousemove', e=>{
    const d = SHAPE.drag; if(!d) return;
    const sc = SHAPE.scale||1;
    const dx = (e.clientX-d.startX)/sc, dy = (e.clientY-d.startY)/sc;
    const g = Object.assign({}, d.g);
    if(d.mode==='move'){ g.x = d.g.x+dx; g.y = d.g.y+dy; }
    else{
      const rad = d.g.a*Math.PI/180;
      const sx = d.g.x, sy = d.g.y;
      const ex = sx + d.g.w*Math.cos(rad), ey = sy + d.g.w*Math.sin(rad);
      if(d.role==='end'){
        const nx = ex+dx, ny = ey+dy;
        g.w = Math.max(10, Math.hypot(nx-sx, ny-sy));
        g.a = e.shiftKey ? 0 : Math.round(Math.atan2(ny-sy, nx-sx)*180/Math.PI);
      }else{
        const nx = sx+dx, ny = sy+dy;
        g.x = nx; g.y = ny;
        g.w = Math.max(10, Math.hypot(ex-nx, ey-ny));
        g.a = e.shiftKey ? 0 : Math.round(Math.atan2(ey-ny, ex-nx)*180/Math.PI);
      }
    }
    shapeApply(d.el, g);
    drawShapeUI();
  });
  document.addEventListener('mouseup', ()=>{ if(SHAPE.drag){ SHAPE.drag=null; drawShapeUI(); } });
  document.addEventListener('keydown', e=>{
    if(!SHAPE.sel || !SHAPE.sel.isConnected) return;
    if(document.activeElement===SHAPE.canvas && !e.target.closest('.sh-bar')){
      /* con trỏ đang trong vùng gõ chữ: chỉ nhận phím mũi tên khi giữ Alt */
      if(!e.altKey && e.key.startsWith('Arrow')) return;
    }
    const g = shapeGeom(SHAPE.sel);
    const step = e.shiftKey?10:1;
    if(e.key==='ArrowLeft'){ g.x-=step; } else if(e.key==='ArrowRight'){ g.x+=step; }
    else if(e.key==='ArrowUp'){ g.y-=step; } else if(e.key==='ArrowDown'){ g.y+=step; }
    else if(e.key==='Delete'||e.key==='Backspace'){ if(!e.target.isContentEditable||e.target.closest('.sh-bar')){ SHAPE.sel.remove(); clearShapeSel(); e.preventDefault(); } return; }
    else return;
    e.preventDefault(); shapeApply(SHAPE.sel,g); drawShapeUI();
  });
  window.addEventListener('scroll', ()=>{ if(SHAPE.sel) drawShapeUI(); }, true);
  window.addEventListener('resize', ()=>{ if(SHAPE.sel) drawShapeUI(); });
}

/* ---------------- Gạch chân tự động bằng 1/3 độ dài nội dung ------------- */
function wrapAutoUnderline(node, tag){
  /* node: phần tử chứa nội dung cần gạch chân */
  if(!node) return null;
  if(node.classList && node.classList.contains('auto-ul')) return ensureUlLine(node);
  const span = document.createElement('span');
  span.className = 'auto-ul';
  if(tag) span.dataset.autoul = tag;
  while(node.firstChild) span.appendChild(node.firstChild);
  node.appendChild(span);
  return ensureUlLine(span);
}
function ensureUlLine(span){
  if(!span) return null;
  let line = span.querySelector(':scope > .auto-ul-line');
  const text = (span.textContent||'').trim();
  if(!text){ if(line) line.remove(); return span; }
  if(!line){
    line = document.createElement('span');
    line.className='auto-ul-line';
    line.setAttribute('contenteditable','false');
    span.appendChild(line);
  }else if(line !== span.lastChild){
    span.appendChild(line);
  }
  return span;
}
/* Bảo đảm mọi khối .auto-ul luôn có đường gạch 1/3 ở cuối, chạy sau mỗi lần gõ */
function refreshAutoUnderlines(root){
  (root||SHAPE.canvas||document).querySelectorAll('.auto-ul').forEach(ensureUlLine);
}
/* Áp dụng cho dòng đang đặt con trỏ */
function applyAutoUnderlineAtCursor(){
  const sel = window.getSelection();
  if(!sel.rangeCount){ showToast('Hãy đặt con trỏ vào dòng cần gạch chân','err'); return; }
  let node = sel.getRangeAt(0).startContainer;
  if(node.nodeType===3) node = node.parentNode;
  /* tìm khối dòng gần nhất trong canvas */
  let block = node;
  while(block && block!==SHAPE.canvas && !/^(DIV|P|TD|LI|H1|H2|H3)$/.test(block.tagName)) block = block.parentNode;
  if(!block || block===SHAPE.canvas){ showToast('Không xác định được dòng để gạch chân','err'); return; }
  const existing = block.querySelector('.auto-ul');
  if(existing){
    existing.querySelectorAll('.auto-ul-line').forEach(l=>l.remove());
    existing.replaceWith(...Array.from(existing.childNodes));
    showToast('Đã bỏ gạch chân của dòng này','ok'); return;
  }
  wrapAutoUnderline(block);
  showToast('Đã thêm gạch chân dài 1/3 nội dung dòng','ok');
}
/* Làm sạch HTML trước khi lưu: bỏ trạng thái chọn, giữ nguyên hình vẽ */
function cleanEditorHtml(canvas){
  const clone = canvas.cloneNode(true);
  clone.querySelectorAll('.cc-shape').forEach(s=>s.classList.remove('selected'));
  return clone.innerHTML;
}

function renderCustomContentEditor(c){
  const d = DESIGN;
  c.innerHTML = `
    <div class="help-box">Khu vực bên dưới là <b>toàn bộ nội dung giấy chứng nhận</b> — bấm vào và gõ/định dạng trực tiếp như trong Word. Các khối <span style="background:#FFF3C4;border:1px dashed #B8873A;border-radius:3px;padding:0 4px;">tô vàng viền đứt</span> là <b>trường dữ liệu động</b>, khi cấp giấy sẽ tự thay bằng thông tin thật của từng người. Dùng <b>Chèn đường kẻ (hình vẽ)</b> để thêm đường thẳng có thể kéo dài, đổi độ dày và di chuyển tự do; dùng <b>Gạch 1/3</b> để thêm đường gạch dài bằng một phần ba dòng chữ phía trên.</div>

    <div class="card" style="margin-bottom:14px;">
      <div class="card-pad hstack" style="flex-wrap:wrap;">
        <label style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;">
          <input type="checkbox" id="cc_toggle" ${d.useCustomContent?'checked':''}> Dùng nội dung tự thiết kế khi cấp giấy chứng nhận
        </label>
        <span class="spacer"></span>
        <label style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;">
          <input type="checkbox" id="cc_autoul" ${d.autoUnderlineOrg!==false?'checked':''}> Tự gạch 1/3 dưới tên đơn vị cấp giấy
        </label>
        <span class="badge ${d.useCustomContent?'badge-teal':'badge-gray'}">${d.useCustomContent?'Đang áp dụng nội dung tuỳ chỉnh':'Đang dùng mẫu hệ thống mặc định'}</span>
      </div>
    </div>

    <div class="card">
      <div class="editor-toolbar" id="editorToolbar">
        <button type="button" data-cmd="bold" title="In đậm"><b>B</b></button>
        <button type="button" data-cmd="italic" title="In nghiêng"><i>I</i></button>
        <button type="button" data-cmd="underline" title="Gạch chân"><u>U</u></button>
        <span class="tb-sep"></span>
        <button type="button" data-cmd="justifyLeft" title="Canh trái">⯇</button>
        <button type="button" data-cmd="justifyCenter" title="Canh giữa">☰</button>
        <button type="button" data-cmd="justifyRight" title="Canh phải">⯈</button>
        <button type="button" data-cmd="justifyFull" title="Canh đều">≣</button>
        <span class="tb-sep"></span>
        <select id="fontSizeSel" title="Cỡ chữ">
          <option value="2">Cỡ nhỏ</option>
          <option value="3" selected>Cỡ vừa</option>
          <option value="4">Cỡ lớn</option>
          <option value="5">Rất lớn</option>
          <option value="6">Tiêu đề</option>
        </select>
        <input type="color" id="fontColorSel" title="Màu chữ" value="#000000">
        <span class="tb-sep"></span>
        <select id="insertFieldSel" title="Chèn trường dữ liệu">
          <option value="">+ Chèn trường dữ liệu...</option>
          ${MERGE_FIELDS.map(f=>`<option value="${f.key}">${esc(f.label)}</option>`).join('')}
        </select>
        <span class="tb-sep"></span>
        <select id="lineStyleSel" title="Kiểu đường kẻ">
          <option value="solid-1">Mảnh</option>
          <option value="solid-2" selected>Vừa</option>
          <option value="solid-3">Đậm</option>
          <option value="dashed-2">Nét đứt</option>
          <option value="dotted-2">Nét chấm</option>
          <option value="double-3">Nét đôi</option>
        </select>
        <input type="color" id="lineColorSel" title="Màu đường kẻ" value="#000000">
        <button type="button" id="insertLineBtn" title="Chèn đường kẻ chiếm trọn dòng">➖ Kẻ ngang</button>
        <button type="button" id="insertShapeBtn" title="Chèn đường kẻ dạng hình vẽ, kéo thả tự do">✎ Chèn đường kẻ (hình vẽ)</button>
        <button type="button" id="autoUlBtn" title="Gạch chân dài 1/3 dòng hiện tại">⎯⅓ Gạch 1/3</button>
        <span class="tb-sep"></span>
        <button type="button" data-cmd="undo" title="Hoàn tác">↶ Hoàn tác</button>
        <button type="button" data-cmd="redo" title="Làm lại">↷ Làm lại</button>
        <button type="button" data-cmd="removeFormat" title="Xoá định dạng">Xoá định dạng</button>
      </div>
      <div class="card-pad" style="background:#DCE3EA;padding:26px;">
        <div class="cert-stage" style="padding:0;justify-content:center;">
          <div id="editorPageWrap" style="width:210mm;"></div>
        </div>
      </div>
      <div class="card-pad hstack" style="border-top:1px solid var(--border);flex-wrap:wrap;">
        <button class="btn btn-primary" id="cc_save">💾 Lưu làm nội dung tuỳ chỉnh</button>
        <button class="btn" id="cc_resetTemplate">↺ Khôi phục mẫu mặc định trong khung soạn</button>
        <button class="btn" id="cc_clearShapes">Xoá toàn bộ đường kẻ hình vẽ</button>
        <span class="spacer"></span>
        <button class="btn btn-danger" id="cc_clearCustom">Xoá nội dung tuỳ chỉnh đã lưu</button>
      </div>
    </div>`;

  const initialContent = d.customContentHtml || buildCertEditableTemplate();
  $('#editorPageWrap').innerHTML =
    `<div class="cert-page" id="editorPage" style="${certPageStyleAttr()}">
       ${certOverlaysHtml()}
       <div class="cert-content editor-canvas" id="editorCanvas" contenteditable="true">${initialContent}</div>
       <div id="shapeOverlay"></div>
     </div>`;

  const canvas = $('#editorCanvas');
  SHAPE.canvas = canvas;
  SHAPE.page = $('#editorPage');
  SHAPE.overlay = $('#shapeOverlay');
  SHAPE.sel = null;
  shapeLayer(true);
  refreshAutoUnderlines(canvas);
  bindShapeInteractions();

  $all('#editorToolbar button[data-cmd]', c).forEach(btn=>{
    btn.addEventListener('mousedown', e=>e.preventDefault());
    btn.addEventListener('click', ()=>{ canvas.focus(); document.execCommand(btn.dataset.cmd, false, null); });
  });
  $('#fontSizeSel').addEventListener('mousedown', e=>e.stopPropagation());
  $('#fontSizeSel').addEventListener('change', e=>{ canvas.focus(); document.execCommand('fontSize', false, e.target.value); });
  $('#fontColorSel').addEventListener('input', e=>{ canvas.focus(); document.execCommand('foreColor', false, e.target.value); });
  $('#insertFieldSel').addEventListener('change', e=>{
    const key = e.target.value; if(!key) return;
    canvas.focus();
    document.execCommand('insertHTML', false, mergeFieldSpan(key)+'&nbsp;');
    e.target.value='';
    refreshAutoUnderlines(canvas);
  });

  $('#lineStyleSel').addEventListener('mousedown', e=>e.stopPropagation());
  $('#lineColorSel').addEventListener('mousedown', e=>e.stopPropagation());
  $('#insertLineBtn').addEventListener('mousedown', e=>e.preventDefault());
  $('#insertLineBtn').addEventListener('click', ()=>{
    canvas.focus();
    const [style, widthPx] = $('#lineStyleSel').value.split('-');
    const color = $('#lineColorSel').value;
    const cssStyle = style==='double' ? `border-top:${widthPx*3}px double ${color};` : `border:none;border-top:${widthPx}px ${style} ${color};`;
    document.execCommand('insertHTML', false, `<hr style="${cssStyle}width:100%;margin:8px 0;">`);
  });
  $('#insertShapeBtn').addEventListener('mousedown', e=>e.preventDefault());
  $('#insertShapeBtn').addEventListener('click', insertShapeLine);
  $('#autoUlBtn').addEventListener('mousedown', e=>e.preventDefault());
  $('#autoUlBtn').addEventListener('click', applyAutoUnderlineAtCursor);

  /* Tự động duy trì đường gạch 1/3 khi người dùng gõ tên đơn vị */
  let ulTimer=null;
  canvas.addEventListener('input', ()=>{
    clearTimeout(ulTimer);
    ulTimer = setTimeout(()=>{
      if(DESIGN.autoUnderlineOrg!==false) ensureOrgUnderline(canvas);
      refreshAutoUnderlines(canvas);
    }, 180);
  });

  $('#cc_autoul').addEventListener('change', e=>{
    DESIGN.autoUnderlineOrg = e.target.checked; saveDesign();
    if(e.target.checked){ ensureOrgUnderline(canvas); refreshAutoUnderlines(canvas); }
    else { canvas.querySelectorAll('[data-autoul="org"] .auto-ul-line').forEach(l=>l.remove()); }
    showToast(e.target.checked?'Đã bật gạch 1/3 tự động dưới tên đơn vị':'Đã tắt gạch 1/3 tự động','ok');
  });
  $('#cc_toggle').addEventListener('change', e=>{
    d.useCustomContent = e.target.checked;
    if(d.useCustomContent && !d.customContentHtml){ d.customContentHtml = cleanEditorHtml(canvas); }
    saveDesign(); showToast(d.useCustomContent?'Đã bật dùng nội dung tuỳ chỉnh':'Đã chuyển về mẫu mặc định','ok'); renderTab();
  });
  $('#cc_save').addEventListener('click', ()=>{
    clearShapeSel();
    d.customContentHtml = cleanEditorHtml(canvas);
    d.useCustomContent = true;
    saveDesign(); showToast('Đã lưu nội dung tuỳ chỉnh — áp dụng cho các giấy chứng nhận tiếp theo','ok'); renderTab();
  });
  $('#cc_resetTemplate').addEventListener('click', ()=>{
    if(!confirm('Khôi phục nội dung mẫu mặc định trong khung soạn thảo? Các chỉnh sửa hiện tại chưa lưu sẽ mất.')) return;
    canvas.innerHTML = buildCertEditableTemplate();
    shapeLayer(true); refreshAutoUnderlines(canvas); clearShapeSel();
  });
  $('#cc_clearShapes').addEventListener('click', ()=>{
    const n = canvas.querySelectorAll('.cc-shape').length;
    if(!n){ showToast('Chưa có đường kẻ hình vẽ nào','err'); return; }
    if(!confirm('Xoá '+n+' đường kẻ hình vẽ khỏi trang?')) return;
    canvas.querySelectorAll('.cc-shape').forEach(s=>s.remove()); clearShapeSel();
    showToast('Đã xoá các đường kẻ hình vẽ','ok');
  });
  $('#cc_clearCustom').addEventListener('click', ()=>{
    if(!confirm('Xoá nội dung tuỳ chỉnh đã lưu và quay lại dùng mẫu hệ thống mặc định cho mọi giấy chứng nhận?')) return;
    d.customContentHtml = null; d.useCustomContent = false;
    saveDesign(); showToast('Đã xoá nội dung tuỳ chỉnh','ok'); renderTab();
  });
}

/* Bảo đảm khối "tên đơn vị cấp giấy" luôn có gạch 1/3 ngay bên dưới */
function ensureOrgUnderline(root){
  const scope = root||document;
  let host = scope.querySelector('[data-autoul="org"]');
  if(!host){
    /* Chưa đánh dấu: tìm khối chứa trường "Tên đơn vị cấp giấy" hoặc chữ in đậm đầu trang */
    const mf = scope.querySelector('.merge-field[data-field="tenDonVi"]');
    let target = null;
    if(mf){
      target = mf.closest('b') || mf.closest('.cert-org') || mf.parentNode;
      if(target && target.classList && target.classList.contains('cert-org')){
        /* chỉ bọc phần in đậm nếu có */
        target = target.querySelector('b') || target;
      }
    }
    if(!target) return null;
    if(target.classList && target.classList.contains('auto-ul')){ host = target; host.dataset.autoul='org'; }
    else host = wrapAutoUnderline(target, 'org');
  }
  return ensureUlLine(host);
}


/* ================================ INIT ===================================== */
document.getElementById('modalBg').addEventListener('click', (e)=>{ if(e.target.id==='modalBg') closeModal(); });
(async function init(){
  await loadCfg();
  await Promise.all([loadData(), loadDesign(), loadSeal(), loadInputHistory()]);
  await fsRestoreRoot(true);
  /* Rà soát hồ sơ đến hạn đóng ngay khi mở phần mềm (không bao giờ xoá dữ liệu) */
  try{ if(archiveCfg().auto) runArchiveJob(); }catch(e){ console.warn('Rà soát lưu trữ:', e); }
  renderApp();
  if(!CFG.firstRunDone){
    setTimeout(()=>openSetupWizard(false), 350);
  }else if(CFG.storage.mode==='fsapi' && !ROOT_READY){
    setTimeout(showStorageWarning, 600);
  }
  scheduleAutoBackup();
  ensureQrLib().catch(()=>{});
})();
</script>
