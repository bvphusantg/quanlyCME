/* ==========================================================================
 *  XUẤT .RTF — ĐÃ SỬA LỖI "LỖI FONT TOÀN BỘ, KHÔNG XEM ĐƯỢC"
 *
 *  NGUYÊN NHÂN LỖI CŨ:
 *   (1) Tệp khai báo bảng mã \ansicpg1258 nhưng nội dung lại được ghi ra ở dạng
 *       UTF-8. Word đọc từng byte UTF-8 theo bảng mã 1258 nên toàn bộ dấu tiếng
 *       Việt biến thành ký tự rác (kiểu "Sá»: 013", "GIáº¤Y CHá»¨NG NHáº¬N").
 *   (2) Hàm thoát ký tự cũ chỉ mã hoá các ký tự từ U+0100 trở lên, bỏ sót toàn
 *       bộ nguyên âm có dấu vùng Latin-1 (à á â ã è é ê ì í ò ó ô õ ù ú ý...).
 *   (3) Phần chữ cố định trong mẫu ("GIẤY CHỨNG NHẬN", "Chứng nhận:", "Đã hoàn
 *       thành...") KHÔNG hề đi qua hàm thoát ký tự — ghi thẳng byte UTF-8 vào tệp.
 *
 *  CÁCH SỬA: RTF chỉ chứa ASCII thuần. MỌI ký tự ngoài ASCII (kể cả chữ cố định
 *  trong mẫu) đều được mã hoá theo chuẩn Unicode của RTF: \uN? — mã này được
 *  Word, WordPad, LibreOffice, Google Docs đọc đúng trên mọi máy, mọi bảng mã.
 *  Bổ sung thêm: viền trang gốc của RTF (\pgbrdr*) và lớp trang trí khổ A4 đặt
 *  ở phần đầu trang, để .rtf cũng giống bản xem trước.
 * ========================================================================== */

/* Mã hoá chuỗi bất kỳ sang RTF an toàn tuyệt đối (chỉ sinh ra ASCII) */
function rtfEsc(str){
  if(str===undefined || str===null) return '';
  const src = String(str);
  let out = '';
  for(let k=0; k<src.length; k++){
    const ch = src[k];
    const c = src.charCodeAt(k);
    if(ch==='\\' || ch==='{' || ch==='}'){ out += '\\' + ch; }
    else if(ch==='\n'){ out += '\\line '; }
    else if(ch==='\r'){ /* bỏ qua */ }
    else if(ch==='\t'){ out += '\\tab '; }
    else if(c < 128){ out += ch; }
    else {
      /* \uN? : N là số nguyên có dấu 16 bit theo đúng đặc tả RTF */
      out += '\\u' + (c > 32767 ? c - 65536 : c) + '?';
    }
  }
  return out;
}
/* Bí danh ngắn — dùng cho MỌI chuỗi ghi vào RTF, kể cả chữ cố định của mẫu */
const R = rtfEsc;

function rtfColorTable(){
  const hex = (DESIGN.borderColor||'#B8873A').replace('#','');
  const r = parseInt(hex.substr(0,2),16)||184, g = parseInt(hex.substr(2,2),16)||135, b = parseInt(hex.substr(4,2),16)||58;
  /* cf1 = đỏ tiêu đề, cf2 = màu viền theo thiết kế */
  return `{\\colortbl;\\red192\\green0\\blue0;\\red${r}\\green${g}\\blue${b};}`;
}
/* Viền trang gốc của RTF — đo từ mép giấy, khoảng cách = độ thụt viền trong thiết kế */
function rtfPageBorders(){
  const d = DESIGN;
  if(!d.borderLine || d.borderLine==='none') return '';
  let style = '\\brdrs';
  if(d.borderLine==='double' || d.borderLine==='goldframe') style = '\\brdrdb';
  else if(d.borderLine==='dashed') style = '\\brdrdash';
  else if(d.borderLine==='dotted') style = '\\brdrdot';
  const w  = Math.max(10, Math.min(75, Math.round((d.borderThickness||2)*10)));   /* 1/8 pt */
  const sp = Math.max(0, Math.min(1440, Math.round(Math.max(d.borderInset||8,6)*56.7))); /* mm -> twip */
  const side = tag => `${tag}${style}\\brdrw${w}\\brdrcf2\\brsp${sp}`;
  return '\\pgbrdropt0' + side('\\pgbrdrt') + side('\\pgbrdrl') + side('\\pgbrdrb') + side('\\pgbrdrr');
}
/* Lớp trang trí khổ A4 đặt trong phần đầu trang, khung định vị theo mép giấy */
function rtfDecorHeader(jpegDataUrl){
  if(!jpegDataUrl) return '';
  const hex = b64ToHex(dataUrlPayload(jpegDataUrl));
  return `{\\header \\pard\\plain\\phpg\\pvpg\\posx0\\posy0\\absw11906\\absh16838\\dxfrtext0\\dfrmtxtx0\\dfrmtxty0\\nowrap
{\\pict\\jpegblip\\picwgoal11906\\pichgoal16838 ${hex}}\\par}`;
}

/* Bảng 2 cột không kẻ viền của RTF — dùng cho khối tiêu đề và khối ký,
   để .rtf có cùng bố cục với bản xem trước thay vì xếp dồn một cột. */
const RTF_TEXTW = 9412;            /* bề rộng vùng chữ = 210mm - 2 x 22mm (twip) */
function rtfRowStart(c1, c2){
  const noBrd = '\\clbrdrt\\brdrnone\\clbrdrl\\brdrnone\\clbrdrb\\brdrnone\\clbrdrr\\brdrnone';
  return `\\trowd\\trgaph0\\trleft0${noBrd}\\cellx${c1}${noBrd}\\cellx${c2}\n`;
}
/* LƯU Ý QUAN TRỌNG VỀ \par:
   Từ khoá điều khiển của RTF kết thúc khi gặp ký tự KHÔNG phải chữ cái. Nếu ghi
   "\parTRONG KHÁM BỆNH" thì bộ đọc hiểu cả cụm "\parTRONG" là một từ khoá lạ và
   NUỐT LUÔN chữ "TRONG". Vì vậy mọi chỗ ở dưới đều dùng "\par\n" — ký tự xuống
   dòng vừa đóng từ khoá, vừa được RTF bỏ qua nên không sinh khoảng trắng thừa. */
function rtfCertBody(ctx){
  const h=ctx.hospital||{}, p=ctx.participant, pg=ctx.program, r=ctx.record, vaiTro=ctx.vaiTro;
  const d = fmtDateParts(ctx.ngayCap);
  const bd = fmtDateParts(pg?pg.ngayBatDau:''); const kt = fmtDateParts(pg?pg.ngayKetThuc:'');
  const gioiTinh=(p&&p.gioiTinh==='Nữ')?'Bà':'Ông';
  const hinhThucTen = vaiTro&&vaiTro.htTen?vaiTro.htTen:((hinhThucById(r?r.hinhThuc:'')||{}).ten||'');
  const gio = r?(Math.round((r.gioTinChi||0)*100)/100):0;
  const orgLines = orgNameLinesPlain(h);
  const soTietNhan = (vaiTro&&vaiTro.donVi&&vaiTro.donVi.indexOf('tiết')>=0) ? '5. Số tiết: ' : '5. Khối lượng thực hiện: ';
  const line = (label, val) => `\\pard\\ql ${R(label)}${(val!==undefined&&val!==null&&val!=='')?'\\b '+R(val)+'\\b0':''}\\par\n`;

  let s='';
  /* ---- Khối tiêu đề: cột trái = cơ quan chủ quản/đơn vị/số giấy, cột phải = quốc hiệu ---- */
  s += rtfRowStart(4000, RTF_TEXTW);
  s += `\\pard\\intbl\\qc\\fs26 ${R((h.soYTe||'').toUpperCase())}\\par\n`;
  s += `\\b ${R(orgLines[0]||'')}\\par\n`;
  if(orgLines[1]) s += `\\ul ${R(orgLines[1])}\\ulnone\\par\n`;
  s += `\\b0\\par\n`;
  s += `${R('Số: '+(ctx.soGiay||''))}\\cell\n`;
  s += `\\pard\\intbl\\qc\\b\\fs24 ${R('CỘNG HÒA XÃ HỘI CHỦ NGHĨA VIỆT NAM')}\\par\n`;
  s += `\\ul ${R('Độc lập - Tự do - Hạnh phúc')}\\ulnone\\b0\\fs26\\cell\n`;
  s += `\\row\n`;
  /* ---- Tiêu đề giấy ---- */
  s += `\\pard\\qc\\sb240\\b\\fs44\\cf1 ${R('GIẤY CHỨNG NHẬN')}\\par\n`;
  s += `\\pard\\qc\\sb120\\fs28\\b\\cf1 ${R('THAM GIA CẬP NHẬT KIẾN THỨC Y KHOA LIÊN TỤC')}\\par\n`;
  s += `\\pard\\qc\\fs28\\b\\cf1 ${R('TRONG KHÁM BỆNH, CHỮA BỆNH')}\\par\n`;
  s += `\\pard\\cf0\\b0\\fs26\\par\n`;
  /* ---- Nội dung ---- */
  s += line('Chứng nhận: '+gioiTinh+' ', p?p.hoTen:'');
  s += line('Sinh ngày: ', p&&p.ngaySinh?fmtDate(p.ngaySinh):'');
  s += line('Đơn vị công tác: ', p?p.donViCongTac:'');
  s += `\\pard\\ql\\sb120 ${R('Đã hoàn thành cập nhật kiến thức y khoa liên tục với các nội dung như sau:')}\\par\n`;
  s += line('1. Hình thức: ', hinhThucTen);
  s += line('2. Nội dung/chủ đề: ', pg?pg.ten:'');
  s += line('3. Đơn vị/cá nhân chịu trách nhiệm: ', pg?(pg.donViChiuTrachNhiem||h.tenDonVi):'');
  s += `\\pard\\ql ${R('4. Thời gian từ ngày '+bd.d+' tháng '+bd.m+' năm '+bd.y+', đến ngày '+kt.d+' tháng '+kt.m+' năm '+kt.y)}\\par\n`;
  s += line(soTietNhan, r?(r.soLuong+' '+(vaiTro?vaiTro.donVi:'')):'');
  s += `\\pard\\qc\\sb180\\b ${R('Quy đổi tương đương: '+fmtNum(gio)+' giờ tín chỉ')}\\b0\\par\n`;
  s += `\\pard\\qc\\i ${R('(bằng chữ: '+soThanhChuVN(gio)+')')}\\i0\\par\n`;
  /* ---- Khối ký: đẩy sang nửa phải bằng bảng 2 cột ---- */
  s += `\\pard\\sa240\\par\n`;
  s += rtfRowStart(4706, RTF_TEXTW);
  s += `\\pard\\intbl\\cell\n`;
  s += `\\pard\\intbl\\qc\\i ${R((h.diaChiTinh||'')+', ngày '+d.d+' tháng '+d.m+' năm '+d.y)}\\i0\\par\n`;
  s += `\\b ${R((h.chucDanhKy||'GIÁM ĐỐC').toUpperCase())}\\b0\\par\n\\par\n\\par\n\\par\n`;
  s += `\\b ${R(h.tenGiamDoc||'')}\\b0\\cell\n`;
  s += `\\row\n\\pard\n`;
  if(ctx.reissueLabel) s += `\\pard\\qr\\i\\fs18 ${R(ctx.reissueLabel)}\\i0\\fs26\\par\n`;
  return s;
}

async function exportCertRtf(ctxs, filename){
  if(!ctxs || !ctxs.length){ showToast('Không có dữ liệu để xuất','err'); return; }
  if(!(await ensureSealReady(ctxs,'xuất .rtf'))) return;
  showToast('Đang tạo file .rtf...','ok');
  try{
    /* Ảnh trang trí trong RTF dùng JPEG để tệp không quá nặng (RTF ghi ảnh dạng hex) */
    let headerRtf = '';
    if(EXPORT_CFG.rtfImage){
      const img = await getDecorationImage(Object.assign({ scale:1.5, mime:'image/jpeg', quality:0.82 }, exportLayersFor(ctxs)));
      headerRtf = rtfDecorHeader(img);
    }
    /* "\par\page" mới thực sự sang trang mới; chỉ "\page" đứng một mình hay bị bỏ qua */
    const bodies = ctxs.map((cx,i)=> rtfCertBody(cx) + (i<ctxs.length-1?'\\par\\page\n':'')).join('');
    const rtf =
`{\\rtf1\\ansi\\ansicpg1252\\uc1\\deff0\\deflang1066\\deflangfe1066
{\\fonttbl{\\f0\\froman\\fcharset0\\fprq2 Times New Roman;}}
${rtfColorTable()}
\\viewkind4\\paperw11906\\paperh16838\\margl1247\\margr1247\\margt1134\\margb1021\\headery0\\footery0\\sectd\\linex0${rtfPageBorders()}
${headerRtf}
\\f0\\fs26\\cf0
${bodies}
}`;
    /* Chỉ chứa ASCII nên ghi bằng bảng mã nào cũng đọc đúng */
    const blob = new Blob([rtf], {type:'application/rtf;charset=us-ascii'});
    download(filename+'.rtf', blob);
    showToast('Đã tạo .rtf — chữ tiếng Việt hiển thị đúng trên Word/WordPad/LibreOffice','ok');
  }catch(e){ showToast('Lỗi khi tạo .rtf: '+e.message,'err'); }
}

function openExportDialog(ctxs, baseName, title){
  if(!ctxs || !ctxs.length){ showToast('Chưa có giấy chứng nhận để xuất','err'); return; }

/* ==========================================================================
 *  MÀN HÌNH: CHỮ KÝ & CON DẤU  (quản lý chặt, mặc định tắt)
 * ========================================================================== */
async function sealSetPassword(pw){
  SEAL.passSalt = SEAL.passSalt || randomToken(14);
  SEAL.passHash = await sha256Hex(SEAL.passSalt + '|seal|' + pw);
  saveSeal();
}
async function sealVerify(pw){
  if(!SEAL.passHash) return false;
  return (await sha256Hex(SEAL.passSalt + '|seal|' + pw)) === SEAL.passHash;
}
function sealOpenSession(by){
  SEAL_SESSION.until = Date.now() + (SEAL.unlockMinutes||15)*60000;
  SEAL_SESSION.fails = 0;
  SEAL_SESSION.by = by || SEAL.operator || '';
}
function sealCloseSession(){ SEAL_SESSION.until = 0; SEAL_SESSION.by=''; }

/* Hộp thoại nhập mật khẩu — trả về Promise<boolean> */
function openSealUnlockModal(reason){
  return new Promise(resolve=>{
    if(sealIsTempLocked()){
      const mins = Math.ceil((SEAL_SESSION.lockedUntil-Date.now())/60000);
      showToast('Đã nhập sai quá nhiều lần. Vui lòng thử lại sau '+mins+' phút.','err');
      resolve(false); return;
    }
    if(!sealHasPassword()){
      openModal('Chưa đặt mật khẩu con dấu', `
        <div class="help-box" style="background:var(--gold-light);border-color:#ecd9ad;color:#6b4c15;">
          Chức năng chèn chữ ký và con dấu đang bật nhưng <b>chưa đặt mật khẩu bảo vệ</b>.
          Vì đây là con dấu của đơn vị, phần mềm yêu cầu đặt mật khẩu trước khi sử dụng.
        </div>
        <div class="hint">Vào mục <b>Chữ ký &amp; con dấu</b> để đặt mật khẩu, hoặc tắt yêu cầu mật khẩu nếu đơn vị chấp nhận rủi ro.</div>`,
        [{ id:'goSeal', label:'Mở mục Chữ ký & con dấu', cls:'btn-primary',
           onClick:()=>{ closeModal(); resolve(false); STATE.tab='seal'; renderNav(); renderTab(); } },
         { id:'cancelSeal', label:'Huỷ', onClick:()=>{ closeModal(); resolve(false); } }]);
      return;
    }
    openModal('Xác thực để sử dụng con dấu', `
      <div class="help-box">
        Thao tác: <b>${esc(reason||'in/xuất giấy chứng nhận')}</b>.<br>
        Nhập mật khẩu con dấu để phần mềm chèn chữ ký và dấu vào giấy. Sau khi mở khoá,
        phiên làm việc có hiệu lực <b>${SEAL.unlockMinutes||15} phút</b> rồi tự đóng lại.
      </div>
      <div class="field"><label>Người thực hiện (ghi vào nhật ký)</label>
        <input type="text" id="sealBy" value="${esc(SEAL_SESSION.by||SEAL.operator||'')}" placeholder="Họ tên người được giao giữ dấu"></div>
      <div class="field"><label>Mật khẩu con dấu</label>
        <input type="password" id="sealPw" autocomplete="off" placeholder="••••••••">
        ${SEAL.passHint?`<div class="hint">Gợi ý: ${esc(SEAL.passHint)}</div>`:''}</div>
      <div id="sealErr" style="color:var(--danger);font-size:12.5px;font-weight:600;"></div>
      <div class="legal" style="margin-top:10px;">Mỗi lần mở khoá và mỗi lần chèn dấu đều được ghi vào nhật ký sử dụng (thời điểm, số giấy, người thực hiện).</div>`,
      [
        { id:'sealCancel', label:'Huỷ, in không có dấu', onClick:()=>{ closeModal(); resolve(false); } },
        { id:'sealOk', label:'🔓 Mở khoá', cls:'btn-primary', onClick: async ()=>{
            const pw = ($('#sealPw')||{}).value || '';
            if(await sealVerify(pw)){
              sealOpenSession(($('#sealBy')||{}).value||'');
              invalidateDecoCache();
              closeModal(); showToast('Đã mở khoá con dấu trong '+(SEAL.unlockMinutes||15)+' phút','ok');
              resolve(true);
            } else {
              SEAL_SESSION.fails++;
              const left = Math.max(0,(SEAL.maxFails||5) - SEAL_SESSION.fails);
              if(left<=0){
                SEAL_SESSION.lockedUntil = Date.now() + (SEAL.lockMinutes||10)*60000;
                SEAL_SESSION.fails = 0;
                closeModal(); showToast('Nhập sai quá số lần cho phép — tạm khoá '+(SEAL.lockMinutes||10)+' phút','err');
                resolve(false); return;
              }
              const el=$('#sealErr'); if(el) el.textContent='Mật khẩu không đúng. Còn '+left+' lần thử.';
            }
          } }
      ]);
    setTimeout(()=>{ const el=$('#sealPw'); if(el){ el.focus(); el.addEventListener('keydown',e=>{ if(e.key==='Enter'){ const b=$('#sealOk'); if(b) b.click(); } }); } }, 60);
  });
}

/* ==========================================================================
 *  LƯU TRỮ HỒ SƠ GIẤY CHỨNG NHẬN — vòng đời và thời hạn
 *
 *  CĂN CỨ PHÁP LÝ (đã tra cứu):
 *  • Điều 9 khoản 4 Thông tư 32/2023/TT-BYT: cơ sở cập nhật kiến thức y khoa
 *    liên tục có trách nhiệm quản lý và lưu trữ hồ sơ, chương trình, tài liệu
 *    các khoá đào tạo/bồi dưỡng ngắn hạn, hồ sơ hội nghị, hội thảo CME của cơ
 *    sở; quản lý việc xác nhận người hành nghề đã hoàn thành CME.
 *  • Thông tư 33/2025/TT-BYT (hiệu lực 01/7/2025, thay thế Thông tư 53/2017/TT-BYT)
 *    ban hành Bảng thời hạn lưu trữ hồ sơ, tài liệu ngành y tế. Bảng này KHÔNG
 *    có dòng riêng cho hồ sơ CME; các dòng gần nhất để đơn vị vận dụng:
 *      - Hồ sơ xây dựng chương trình công tác, kế hoạch triển khai chuyên môn: 20 năm
 *      - Hồ sơ kiểm tra, giám sát chuyên môn, nghiệp vụ: 20 năm
 *      - Hồ sơ cấp/cấp lại/thu hồi giấy phép hành nghề (cá nhân): 20 năm
 *      - Hồ sơ hội nghị, hội thảo chuyên môn, nghiệp vụ ngành y tế: 10 năm
 *    Vì giấy chứng nhận CME là căn cứ gia hạn giấy phép hành nghề (chu kỳ 5 năm,
 *    tối thiểu 120 giờ tín chỉ), phần mềm lấy MẶC ĐỊNH 20 NĂM và cho phép đơn vị
 *    tự chỉnh theo Danh mục hồ sơ do đơn vị ban hành.
 *  • Luật Lưu trữ 2024: hết thời hạn lưu trữ, tài liệu phải qua Hội đồng xác định
 *    giá trị tài liệu xem xét mới được tiêu huỷ, hoặc kéo dài thời hạn nếu cần.
 *    Do đó phần mềm chỉ CẢNH BÁO đến hạn, tuyệt đối không tự xoá dữ liệu.
 * ========================================================================== */
function archiveCfg(){ return (CFG.archive = CFG.archive || { auto:true, closeAfterDays:30, retentionYears:20, warnDays:180, lastRun:null }); }
function addYears(iso, years){
  if(!iso) return null;
  const d = new Date(iso+'T00:00:00'); if(isNaN(d)) return null;
  d.setFullYear(d.getFullYear()+years);
  return d.toISOString().slice(0,10);
}
function addDays(iso, days){
  if(!iso) return null;
  const d = new Date(iso+'T00:00:00'); if(isNaN(d)) return null;
  d.setDate(d.getDate()+days);
  return d.toISOString().slice(0,10);
}
function daysBetween(fromIso, toIso){
  const a=new Date(fromIso+'T00:00:00'), b=new Date(toIso+'T00:00:00');
  if(isNaN(a)||isNaN(b)) return 0;
  return Math.round((b-a)/86400000);
}
/* Ngày đóng hồ sơ dự kiến của một chương trình = ngày kết thúc + số ngày cấu hình */
function programCloseDue(pg){
  const a = archiveCfg();
  return pg && pg.ngayKetThuc ? addDays(pg.ngayKetThuc, a.closeAfterDays||30) : null;
}
function certRetentionYears(cert){
  const a = archiveCfg();
  return (cert && cert.hoSo && cert.hoSo.retentionYears) || a.retentionYears || 20;
}
function certHoSo(cert){
  if(!cert.hoSo) cert.hoSo = { state:'active', closedAt:null, dueAt:null, retentionYears:null, note:'' };
  return cert.hoSo;
}
/* Rà soát toàn bộ dữ liệu: đóng hồ sơ đã đủ điều kiện, tính ngày hết thời hạn.
   Chạy tự động khi mở phần mềm và khi bấm nút rà soát. Không bao giờ xoá gì. */
function runArchiveJob(opts){
  const a = archiveCfg();
  const today = todayISO();
  let closed = 0, due = 0;
  DATA.certificates.forEach(cert=>{
    const hs = certHoSo(cert);
    if(cert.trangThai==='huy' || cert.trangThai==='thu_hoi'){
      /* Giấy đã huỷ/thu hồi vẫn phải lưu — hồ sơ đóng ngay tại thời điểm huỷ */
      if(hs.state==='active'){ hs.state='archived'; hs.closedAt = cert.ngayHuy || cert.ngayCap || today; closed++; }
    } else {
      const pg = byId(DATA.programs, cert.programId) || cert.programSnapshot;
      const dueClose = pg ? programCloseDue(pg) : addDays(cert.ngayCap, a.closeAfterDays||30);
      if(hs.state==='active'){
        if(dueClose && dueClose <= today){
          if(a.auto || (opts&&opts.force)){ hs.state='archived'; hs.closedAt = dueClose; closed++; }
          else hs.state='pending';
        }
      } else if(hs.state==='pending' && (a.auto || (opts&&opts.force)) && dueClose && dueClose<=today){
        hs.state='archived'; hs.closedAt = dueClose; closed++;
      }
    }
    if(hs.state==='archived' || hs.state==='due'){
      hs.dueAt = addYears(hs.closedAt || cert.ngayCap, certRetentionYears(cert));
      if(hs.dueAt && hs.dueAt <= today && hs.state!=='due'){ hs.state='due'; due++; }
    }
  });
  a.lastRun = new Date().toISOString();
  saveData(); saveCfg();
  return { closed, due };
}
function archiveBuckets(){
  const a = archiveCfg(), today = todayISO();
  const b = { active:[], pending:[], archived:[], due:[], soon:[] };
  DATA.certificates.forEach(cert=>{
    const hs = certHoSo(cert);
    const pg = byId(DATA.programs, cert.programId) || cert.programSnapshot;
    const dueClose = pg ? programCloseDue(pg) : addDays(cert.ngayCap, a.closeAfterDays||30);
    const row = { cert, hs, pg, dueClose };
    if(hs.state==='due') b.due.push(row);
    else if(hs.state==='archived'){
      b.archived.push(row);
      if(hs.dueAt && daysBetween(today, hs.dueAt) <= (a.warnDays||180)) b.soon.push(row);
    }
    else if(dueClose && dueClose <= today) b.pending.push(row);
    else b.active.push(row);
  });
  return b;
}

   tự, hồ sơ đề nghị cấp lại — vì vậy phần mềm yêu cầu tối thiểu: lý do cấp lại
   (đối chiếu 3 căn cứ nêu trên), ngày cấp lại, người/bộ phận chỉ đạo và cho

const LY_DO_CAP_LAI = {
  mat:'Bị mất', hong:'Bị hỏng', loi_ky_thuat:'Cần thay thế do lỗi kỹ thuật', khac:'Lý do khác (ghi chú rõ bên dưới)'
};
function readFileAsDataUrl(file, maxBytes){
  return new Promise((resolve)=>{
    if(file.size > (maxBytes||5*1024*1024)){ resolve({tooBig:true, name:file.name, size:file.size}); return; }
    const reader = new FileReader();
    reader.onload = ()=>resolve({ name:file.name, type:file.type, size:file.size, data:reader.result });
    reader.onerror = ()=>resolve(null);
    reader.readAsDataURL(file);
  });
}

function getReportRows(){
  const f = STATE.reportFilter || {};
  let rows = DATA.certificates.map(cert=>{
    const p = byId(DATA.participants, cert.participantId) || cert.participantSnapshot || {};
    const pg = byId(DATA.programs, cert.programId) || cert.programSnapshot || {};
    const h = hinhThucById(cert.hinhThucSnapshot);
    const vt = vaiTroById(cert.hinhThucSnapshot, cert.vaiTroSnapshot);
    return {
      soGiay:cert.soGiay, hoTen:p.hoTen||'', donViCongTac:p.donViCongTac||'', chucDanh:p.chucDanh||'',
      chuongTrinh:pg.ten||'', hinhThuc: h?h.ten:'', vaiTro: vt?vt.ten:'', ngayCap:cert.ngayCap,
      gioTinChi:cert.gioTinChi||0, trangThai:cert.trangThai||'valid'
    };
  });
  if(!f.includeInactive) rows = rows.filter(r=>r.trangThai==='valid'||r.trangThai==='dinh_chinh');
  if(f.tuNgay) rows = rows.filter(r=>r.ngayCap && r.ngayCap>=f.tuNgay);
  if(f.denNgay) rows = rows.filter(r=>r.ngayCap && r.ngayCap<=f.denNgay);
  if(f.hinhThuc) rows = rows.filter(r=>r.hinhThuc===((hinhThucById(f.hinhThuc)||{}).ten));
  if(f.donVi) rows = rows.filter(r=>(r.donViCongTac||'').toLowerCase().includes(f.donVi.toLowerCase()));
  rows.sort((a,b)=>(a.ngayCap||'').localeCompare(b.ngayCap||''));
  return rows;
}

  return a.join(' · ');

/* Chia danh sách thành từng trang để bảng không bị cắt ngang khi chụp ảnh */
function reportPagesHtml(rows, byHT, totalHours){
  const first = 16, per = 26;           /* trang đầu ít dòng hơn vì có phần tiêu đề */
  const chunks = [];
  if(rows.length===0) chunks.push([]);
  for(let i=0;i<rows.length;){
    const take = chunks.length===0 ? first : per;
    chunks.push(rows.slice(i, i+take)); i += take;
  }
  const total = chunks.length + 1;      /* +1 cho trang tổng hợp & ký */
  let seq = 0;
  const pages = chunks.map((chunk, ci)=>{
    const head = ci===0
      ? reportDocHeader('BÁO CÁO THỐNG KÊ CẤP GIẤY CHỨNG NHẬN\nCẬP NHẬT KIẾN THỨC Y KHOA LIÊN TỤC'.replace('\n',' '), reportFilterText())
      : `<div style="text-align:right;font-style:italic;font-size:11pt;margin-bottom:3mm;">(tiếp theo)</div>`;
    const body = `<table class="d">
      <thead><tr><th style="width:9mm;">TT</th><th style="width:30mm;">Số giấy</th><th>Họ và tên</th>
        <th>Đơn vị công tác</th><th>Chương trình / hoạt động</th><th style="width:34mm;">Hình thức</th>
        <th style="width:30mm;">Vai trò</th><th style="width:22mm;">Ngày cấp</th><th style="width:16mm;">Giờ TC</th></tr></thead>
      <tbody>${chunk.length===0?'<tr><td colspan="9" class="c">Không có dữ liệu phù hợp bộ lọc</td></tr>':
        chunk.map(r=>{ seq++; return `<tr><td class="c">${seq}</td><td>${esc(r.soGiay)}</td><td>${esc(r.hoTen)}</td>
          <td>${esc(r.donViCongTac)}</td><td>${esc(r.chuongTrinh)}</td><td>${esc(r.hinhThuc)}</td>
          <td>${esc(r.vaiTro)}</td><td class="c">${fmtDate(r.ngayCap)}</td><td class="r">${fmtNum(r.gioTinChi)}</td></tr>`;}).join('')}
      </tbody></table>`;
    return `<div class="rpa land">${head}${ci===0?'<h2>I. Danh sách giấy chứng nhận đã cấp</h2>':''}${body}
      <div class="pgno">Trang ${ci+1}/${total}</div></div>`;
  });
  const htRows = Object.entries(byHT).sort((a,b)=>b[1]-a[1]);
  pages.push(`<div class="rpa">
    <h2>II. Tổng hợp theo hình thức cập nhật kiến thức y khoa liên tục</h2>
    <table class="d"><thead><tr><th style="width:12mm;">TT</th><th>Hình thức</th>
      <th style="width:30mm;">Số giấy</th><th style="width:32mm;">Tổng giờ tín chỉ</th></tr></thead>
      <tbody>${htRows.length===0?'<tr><td colspan="4" class="c">Không có dữ liệu</td></tr>':
        htRows.map(([k,v],i)=>{
          const n = rows.filter(r=>(r.hinhThuc||'Khác')===k).length;
          return `<tr><td class="c">${i+1}</td><td>${esc(k)}</td><td class="c">${n}</td><td class="r">${fmtNum(v)}</td></tr>`;
        }).join('')}
        <tr><td colspan="2" style="font-weight:bold;text-align:right;">TỔNG CỘNG</td>
          <td class="c" style="font-weight:bold;">${rows.length}</td>
          <td class="r" style="font-weight:bold;">${fmtNum(totalHours)}</td></tr>
      </tbody></table>
    <h2>III. Nhận xét</h2>
    <div style="text-align:justify;">Trong kỳ báo cáo, đơn vị đã cấp <b>${rows.length}</b> giấy chứng nhận tham gia cập nhật
      kiến thức y khoa liên tục cho <b>${new Set(rows.map(r=>r.hoTen)).size}</b> người, tương ứng
      <b>${fmtNum(totalHours)}</b> giờ tín chỉ. Giấy chứng nhận chỉ xác nhận hoạt động và số giờ tín chỉ ghi trên giấy,
      không xác nhận việc hoàn thành tổng số giờ tín chỉ phục vụ thủ tục giấy phép hành nghề (Điều 3.5 Thông tư 32/2023/TT-BYT).</div>
    ${reportSignBlock()}
    <div class="pgno">Trang ${total}/${total}</div></div>`);
  return pages;
}
async function exportReportPDF(rows, byHT, totalHours){
  if(typeof html2canvas==='undefined' || !window.jspdf){ showToast('Chưa nạp được thư viện tạo PDF. Kiểm tra kết nối mạng rồi thử lại.','err'); return; }
  showToast('Đang dựng báo cáo PDF...','ok');
  try{
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({unit:'mm', format:'a4', orientation:'landscape', compress:true});
    const pages = reportPagesHtml(rows, byHT, totalHours);
    for(let i=0;i<pages.length;i++){
      const wrap = document.createElement('div');
      wrap.style.cssText='position:fixed;left:-99999px;top:0;';
      wrap.innerHTML = reportPageStyle() + pages[i];
      document.body.appendChild(wrap);
      try{
        const el = wrap.querySelector('.rpa');
        const land = el.classList.contains('land');
        await waitForImages(wrap);
        const canvas = await html2canvas(el, {scale:2, backgroundColor:'#ffffff', logging:false,
          width: el.offsetWidth, height: el.offsetHeight});
        /* Trang đầu dùng luôn trang có sẵn của tài liệu (đã đặt khổ ngang khi khởi tạo) */
        if(i>0) pdf.addPage('a4', land?'landscape':'portrait');
        const W = land?297:210, H = land?210:297;
        pdf.addImage(canvas.toDataURL('image/jpeg',0.95),'JPEG',0,0,W,H,undefined,'FAST');
      } finally { wrap.remove(); }
    }
    pdf.save('BaoCaoThongKe_CME_'+todayISO()+'.pdf');
    showToast('Đã tạo báo cáo PDF — chữ tiếng Việt hiển thị đúng dấu','ok');
  }catch(e){ showToast('Lỗi khi tạo PDF: '+e.message,'err'); }
}

let CFG = JSON.parse(JSON.stringify(DEFAULT_CFG));
let cfgSaveTimer = null;

function saveCfg(){
  clearTimeout(cfgSaveTimer);
  cfgSaveTimer = setTimeout(async ()=>{
    try{ await storageSet(CFG_KEY, JSON.stringify(CFG)); }
    catch(e){ showToast('Không lưu được cấu hình: '+e.message,'err'); }
  }, 200);
}
async function loadCfg(){
  try{
    const res = await storageGet(CFG_KEY);
    if(res && res.value){
      const p = JSON.parse(res.value);
      CFG = deepMerge(JSON.parse(JSON.stringify(DEFAULT_CFG)), p);
    }
  }catch(e){ /* dùng mặc định */ }
  if(!CFG.qr.salt) CFG.qr.salt = randomToken(12);
}
function deepMerge(base, over){
  Object.keys(over||{}).forEach(k=>{
    if(over[k] && typeof over[k]==='object' && !Array.isArray(over[k]) && base[k] && typeof base[k]==='object' && !Array.isArray(base[k])){
      base[k] = deepMerge(base[k], over[k]);
    }else if(over[k]!==undefined){ base[k]=over[k]; }
  });
  return base;
}
function randomToken(n){
  const cs='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s=''; const arr=new Uint32Array(n);
  (window.crypto||window.msCrypto).getRandomValues(arr);
  for(let i=0;i<n;i++) s+=cs[arr[i]%cs.length];
  return s;
}

/* --------------------- Cầu nối ứng dụng desktop (nếu có) ------------------ */
/* Khi đóng gói bằng Electron, preload script chỉ cần expose window.cmeNative với:
     hasDrive(letter) -> Promise<boolean>
     ensureFolder(path) -> Promise<string>   (tạo nếu chưa có, trả về đường dẫn)
     writeFile(path, base64|string) / readFile(path) / listFiles(path)
   Toàn bộ giao diện dưới đây sẽ tự chuyển sang chế độ "native" và dò ổ D: → C:. */
const NATIVE = (typeof window!=='undefined' && window.cmeNative) ? window.cmeNative : null;
const HAS_FSAPI = (typeof window!=='undefined' && typeof window.showDirectoryPicker==='function');

/* ------------------- Lưu "tay cầm thư mục" (handle) vào IndexedDB --------- */
const IDB_NAME='cme_fs', IDB_STORE='handles';
function idbOpen(){
  return new Promise((res,rej)=>{
    const rq = indexedDB.open(IDB_NAME,1);
    rq.onupgradeneeded = ()=>{ rq.result.createObjectStore(IDB_STORE); };
    rq.onsuccess = ()=>res(rq.result);
    rq.onerror = ()=>rej(rq.error);
  });
}
async function idbSet(k,v){ try{ const db=await idbOpen(); return new Promise((res,rej)=>{ const t=db.transaction(IDB_STORE,'readwrite'); t.objectStore(IDB_STORE).put(v,k); t.oncomplete=res; t.onerror=()=>rej(t.error); }); }catch(e){} }
async function idbGet(k){ try{ const db=await idbOpen(); return new Promise((res)=>{ const t=db.transaction(IDB_STORE,'readonly'); const rq=t.objectStore(IDB_STORE).get(k); rq.onsuccess=()=>res(rq.result); rq.onerror=()=>res(null); }); }catch(e){ return null; } }
async function idbDel(k){ try{ const db=await idbOpen(); return new Promise((res)=>{ const t=db.transaction(IDB_STORE,'readwrite'); t.objectStore(IDB_STORE).delete(k); t.oncomplete=res; t.onerror=res; }); }catch(e){} }

/* ------------------------------- Lớp thư mục ----------------------------- */
let ROOT_DIR = null;        /* FileSystemDirectoryHandle khi dùng fsapi */
let ROOT_READY = false;

async function fsVerifyPermission(handle, write){
  if(!handle || !handle.queryPermission) return false;
  const opts = { mode: write?'readwrite':'read' };
  if(await handle.queryPermission(opts)==='granted') return true;
  if(await handle.requestPermission(opts)==='granted') return true;
  return false;
}
/* Khôi phục thư mục đã chọn ở lần chạy trước (không hỏi lại nếu còn quyền) */
async function fsRestoreRoot(silent){
  if(CFG.storage.mode!=='fsapi' || !HAS_FSAPI) return false;
  const h = await idbGet('rootDir');
  if(!h) return false;
  const ok = silent
    ? (h.queryPermission ? (await h.queryPermission({mode:'readwrite'}))==='granted' : false)
    : await fsVerifyPermission(h,true);
  if(!ok) return false;
  ROOT_DIR = h; ROOT_READY = true;
  return true;
}
/* Người dùng chọn ổ đĩa/thư mục cha → phần mềm tự tạo "HO SO CME" bên trong */
async function fsPickRoot(){
  if(!HAS_FSAPI) throw new Error('Trình duyệt này không hỗ trợ chọn thư mục. Hãy dùng Microsoft Edge hoặc Google Chrome.');
  const parent = await window.showDirectoryPicker({ mode:'readwrite', startIn:'desktop' });
  let root;
  if(parent.name === FOLDER_NAME){ root = parent; }
  else { root = await parent.getDirectoryHandle(FOLDER_NAME, { create:true }); }
  await fsEnsureSubFolders(root);
  ROOT_DIR = root; ROOT_READY = true;
  await idbSet('rootDir', root);
  CFG.storage.mode = 'fsapi';
  CFG.storage.folderLabel = (parent.name===FOLDER_NAME? parent.name : parent.name+' \\ '+FOLDER_NAME);
  CFG.storage.rootPath = (parent.name===FOLDER_NAME? parent.name : parent.name+'\\'+FOLDER_NAME);
  saveCfg();
  return root;
}
async function fsEnsureSubFolders(root){
  for(const key of Object.keys(SUB_FOLDERS)){
    try{ await root.getDirectoryHandle(SUB_FOLDERS[key], { create:true }); }catch(e){}
  }
}
async function fsSub(key){
  if(!ROOT_DIR) return null;
  return ROOT_DIR.getDirectoryHandle(SUB_FOLDERS[key]||SUB_FOLDERS.cert, { create:true });
}
/* Ghi một file vào thư mục con. Trả về true nếu thành công. */
async function fsWrite(subKey, filename, blobOrText, mime){
  try{
    if(NATIVE && CFG.storage.mode==='native'){
      const path = CFG.storage.rootPath+'\\'+(SUB_FOLDERS[subKey]||'')+'\\'+filename;
      const data = (blobOrText instanceof Blob) ? await blobToBase64(blobOrText) : blobOrText;
      await NATIVE.writeFile(path, data);
      CFG.storage.lastWrite=new Date().toISOString(); saveCfg();
      return true;
    }
    if(!ROOT_READY) return false;
    const dir = await fsSub(subKey);
    const fh = await dir.getFileHandle(filename, { create:true });
    const w = await fh.createWritable();
    await w.write(blobOrText instanceof Blob ? blobOrText : new Blob([blobOrText], {type:mime||'text/plain'}));
    await w.close();
    CFG.storage.lastWrite=new Date().toISOString(); saveCfg();
    return true;
  }catch(e){ console.warn('fsWrite',e); return false; }
}
async function fsListFiles(subKey){
  try{
    if(!ROOT_READY) return [];
    const dir = await fsSub(subKey);
    const out=[];
    for await (const [name, handle] of dir.entries()){
      if(handle.kind==='file'){ const f=await handle.getFile(); out.push({name, size:f.size, time:f.lastModified, handle}); }
    }
    return out.sort((a,b)=>b.time-a.time);
  }catch(e){ return []; }
}
async function fsReadText(handle){ const f=await handle.getFile(); return f.text(); }
async function fsDeleteFile(subKey, name){
  try{ const dir=await fsSub(subKey); await dir.removeEntry(name); return true; }catch(e){ return false; }
}
function blobToBase64(blob){
  return new Promise(res=>{ const r=new FileReader(); r.onload=()=>res(r.result.split(',')[1]); r.readAsDataURL(blob); });
}

/* Chế độ desktop: tự dò ổ D:, nếu không có thì ổ C: */
async function nativeAutoSetup(){
  if(!NATIVE) return null;
  let letter='D';
  try{ if(!(await NATIVE.hasDrive('D'))) letter='C'; }catch(e){ letter='C'; }
  const path = letter+':\\'+FOLDER_NAME;
  await NATIVE.ensureFolder(path);
  for(const k of Object.keys(SUB_FOLDERS)){ try{ await NATIVE.ensureFolder(path+'\\'+SUB_FOLDERS[k]); }catch(e){} }
  CFG.storage.mode='native'; CFG.storage.drive=letter; CFG.storage.rootPath=path; CFG.storage.folderLabel=path;
  ROOT_READY = true; saveCfg();
  return path;
}
/* Kiểm tra nhanh xem thư mục HO SO CME đã sẵn sàng chưa */
async function storageIsReady(){
  if(CFG.storage.mode==='native') return !!NATIVE;
  if(CFG.storage.mode==='fsapi') return ROOT_READY;
  return false;
}
function storageStatusHtml(){
  if(CFG.storage.mode==='native' && NATIVE)

    return `<span class="status-dot dot-ok"></span>Đang lưu vào thư mục <b>${esc(CFG.storage.folderLabel||FOLDER_NAME)}</b>`;

    return `<span class="status-dot dot-warn"></span>Đã chọn thư mục nhưng cần cấp lại quyền truy cập`;
  return `<span class="status-dot dot-off"></span>Chưa chọn thư mục — dữ liệu đang lưu tạm trong trình duyệt`;

function buildBackupPayload(){
  return {
    _app:'SoQuanLyCME', _version:2, _time:new Date().toISOString(),
    _donVi: DATA.hospital.tenDonVi||'',
    data: DATA, design: DESIGN,
    /* Sao lưu cả thiết lập chữ ký/con dấu; phiên mở khoá KHÔNG được sao lưu */
    seal: (function(){ const x=JSON.parse(JSON.stringify(SEAL)); return x; })(),
    config: (function(){ const c=JSON.parse(JSON.stringify(CFG)); c.google.log=[]; return c; })()
  };
}
function backupFileName(tag){
  const d=new Date();
  const p=n=>String(n).padStart(2,'0');
  return `SaoLuu_CME_${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}${tag?'_'+tag:''}.json`;
}
async function doBackup(mode){ /* mode: 'manual' | 'auto' */
  const payload = JSON.stringify(buildBackupPayload(), null, 2);
  const name = backupFileName(mode==='auto'?'tudong':'');
  let wroteFolder = false;
  if(await storageIsReady()) wroteFolder = await fsWrite('backup', name, payload, 'application/json');
  if(mode==='manual' && !wroteFolder) download(name, payload, 'application/json');
  if(mode==='manual') CFG.backup.lastManual = new Date().toISOString();
  else CFG.backup.lastAuto = new Date().toISOString();
  saveCfg();
  await pruneBackups();
  if(CFG.google.enabled && GS.token) { try{ await gsUploadBackup(name, payload); }catch(e){} }
  return { wroteFolder, name };
}
async function pruneBackups(){
  if(!await storageIsReady()) return;
  const files = (await fsListFiles('backup')).filter(f=>/^SaoLuu_CME_.*\.json$/i.test(f.name));
  const keep = Math.max(3, CFG.backup.keepLast||20);
  for(let i=keep;i<files.length;i++){ await fsDeleteFile('backup', files[i].name); }
}
function applyRestore(parsed){
  const payload = (parsed && parsed._app==='SoQuanLyCME') ? parsed : { data:parsed };
  if(payload.data){ DATA = deepMerge(JSON.parse(JSON.stringify(DEFAULT_DATA)), payload.data); }
  if(payload.design){ DESIGN = deepMerge(JSON.parse(JSON.stringify(DEFAULT_DESIGN)), payload.design); saveDesign(); }
  if(payload.seal){ SEAL = deepMerge(JSON.parse(JSON.stringify(DEFAULT_SEAL)), payload.seal); sealCloseSession(); saveSeal(); }
  if(payload.config){
    const keepStorage = JSON.parse(JSON.stringify(CFG.storage));
    CFG = deepMerge(JSON.parse(JSON.stringify(DEFAULT_CFG)), payload.config);
    CFG.storage = keepStorage;  /* giữ nguyên nơi lưu của máy hiện tại */
    saveCfg();
  }
  saveData();
}
let autoBackupTimer=null;
function scheduleAutoBackup(){
  if(!CFG.backup.auto) return;
  clearTimeout(autoBackupTimer);
  autoBackupTimer = setTimeout(async ()=>{
    const last = CFG.backup.lastAuto ? new Date(CFG.backup.lastAuto).getTime() : 0;
    if(Date.now()-last < 30*60*1000) return;      /* tối đa 30 phút một lần */
    if(!(await storageIsReady())) return;
    await doBackup('auto');
  }, 60*1000);
}

       <div class="k">Số giấy đã cấp</div><div class="v">${(parsed.data&&parsed.data.certificates||[]).length}</div>
       <div class="k">Số người tham gia</div><div class="v">${(parsed.data&&parsed.data.participants||[]).length}</div></div>`
    : `<div class="warn-box">File sao lưu định dạng cũ (chỉ có dữ liệu, không có thiết kế và cấu hình).</div>`;
  openModal('Khôi phục dữ liệu', `${info}
    <div class="danger-box" style="margin-top:14px;">Khôi phục sẽ <b>thay thế toàn bộ</b> dữ liệu đang có trong phần mềm. Nơi lưu hồ sơ trên máy này được giữ nguyên.</div>`, [

async function refreshBackupList(){
  const box = $('#backupList'); if(!box) return;
  if(!(await storageIsReady())){
    box.innerHTML = `<div class="small-muted">Chọn thư mục lưu trữ để phần mềm tự giữ lại các bản sao lưu gần nhất tại đây.</div>`;
    return;
  }
  const files = (await fsListFiles('backup')).filter(f=>/\.json$/i.test(f.name)).slice(0,12);
  if(!files.length){ box.innerHTML=`<div class="small-muted">Chưa có bản sao lưu nào trong thư mục ${SUB_FOLDERS.backup}.</div>`; return; }
  box.innerHTML = `<div class="tbl-wrap" style="max-height:220px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;">
    <table class="tbl"><thead><tr><th>Bản sao lưu</th><th>Thời điểm</th><th>Cỡ</th><th></th></tr></thead>
    <tbody>${files.map((f,i)=>`<tr>
      <td class="mono" style="font-size:12px;">${esc(f.name)}</td>
      <td>${esc(new Date(f.time).toLocaleString('vi-VN'))}</td>
      <td class="mono">${(f.size/1024).toFixed(0)} KB</td>
      <td><button class="btn btn-sm" data-restore="${i}">Khôi phục</button></td>
    </tr>`).join('')}</tbody></table></div>`;
  $all('[data-restore]', box).forEach(b=>b.addEventListener('click', async ()=>{
    const f = files[parseInt(b.dataset.restore)];
    try{ const txt = await fsReadText(f.handle); confirmRestore(JSON.parse(txt)); }
    catch(e){ showToast('Không đọc được bản sao lưu này','err'); }
  }));
}

/* ======================================================================== *
 *  RÀNG BUỘC DỮ LIỆU KHI XOÁ
 *  Nguyên tắc: không được xoá dữ liệu đang là căn cứ của một giấy chứng nhận
 *  còn hiệu lực. Muốn xoá phải hủy bỏ / thu hồi giấy trước (Điều 15).
 * ======================================================================== */
const ACTIVE_CERT = c => c.trangThai!=='huy' && c.trangThai!=='thu_hoi';

function certsOf(kind, id){
  return DATA.certificates.filter(c=>{
    if(kind==='participant') return c.participantId===id;
    if(kind==='program') return c.programId===id;
    if(kind==='record') return c.recordId===id;
    return false;
  });
}
/* Trả về { ok, blockers:[{text, action}], cascade:{label,count}[] , note } */
function guardDeleteParticipant(id){
  const p = byId(DATA.participants,id) || {};
  const certs = certsOf('participant', id);
  const active = certs.filter(ACTIVE_CERT);
  const recs = DATA.records.filter(r=>r.participantId===id);
  const blockers=[], cascade=[];
  if(active.length){
    blockers.push({
      text:`Đang có <b>${active.length}</b> giấy chứng nhận còn hiệu lực mang tên người này (${active.slice(0,3).map(c=>esc(c.soGiay)).join(', ')}${active.length>3?'…':''}). Phải <b>hủy bỏ</b> hoặc <b>thu hồi</b> các giấy này trước khi xoá người tham gia.`,
      action:{ label:'Mở sổ quản lý giấy đã cấp', go:'certlist', search:p.hoTen||'' }
    });
  }
  if(recs.length) cascade.push({ label:'Ghi nhận giờ tín chỉ của người này sẽ bị xoá theo', count:recs.length });
  const inactive = certs.length-active.length;
  return {
    ok: blockers.length===0, blockers, cascade,
    note: inactive ? `${inactive} giấy đã hủy bỏ/thu hồi vẫn được giữ lại trong sổ quản lý để lưu vết (kèm bản chụp thông tin tại thời điểm cấp).` : ''
  };
}
function guardDeleteProgram(id){
  const pg = byId(DATA.programs,id) || {};
  const certs = certsOf('program', id);
  const active = certs.filter(ACTIVE_CERT);
  const recs = DATA.records.filter(r=>r.programId===id);
  const people = new Set(recs.map(r=>r.participantId)).size;
  const blockers=[], cascade=[];
  if(active.length){
    blockers.push({
      text:`Chương trình này đã cấp <b>${active.length}</b> giấy chứng nhận còn hiệu lực. Phải hủy bỏ/thu hồi các giấy đó trước khi xoá chương trình.`,
      action:{ label:'Mở sổ quản lý giấy đã cấp', go:'certlist', search:pg.ten||'' }
    });
  }
  if(recs.length && !active.length){
    blockers.push({
      text:`Chương trình đang có <b>${people}</b> người tham gia với <b>${recs.length}</b> ghi nhận giờ tín chỉ. Hãy gỡ các ghi nhận này trước, hoặc chọn xoá kèm bên dưới.`,
      action:{ label:'Xem ghi nhận của chương trình', go:'records', filterProgram:id },
      soft:true
    });
    cascade.push({ label:'Ghi nhận giờ tín chỉ thuộc chương trình sẽ bị xoá theo', count:recs.length });
  }
  return {
    ok: active.length===0 && recs.length===0,
    softOk: active.length===0,
    blockers, cascade,
    note: active.length ? '' : (recs.length? 'Chọn "Xoá kèm ghi nhận" nếu bạn thực sự muốn gỡ bỏ chương trình cùng toàn bộ ghi nhận của nó.':'')
  };
}
function guardDeleteRecord(id){
  const certs = certsOf('record', id);
  const active = certs.filter(ACTIVE_CERT);
  const blockers=[];
  if(active.length){
    blockers.push({
      text:`Ghi nhận này đã được cấp giấy chứng nhận <b>${esc(active[0].soGiay)}</b> (còn hiệu lực). Phải hủy bỏ/thu hồi giấy trước khi xoá ghi nhận.`,
      action:{ label:'Mở sổ quản lý giấy đã cấp', go:'certlist', search:active[0].soGiay }
    });
  }
  return { ok: blockers.length===0, blockers, cascade:[], note:'' };
}

/* Hộp thoại dùng chung cho mọi thao tác xoá có ràng buộc */
function openDeleteGuardModal(opts){
  /* opts: {title, subject, guard, onConfirm(cascade:boolean)} */
  const g = opts.guard;
  const hardBlocked = g.blockers.some(b=>!b.soft);
  const bodyBlockers = g.blockers.length ? `
    <div class="${hardBlocked?'danger-box':'warn-box'}" style="margin-bottom:14px;">
      <b>${hardBlocked?'Không thể xoá':'Cần xác nhận thêm'}</b>
      <ul class="block-list" style="margin-top:6px;">${g.blockers.map(b=>`<li>${b.text}</li>`).join('')}</ul>
    </div>` : '';
  const bodyCascade = g.cascade.length ? `
    <div class="warn-box" style="margin-bottom:14px;">
      <b>Dữ liệu bị xoá kèm</b>
      <ul class="block-list" style="margin-top:6px;">${g.cascade.map(x=>`<li>${esc(x.label)}: <b>${x.count}</b></li>`).join('')}</ul>
    </div>` : '';
  const noteHtml = g.note ? `<div class="legal">${g.note}</div>` : '';

  const foot = [{ id:'dgClose', label: hardBlocked?'Đóng':'Huỷ', onClick:closeModal }];
  const act = (g.blockers.find(b=>b.action)||{}).action;
  if(act) foot.unshift({ id:'dgGo', label: act.label, onClick:()=>{
      closeModal();
      STATE.tab = act.go;
      if(act.search!==undefined) STATE.search = act.search;
      if(act.filterProgram) STATE.filterProgram = act.filterProgram;
      renderApp();
    }});
  if(!hardBlocked){
    foot.push({ id:'dgYes', label: g.cascade.length?'Xoá kèm dữ liệu liên quan':'Xoá', cls:'btn-danger', onClick:()=>{ closeModal(); opts.onConfirm(true); } });
  }
  openModal(opts.title, `
    <div style="font-size:13.5px;margin-bottom:14px;">Đối tượng: <b>${esc(opts.subject)}</b></div>
    ${bodyBlockers}${bodyCascade}${noteHtml}`, foot);
}

/* ---------------------- Đọc & kiểm tra dữ liệu Excel --------------------- */
function excelDateToISO(v){
  if(v===undefined||v===null||v==='') return { iso:'', err:'' };
  if(typeof v==='number'){
    const d = XLSX.SSF ? XLSX.SSF.parse_date_code(v) : null;
    if(d && d.y) return { iso:`${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`, err:'' };
    return { iso:'', err:'Ngày sinh không đọc được' };
  }
  const s = String(v).trim();
  let m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/);
  if(m){
    const dd=+m[1], mm=+m[2], yy=+m[3];
    if(!isRealDate(yy,mm,dd)) return { iso:'', err:'Ngày sinh không có thật trên lịch' };
    return { iso:`${yy}-${String(mm).padStart(2,'0')}-${String(dd).padStart(2,'0')}`, err:'' };
  }
  m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if(m){
    if(!isRealDate(+m[1],+m[2],+m[3])) return { iso:'', err:'Ngày sinh không có thật trên lịch' };
    return { iso:`${m[1]}-${String(+m[2]).padStart(2,'0')}-${String(+m[3]).padStart(2,'0')}`, err:'' };
  }
  return { iso:'', err:'Ngày sinh phải theo dạng dd/mm/yyyy' };
}
/* Kiểm tra ngày có thật trên lịch (loại 31/02, 31/04...) */
function isRealDate(y,m,d){
  if(m<1||m>12||d<1||d>31) return false;
  const dt = new Date(y, m-1, d);
  return dt.getFullYear()===y && dt.getMonth()===m-1 && dt.getDate()===d;
}
function normName(s){ return (s||'').toString().trim().replace(/\s+/g,' '); }
function keyOfPerson(name, dob){ return normName(name).toLowerCase()+'|'+(dob||''); }

function parseParticipantWorkbook(wb){
  const sheetName = wb.SheetNames.find(n=>/nguoithamgia|người tham gia|danhsach|sheet1/i.test(n.replace(/\s/g,''))) || wb.SheetNames[0];
  const ws = wb.Sheets[sheetName];
  const raw = XLSX.utils.sheet_to_json(ws, { header:1, raw:true, defval:'' });
  if(!raw.length) return { rows:[], sheetName, fatal:'File Excel không có dữ liệu.' };

  /* Tìm dòng tiêu đề: dòng đầu tiên có chứa chữ "họ" và "tên" */
  let headerIdx = raw.findIndex(r=>r.some(c=>/h[ọo]\s*v[àa]\s*t[êe]n/i.test(String(c||''))));
  if(headerIdx<0) headerIdx = 0;
  const header = raw[headerIdx].map(c=>String(c||'').trim().toLowerCase());
  const findCol = (...pats)=>{
    for(const p of pats){ const i = header.findIndex(h=>h.includes(p)); if(i>=0) return i; }
    return -1;
  };
  const map = {
    hoTen: findCol('họ và tên','ho va ten','họ tên','hoten','fullname','name'),
    ngaySinh: findCol('ngày sinh','ngay sinh','sinh','dob'),
    gioiTinh: findCol('giới tính','gioi tinh','phái'),
    chucDanh: findCol('chức danh','chuc danh','trình độ','position'),
    donViCongTac: findCol('đơn vị công tác','don vi cong tac','đơn vị','khoa'),
    soCCHN: findCol('cchn','chứng chỉ hành nghề','giấy phép hành nghề'),
    email: findCol('email','thư điện tử'),
    dienThoai: findCol('điện thoại','dien thoai','sđt','phone'),
    ghiChu: findCol('ghi chú','ghi chu','note')
  };
  if(map.hoTen<0) return { rows:[], sheetName, fatal:'Không tìm thấy cột "Họ và tên" trong file. Hãy dùng đúng file Excel mẫu.' };

  const existingKeys = new Map();
  DATA.participants.forEach(p=>existingKeys.set(keyOfPerson(p.hoTen,p.ngaySinh), p));
  const seenInFile = new Set();
  const rows = [];

  for(let i=headerIdx+1;i<raw.length;i++){
    const r = raw[i]; if(!r) continue;
    const get = k => map[k]>=0 ? r[map[k]] : '';
    const hoTen = normName(get('hoTen'));
    const anyValue = r.some(c=>String(c||'').trim()!=='');
    if(!anyValue) continue;
    const errs=[], warns=[];
    if(!hoTen) errs.push('Thiếu họ và tên');
    if(hoTen && hoTen.length<2) errs.push('Họ tên quá ngắn');
    if(/^(nguyễn văn a|nguyen van a)$/i.test(hoTen)) warns.push('Có vẻ là dòng mẫu');

    const dob = excelDateToISO(get('ngaySinh'));
    if(dob.err) errs.push(dob.err);
    if(dob.iso){
      const y = +dob.iso.slice(0,4);
      const nowY = new Date().getFullYear();
      if(y<1930 || y>nowY-16) errs.push('Năm sinh không hợp lý ('+y+')');
    }
    let gt = String(get('gioiTinh')||'').trim();
    if(/^n[ữu]$/i.test(gt)||/^nu$/i.test(gt)) gt='Nữ';
    else if(/^nam$/i.test(gt)) gt='Nam';
    else if(gt){ warns.push('Giới tính không rõ, tạm ghi Nam'); gt='Nam'; }
    else gt='Nam';

    const email = String(get('email')||'').trim();
    if(email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) warns.push('Email chưa đúng định dạng');
    const phone = String(get('dienThoai')||'').trim();
    if(phone && !/^[0-9+\-.\s()]{8,15}$/.test(phone)) warns.push('Số điện thoại chưa đúng định dạng');

    const k = keyOfPerson(hoTen, dob.iso);
    let dup = null;
    if(hoTen){
      if(seenInFile.has(k)){ errs.push('Trùng với dòng khác trong cùng file'); }
      else seenInFile.add(k);
      if(existingKeys.has(k)){ dup = existingKeys.get(k); warns.push('Đã có trong phần mềm'); }
    }

    rows.push({
      line:i+1,
      data:{
        hoTen, ngaySinh:dob.iso, gioiTinh:gt,
        chucDanh:String(get('chucDanh')||'').trim(),
        donViCongTac:String(get('donViCongTac')||'').trim(),
        soCCHN:String(get('soCCHN')||'').trim(),
        email, dienThoai:phone,
        ghiChu:String(get('ghiChu')||'').trim()
      },
      errs, warns, dup: dup?dup.id:null,
      status: errs.length?'err':(warns.length?'warn':'ok')
    });
  }
  return { rows, sheetName, fatal:'' };
}

function runImportParticipants(){
  const rows = IMPORT_STATE.rows.filter(r=>r.status!=='err');
  if(!rows.length){ showToast('Không có dòng nào hợp lệ để nhập','err'); return; }
  let added=0, updated=0, skipped=0;
  rows.forEach(r=>{
    if(r.dup){
      if(IMPORT_STATE.dupMode==='update'){
        const p = byId(DATA.participants, r.dup);
        if(p){ Object.assign(p, r.data); updated++; }
      }else skipped++;
      return;
    }
    DATA.participants.push(Object.assign({ id:'PP'+Date.now()+'_'+Math.random().toString(36).slice(2,7) }, r.data));
    added++;
  });
  saveData();
  closeModal();
  showToast(`Đã nhập: thêm mới ${added}, cập nhật ${updated}, bỏ qua ${skipped}`,'ok');
  if(CFG.google.enabled && CFG.google.autoSync && GS.token) gsPushTable('NguoiThamGia').catch(()=>{});
  renderTab();
}

const GS = { token:null, expires:0, tokenClient:null, ready:false, busy:false, email:'' };
const GS_SCOPES = 'https://www.googleapis.com/auth/spreadsheets https://www.googleapis.com/auth/drive.file';

function gsLog(msg, kind){
  const line = { t:new Date().toISOString(), m:msg, k:kind||'info' };
  CFG.google.log = (CFG.google.log||[]).slice(-80);

  }).join('') || '<div class="l-info">Chưa có nhật ký đồng bộ.</div>';

/* ------------------------------ Đăng nhập -------------------------------- */
function gsLoadGis(){
  return new Promise((res,rej)=>{
    if(window.google && window.google.accounts && window.google.accounts.oauth2) return res();
    const s=document.createElement('script');
    s.src='https://accounts.google.com/gsi/client'; s.async=true; s.defer=true;
    s.onload=()=>res(); s.onerror=()=>rej(new Error('Không tải được thư viện đăng nhập Google (kiểm tra kết nối mạng)'));
    document.head.appendChild(s);
  });
}
async function gsSignIn(interactive){
  if(!CFG.google.clientId) throw new Error('Chưa khai báo OAuth Client ID');
  await gsLoadGis();
  return new Promise((res,rej)=>{
    try{
      GS.tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CFG.google.clientId,
        scope: GS_SCOPES,
        callback: (resp)=>{
          if(resp.error){ rej(new Error(resp.error_description||resp.error)); return; }
          GS.token = resp.access_token;
          GS.expires = Date.now() + (resp.expires_in||3600)*1000 - 60000;
          GS.ready = true;
          gsLog('Đã kết nối tài khoản Google','ok');
          res(GS.token);
        }
      });
      GS.tokenClient.requestAccessToken({ prompt: interactive?'consent':'' });
    }catch(e){ rej(e); }
  });
}
async function gsEnsureToken(){
  if(GS.token && Date.now()<GS.expires) return GS.token;
  return gsSignIn(false);
}
function gsSignOut(){
  if(GS.token && window.google && google.accounts && google.accounts.oauth2){
    try{ google.accounts.oauth2.revoke(GS.token, ()=>{}); }catch(e){}
  }
  GS.token=null; GS.expires=0; GS.ready=false;
  gsLog('Đã ngắt kết nối tài khoản Google','info');
}

/* ------------------------------- Gọi API --------------------------------- */
async function gapi(url, opts){
  const token = await gsEnsureToken();
  const o = Object.assign({}, opts||{});
  o.headers = Object.assign({ 'Authorization':'Bearer '+token }, o.headers||{});
  const r = await fetch(url, o);
  if(!r.ok){
    let msg = r.status+' '+r.statusText;
    try{ const j = await r.json(); if(j.error && j.error.message) msg = j.error.message; }catch(e){}
    throw new Error(msg);
  }
  const ct = r.headers.get('content-type')||'';
  return ct.includes('json') ? r.json() : r.text();
}

/* ---------------------------- Bảng tính (Sheets) ------------------------- */
async function gsEnsureSpreadsheet(){
  if(CFG.google.spreadsheetId){
    try{
      const meta = await gapi(`https://sheets.googleapis.com/v4/spreadsheets/${CFG.google.spreadsheetId}?fields=sheets.properties.title`);
      const have = (meta.sheets||[]).map(s=>s.properties.title);
      const missing = Object.keys(GS_SHEETS).filter(n=>!have.includes(n));
      if(missing.length) await gsAddSheets(CFG.google.spreadsheetId, missing);
      return CFG.google.spreadsheetId;
    }catch(e){ gsLog('Không mở được bảng tính đã lưu: '+e.message,'err'); }
  }
  const title = 'SO QUAN LY CME - '+(DATA.hospital.tenDonVi||'Don vi');
  const created = await gapi('https://sheets.googleapis.com/v4/spreadsheets', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ properties:{ title }, sheets: Object.keys(GS_SHEETS).map(n=>({ properties:{ title:n } })) })
  });
  CFG.google.spreadsheetId = created.spreadsheetId; saveCfg();
  gsLog('Đã tạo bảng tính mới: '+title,'ok');
  return created.spreadsheetId;
}
async function gsAddSheets(id, names){
  await gapi(`https://sheets.googleapis.com/v4/spreadsheets/${id}:batchUpdate`, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ requests: names.map(n=>({ addSheet:{ properties:{ title:n } } })) })
  });
  gsLog('Đã bổ sung sheet: '+names.join(', '),'info');
}
function gsBuildRows(sheet){
  const head = GS_SHEETS[sheet];
  let body=[];
  if(sheet==='NguoiThamGia'){
    body = DATA.participants.map(p=>{
      const hours = DATA.certificates.filter(x=>x.participantId===p.id && ACTIVE_CERT(x)).reduce((s,x)=>s+(x.gioTinChi||0),0);
      return [p.id,p.hoTen||'',p.ngaySinh?fmtDate(p.ngaySinh):'',p.gioiTinh||'',p.chucDanh||'',p.donViCongTac||'',p.soCCHN||'',p.email||'',p.dienThoai||'',hours];
    });
  } else if(sheet==='ChuongTrinh'){
    body = DATA.programs.map(p=>[p.id,p.ma||'',p.ten||'',(hinhThucById(p.hinhThuc)||{}).ten||'',p.donViChiuTrachNhiem||'',p.ngayBatDau?fmtDate(p.ngayBatDau):'',p.ngayKetThuc?fmtDate(p.ngayKetThuc):'',p.soTiet||'',p.soBuoi||'']);
  } else if(sheet==='GhiNhan'){
    body = DATA.records.map(r=>{
      const p=byId(DATA.participants,r.participantId), pg=byId(DATA.programs,r.programId), vt=vaiTroById(r.hinhThuc,r.vaiTro);
      return [r.id,p?p.hoTen:'',pg?pg.ten:'',(hinhThucById(r.hinhThuc)||{}).ten||'',vt?vt.ten:'',r.soLuong||'',r.gioTinChi||0,r.ghiChu||''];
    });
  } else if(sheet==='ChungNhan'){
    body = DATA.certificates.map(c=>{
      const p = byId(DATA.participants,c.participantId)||c.participantSnapshot||{};
      const pg = byId(DATA.programs,c.programId)||c.programSnapshot||{};
      const vt = vaiTroById(c.hinhThucSnapshot,c.vaiTroSnapshot);
      return [c.id,c.soGiay||'',p.hoTen||'',p.ngaySinh?fmtDate(p.ngaySinh):'',p.donViCongTac||'',pg.ten||'',(hinhThucById(c.hinhThucSnapshot)||{}).ten||'',vt?vt.ten:'',c.gioTinChi||0,c.ngayCap?fmtDate(c.ngayCap):'',(STATUS_LABEL[c.trangThai||'valid']||[''])[0],c.maTraCuu||'',c.driveLink||'',c.syncedAt?new Date(c.syncedAt).toLocaleString('vi-VN'):''];
    });
  } else if(sheet==='TraCuu'){
    body = DATA.certificates.filter(c=>c.maTraCuu).map(c=>{
      const p = byId(DATA.participants,c.participantId)||c.participantSnapshot||{};
      return [c.maTraCuu,c.passHash||'',c.driveFileId||'',c.driveLink||'',c.soGiay||'',p.hoTen||'',c.ngayCap?fmtDate(c.ngayCap):'',(c.trangThai||'valid')];
    });
  }
  return [head, ...body];
}
async function gsPushTable(sheet){
  const id = await gsEnsureSpreadsheet();
  const values = gsBuildRows(sheet);
  await gapi(`https://sheets.googleapis.com/v4/spreadsheets/${id}/values/${encodeURIComponent(sheet)}!A1:ZZ100000:clear`, { method:'POST' });
  await gapi(`https://sheets.googleapis.com/v4/spreadsheets/${id}/values/${encodeURIComponent(sheet)}!A1?valueInputOption=RAW`, {
    method:'PUT', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ values })
  });
  gsLog(`Đã cập nhật sheet ${sheet} (${values.length-1} dòng)`,'ok');
}
async function gsPushAll(){
  if(GS.busy) return;
  GS.busy = true;
  try{
    await gsEnsureToken();
    await gsEnsureSpreadsheet();
    await gsEnsureDriveTree();
    for(const s of Object.keys(GS_SHEETS)) await gsPushTable(s);
    CFG.google.lastSync = new Date().toISOString(); CFG.google.lastError=''; saveCfg();
    gsLog('Đồng bộ toàn bộ dữ liệu hoàn tất','ok');
    return true;
  }catch(e){
    CFG.google.lastError = e.message; saveCfg();
    gsLog('Lỗi đồng bộ: '+e.message,'err');
    throw e;
  }finally{ GS.busy=false; }
}

/* ------------------------------ Drive ------------------------------------ */
async function driveFindOrCreateFolder(name, parentId){
  const q = encodeURIComponent(`name='${name.replace(/'/g,"\\'")}' and mimeType='application/vnd.google-apps.folder' and trashed=false`+(parentId?` and '${parentId}' in parents`:''));
  const found = await gapi(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)&pageSize=1`);
  if(found.files && found.files.length) return found.files[0].id;
  const created = await gapi('https://www.googleapis.com/drive/v3/files', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ name, mimeType:'application/vnd.google-apps.folder', parents: parentId?[parentId]:undefined })
  });
  gsLog('Đã tạo thư mục Drive: '+name,'info');
  return created.id;
}
async function gsEnsureDriveTree(){
  const rootId = CFG.google.driveRootId || await driveFindOrCreateFolder(FOLDER_NAME, null);
  CFG.google.driveRootId = rootId;
  const ids = CFG.google.folderIds || {};
  for(const key of Object.keys(SUB_FOLDERS)){
    if(!ids[key]) ids[key] = await driveFindOrCreateFolder(SUB_FOLDERS[key], rootId);
  }
  CFG.google.folderIds = ids; saveCfg();
  return ids;
}
async function driveUpload(folderKey, filename, blob, mime){
  const ids = await gsEnsureDriveTree();
  const parent = ids[folderKey] || CFG.google.driveRootId;
  const meta = { name: filename, parents:[parent] };
  const boundary = '----cme'+Date.now();
  const body = new Blob([
    `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n`,
    JSON.stringify(meta),
    `\r\n--${boundary}\r\nContent-Type: ${mime||blob.type||'application/octet-stream'}\r\n\r\n`,
    blob,
    `\r\n--${boundary}--`
  ]);
  const res = await gapi('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,webViewLink,webContentLink', {
    method:'POST', headers:{ 'Content-Type':'multipart/related; boundary='+boundary }, body
  });
  gsLog('Đã tải lên Drive: '+filename,'ok');
  return res;
}
async function driveShareAnyoneRead(fileId){
  try{
    await gapi(`https://www.googleapis.com/drive/v3/files/${fileId}/permissions`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ role:'reader', type:'anyone' })
    });
    return true;
  }catch(e){ gsLog('Không đặt được quyền xem cho file: '+e.message,'err'); return false; }
}
async function gsUploadBackup(name, text){
  return driveUpload('backup', name, new Blob([text],{type:'application/json'}), 'application/json');
}
async function gsUploadImage(name, blobOrDataUrl){
  const blob = (typeof blobOrDataUrl==='string') ? dataUrlToBlob(blobOrDataUrl) : blobOrDataUrl;
  return driveUpload('image', name, blob, blob.type);
}
function dataUrlToBlob(dataUrl){
  const [head, b64] = dataUrl.split(',');
  const mime = (head.match(/data:([^;]+)/)||[])[1] || 'application/octet-stream';
  const bin = atob(b64); const arr = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  return new Blob([arr], { type:mime });
}

/* ======================================================================== *
 *  MÃ QR TRA CỨU + MẬT MÃ RIÊNG CHO TỪNG NGƯỜI THAM GIA
 *  Mỗi giấy chứng nhận được gắn:
 *    - maTraCuu : mã tra cứu duy nhất, được mã hoá trong ảnh QR
 *    - matKhau  : mật mã 6 ký tự cấp riêng cho người tham gia
 *    - passHash : SHA-256 của (muối + mã tra cứu + mật mã) — chỉ mã băm này
 *                 được đẩy lên Google Sheets, mật mã gốc không rời khỏi máy.
 * ======================================================================== */
function ensureQrLib(){
  return new Promise((res,rej)=>{
    if(window.QRCode) return res();
    const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';
    s.onload=()=>res(); s.onerror=()=>rej(new Error('Không tải được thư viện tạo mã QR'));
    document.head.appendChild(s);
  });
}
async function sha256Hex(str){
  const buf = new TextEncoder().encode(str);
  const hash = await crypto.subtle.digest('SHA-256', buf);
  return Array.from(new Uint8Array(hash)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function makeLookupCode(cert){
  const y = (cert.ngayCap||todayISO()).slice(0,4);
  const ma = (DATA.hospital.maCoSo||'CME').replace(/[^A-Za-z0-9]/g,'').toUpperCase().slice(0,8);
  return `${ma}-${y}-${randomToken(6)}`;
}
function makePassword(){
  const n = Math.min(10, Math.max(4, CFG.qr.passLength||6));
  return randomToken(n);
}
/* Gắn mã tra cứu + mật mã cho một giấy chứng nhận (nếu chưa có) */
async function attachLookupCredentials(cert, forceNewPassword){
  if(!cert.maTraCuu) cert.maTraCuu = makeLookupCode(cert);
  if(!cert.matKhau || forceNewPassword) cert.matKhau = makePassword();
  cert.passHash = await sha256Hex(CFG.qr.salt + '|' + cert.maTraCuu + '|' + cert.matKhau);
  cert.qrPayload = buildLookupUrl(cert);
  saveData();
  return cert;
}
function buildLookupUrl(cert){
  const base = (CFG.qr.viewerUrl||'').trim();
  if(base){
    return base + (base.includes('?')?'&':'?') + 'code=' + encodeURIComponent(cert.maTraCuu);
  }
  /* Chưa cấu hình cổng tra cứu trực tuyến: mã QR mang chính nội dung tra cứu,
     nhân viên quét bằng phần mềm rồi nhập vào mục "Tra cứu giấy chứng nhận". */
  return 'CME-TRACUU:' + cert.maTraCuu;
}
/* Tạo ảnh QR (dataURL) — đồng bộ sau khi thư viện đã nạp */
function qrDataUrl(text, size){
  if(!window.QRCode) return '';
  const holder = document.createElement('div');
  holder.style.position='fixed'; holder.style.left='-9999px';
  document.body.appendChild(holder);
  try{
    new QRCode(holder, { text, width:size||220, height:size||220, correctLevel: QRCode.CorrectLevel.M });
    const cv = holder.querySelector('canvas');
    const img = holder.querySelector('img');
    const url = cv ? cv.toDataURL('image/png') : (img?img.src:'');
    return url;
  }catch(e){ return ''; }
  finally{ holder.remove(); }
}
async function qrDataUrlAsync(text, size){
  try{ await ensureQrLib(); }catch(e){ return ''; }
  return qrDataUrl(text, size);
}

/* ------------ Đẩy một giấy chứng nhận lên Google + sinh mã QR ------------- */
async function publishCertificate(cert, opts){
  opts = opts||{};
  const result = { cert, drive:false, sheet:false, qr:false, errors:[] };
  const wantQr = opts.qr !== false && CFG.qr.enabled !== false;
  if(wantQr) await attachLookupCredentials(cert, false);

  /* 1. Xuất PDF của giấy */
  let pdfBlob = null;
  try{ pdfBlob = await buildCertPdfBlob([ctxFromCert(cert)]); }
  catch(e){ result.errors.push('Không tạo được file PDF: '+e.message); }

  /* 2. Ghi ra thư mục trên máy */
  const fname = 'GCN_'+slug(cert.soGiay)+'_'+slug((byId(DATA.participants,cert.participantId)||cert.participantSnapshot||{}).hoTen||'')+'.pdf';
  if(pdfBlob && CFG.storage.autoWrite){ await fsWrite('cert', fname, pdfBlob); }

  /* 3. Tải lên Google Drive */
  if(CFG.google.enabled){
    try{
      await gsEnsureToken();
      if(pdfBlob){
        const up = await driveUpload('cert', fname, pdfBlob, 'application/pdf');
        cert.driveFileId = up.id;
        cert.driveLink = up.webViewLink || ('https://drive.google.com/file/d/'+up.id+'/view');
        if(opts.publicLink!==false) await driveShareAnyoneRead(up.id);
        result.drive = true;
      }
    }catch(e){ result.errors.push('Google Drive: '+e.message); }
  }

  /* 4. Ảnh QR */
  if(wantQr) try{
    const url = await qrDataUrlAsync(buildLookupUrl(cert), 260);
    if(url){
      cert.qrDataUrl = url;
      result.qr = true;
      const qrName = 'QR_'+slug(cert.soGiay)+'.png';
      const blob = dataUrlToBlob(url);
      await fsWrite('qr', qrName, blob);
      if(CFG.google.enabled && GS.token){ try{ await driveUpload('qr', qrName, blob, 'image/png'); }catch(e){} }
    }
  }catch(e){ result.errors.push('Mã QR: '+e.message); }

  /* 5. Đẩy dữ liệu lên Sheets */
  if(CFG.google.enabled){
    try{
      await gsPushTable('ChungNhan');
      await gsPushTable('TraCuu');
      cert.syncedAt = new Date().toISOString();
      result.sheet = true;
    }catch(e){ result.errors.push('Google Sheets: '+e.message); }
  }
  cert.published = true;
  saveData();
  return result;
}
/* Xuất PDF thành Blob (dùng lại cơ chế html2canvas + jsPDF của phần mềm) */
async function buildCertPdfBlob(ctxs){
  await ensureSealReady(ctxs, 'lưu bản PDF vào hồ sơ');
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:'mm', format:'a4', orientation:'portrait', compress:true });
  for(let i=0;i<ctxs.length;i++){
    /* Dùng chung bộ kết xuất với nút "Xuất PDF" để bản lưu tự động và bản người
       dùng tải về luôn giống hệt nhau, cùng chờ ảnh nền tải xong trước khi chụp. */
    const canvas = await renderCertCanvas(ctxs[i], EXPORT_CFG.scale);
    const img = canvas.toDataURL('image/jpeg', EXPORT_CFG.pdfQuality);
    if(i>0) doc.addPage();
    doc.addImage(img, 'JPEG', 0, 0, 210, 297, undefined, 'FAST');
  }
  return doc.output('blob');
}

async function doLookup(){
  const code = ($('#lkCode').value||'').trim().toUpperCase();
  const pass = ($('#lkPass').value||'').trim().toUpperCase();
  const msg = $('#lkMsg'); const res = $('#lkResult');
  res.innerHTML=''; STATE.lookup.cert=null;
  if(!code){ msg.innerHTML='<div class="danger-box">Hãy nhập mã tra cứu.</div>'; return; }
  const cleaned = code.replace(/^CME-TRACUU:/,'').replace(/^.*[?&]code=/,'');
  const cert = DATA.certificates.find(x=>(x.maTraCuu||'').toUpperCase()===cleaned);
  if(!cert){ msg.innerHTML='<div class="danger-box">Không tìm thấy giấy chứng nhận với mã tra cứu này.</div>'; return; }
  if(CFG.qr.requirePassword){
    if(!pass){ msg.innerHTML='<div class="danger-box">Hãy nhập mật mã được cấp kèm mã QR.</div>'; return; }
    const h = await sha256Hex(CFG.qr.salt+'|'+cert.maTraCuu+'|'+pass);
    if(h!==cert.passHash){ msg.innerHTML='<div class="danger-box">Mật mã không đúng. Liên hệ đơn vị cấp giấy nếu bạn quên mật mã.</div>'; return; }
  }
  if(cert.trangThai==='huy'||cert.trangThai==='thu_hoi'){
    msg.innerHTML=`<div class="danger-box">Giấy chứng nhận này đã <b>${cert.trangThai==='huy'?'bị hủy bỏ':'bị thu hồi'}</b> và không còn giá trị sử dụng.</div>`;
    return;
  }
  msg.innerHTML='<div class="help-box" style="margin-bottom:0;">Xác thực thành công.</div>';
  STATE.lookup.cert = cert;
  drawLookupResult(cert);
}

  /* Mọi bản xem/tải/in từ cổng tra cứu đều là BẢN SAO */

  const p = ctx.participant||{};
  $('#lkResult').innerHTML = `

      <div class="card-pad">

function showAppsScript(){
  const code = `/**
 * CONG TRA CUU GIAY CHUNG NHAN CME
 * Cach dung:
 *  1. Mo bang tinh "SO QUAN LY CME" tren Google Sheets
 *  2. Extensions -> Apps Script, dan toan bo doan ma nay
 *  3. Deploy -> New deployment -> Web app
 *       Execute as: Me | Who has access: Anyone
 *  4. Sao chep dia chi /exec dan vao o "Dia chi cong tra cuu truc tuyen"
 */
var SALT = '${CFG.qr.salt}';   // phai trung voi muoi trong phan mem
var SHEET = 'TraCuu';

function doGet(e) {
  var code = (e.parameter.code || '').toUpperCase();
  return HtmlService.createHtmlOutput(page(code))
    .setTitle('Tra cuu giay chung nhan CME')
    .addMetaTag('viewport', 'width=device-width, initial-scale=1');
}

function verify(code, pass) {
  var sh = SpreadsheetApp.getActive().getSheetByName(SHEET);
  var rows = sh.getDataRange().getValues();
  for (var i = 1; i < rows.length; i++) {
    if (String(rows[i][0]).toUpperCase() === String(code).toUpperCase()) {
      var want = rows[i][1];
      var got = sha256(SALT + '|' + rows[i][0] + '|' + String(pass).toUpperCase());
      if (got !== want) return { ok: false, msg: 'Mat ma khong dung' };
      if (String(rows[i][7]) === 'huy' || String(rows[i][7]) === 'thu_hoi')
        return { ok: false, msg: 'Giay chung nhan da bi huy bo hoac thu hoi' };
      return { ok: true, link: rows[i][3], so: rows[i][4], ten: rows[i][5], ngay: rows[i][6] };
    }
  }
  return { ok: false, msg: 'Khong tim thay ma tra cuu' };
}

function sha256(s) {
  var raw = Utilities.computeDigest(Utilities.DigestAlgorithm.SHA_256, s, Utilities.Charset.UTF_8);
  return raw.map(function (b) {
    var v = (b < 0 ? b + 256 : b).toString(16);
    return v.length === 1 ? '0' + v : v;
  }).join('');
}

function page(code) {

    '<h2>Tra cuu giay chung nhan CME</h2><p>Nhap mat ma duoc cap kem ma QR</p>' +
    '<input id="c" placeholder="Ma tra cuu" value="' + code + '">' +
    '<input id="p" placeholder="Mat ma">' +
    '<button onclick="go()">Xem giay chung nhan</button><div id="r"></div>' +
    '<script>function go(){document.getElementById("r").innerHTML="Dang kiem tra...";' +
    'google.script.run.withSuccessHandler(function(o){' +
    'document.getElementById("r").innerHTML = o.ok' +
    ' ? "<b>"+o.ten+"</b><br>So giay: "+o.so+"<br>Ngay cap: "+o.ngay+"<br><a target=_blank href=\\'"+o.link+"\\'>Mo va tai giay chung nhan</a>"' +
    ' : "<span style=color:#C0433F>"+o.msg+"</span>";})' +

}`;
  openModal('Mã cổng tra cứu trực tuyến (Google Apps Script)', `

    <textarea id="asCode" readonly style="width:100%;height:320px;font-family:Consolas,monospace;font-size:11.5px;border:1px solid var(--border);border-radius:8px;padding:10px;">${esc(code)}</textarea>`, [
    { id:'asClose', label:'Đóng', onClick:closeModal },
    { id:'asCopy', label:'📋 Sao chép mã', cls:'btn-primary', onClick:()=>{
