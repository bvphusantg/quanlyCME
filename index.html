<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sổ quản lý CME — Quản lý giấy chứng nhận cập nhật kiến thức y khoa liên tục</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/5.0.8/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/1.3.8/FileSaver.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --navy:#142C46;
  --navy-2:#1E3F63;
  --navy-3:#294D73;
  --teal:#1F7A6C;
  --teal-light:#E4F3F0;
  --gold:#B8873A;
  --gold-light:#F6EEDD;
  --bg:#F1F4F7;
  --card:#FFFFFF;
  --border:#E1E6EC;
  --text:#1B2430;
  --text-muted:#647082;
  --danger:#C0433F;
  --danger-light:#FBE9E8;
  --radius:10px;
  --shadow:0 1px 3px rgba(20,44,70,.08), 0 1px 2px rgba(20,44,70,.06);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:"Segoe UI","Helvetica Neue",Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  font-size:14px;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;font-size:14px;}
a{color:var(--teal);}

/* ---------- App shell ---------- */
#app{display:flex;min-height:100vh;}

.sidebar{
  width:248px;flex:0 0 248px;
  background:linear-gradient(180deg,var(--navy) 0%, var(--navy-2) 100%);
  color:#fff;display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;
}
.brand{
  padding:22px 20px 16px;border-bottom:1px solid rgba(255,255,255,.12);
  display:flex;gap:12px;align-items:center;
}
.brand-badge{
  width:40px;height:40px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%, var(--gold), #8a651f);
  display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:15px;color:#2a1c05;flex:none;
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.25);
}
.brand-text{line-height:1.25;}
.brand-text .t1{font-size:13.5px;font-weight:700;letter-spacing:.2px;}
.brand-text .t2{font-size:11px;color:rgba(255,255,255,.6);}

.nav{padding:14px 10px;display:flex;flex-direction:column;gap:2px;flex:1;overflow-y:auto;}
.nav-group-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:rgba(255,255,255,.42);padding:14px 12px 6px;}
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:10px 12px;border-radius:8px;color:rgba(255,255,255,.82);
  font-size:13.5px;font-weight:500;text-decoration:none;border:none;background:transparent;
  width:100%;text-align:left;
}
.nav-item:hover{background:rgba(255,255,255,.08);color:#fff;}
.nav-item.active{background:rgba(255,255,255,.14);color:#fff;box-shadow:inset 3px 0 0 var(--gold);}
.nav-icon{width:17px;text-align:center;flex:none;font-size:14px;}

.sidebar-foot{
  padding:14px 18px 18px;border-top:1px solid rgba(255,255,255,.12);
  font-size:11px;color:rgba(255,255,255,.5);line-height:1.5;
}

.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  background:#fff;border-bottom:1px solid var(--border);
  padding:14px 28px;display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:20;
}
.topbar h1{font-size:17px;margin:0;font-weight:700;color:var(--navy);}
.topbar .sub{font-size:12px;color:var(--text-muted);margin-top:2px;}
.topbar-right{display:flex;gap:10px;align-items:center;}

.content{padding:24px 28px 60px;max-width:1400px;width:100%;margin:0 auto;}

/* ---------- Generic UI ---------- */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);}
.card-pad{padding:20px 22px;}
.card-head{padding:16px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.card-head h2{font-size:15px;margin:0;font-weight:700;color:var(--navy);}
.card-head .desc{font-size:12px;color:var(--text-muted);margin-top:3px;}

.grid{display:grid;gap:16px;}
.grid-2{grid-template-columns:1fr 1fr;}
.grid-3{grid-template-columns:1fr 1fr 1fr;}
.grid-4{grid-template-columns:repeat(4,1fr);}
@media (max-width:900px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr;}}

.stat{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px 18px;box-shadow:var(--shadow);position:relative;overflow:hidden;
}
.stat .label{font-size:11.5px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600;}
.stat .value{font-size:26px;font-weight:800;color:var(--navy);margin-top:6px;}
.stat .foot{font-size:11.5px;color:var(--teal);margin-top:4px;font-weight:600;}
.stat .ring{position:absolute;right:-18px;top:-18px;width:70px;height:70px;border-radius:50%;background:var(--teal-light);z-index:0;}
.stat > *{position:relative;z-index:1;}

.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;font-weight:600;color:var(--navy);margin-bottom:5px;}
.field .hint{font-size:11px;color:var(--text-muted);margin-top:4px;}
.field input[type=text],.field input[type=date],.field input[type=number],.field select,.field textarea{
  width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:7px;background:#fbfcfd;color:var(--text);
  transition:border-color .15s;
}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--teal);background:#fff;}
.field textarea{resize:vertical;min-height:64px;}
.radio-row{display:flex;gap:16px;}
.radio-row label{display:flex;align-items:center;gap:6px;font-weight:500;font-size:13px;color:var(--text);}

.btn{
  display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:8px;border:1px solid var(--border);
  background:#fff;color:var(--navy);font-size:13px;font-weight:600;white-space:nowrap;
}
.btn:hover{border-color:var(--navy-3);}
.btn-primary{background:var(--navy);border-color:var(--navy);color:#fff;}
.btn-primary:hover{background:var(--navy-2);}
.btn-teal{background:var(--teal);border-color:var(--teal);color:#fff;}
.btn-teal:hover{background:#175f54;}
.btn-gold{background:var(--gold);border-color:var(--gold);color:#fff;}
.btn-danger{background:#fff;border-color:var(--danger);color:var(--danger);}
.btn-danger:hover{background:var(--danger-light);}
.btn-sm{padding:6px 10px;font-size:12px;}
.btn[disabled]{opacity:.45;cursor:not-allowed;}
.btn-icon{width:32px;height:32px;padding:0;justify-content:center;}

table.tbl{width:100%;border-collapse:collapse;font-size:13px;}
table.tbl th{
  text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted);
  padding:10px 12px;border-bottom:2px solid var(--border);font-weight:700;background:#fafbfc;white-space:nowrap;
}
table.tbl td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:top;}
table.tbl tr:hover td{background:#f8fafb;}
table.tbl tr:last-child td{border-bottom:none;}
.tbl-wrap{overflow-x:auto;}

.badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;}
.badge-teal{background:var(--teal-light);color:var(--teal);}
.badge-navy{background:#E7EDF4;color:var(--navy);}

/* ---------------- Bảng điều khiển: biểu đồ ---------------- */
.ch-tools{display:flex;gap:6px;align-items:center;}
.ch-tools button{border:1px solid var(--border);background:#fff;border-radius:6px;font-size:11px;font-weight:700;
  color:var(--text-muted);padding:4px 8px;cursor:pointer;line-height:1.2;}
.ch-tools button:hover{border-color:var(--navy-3);color:var(--navy);background:#F4F7FA;}
.ch-box{width:100%;overflow:hidden;}
.ch-box svg{width:100%;height:auto;display:block;}
.ch-empty{text-align:center;color:var(--text-muted);font-size:12.5px;padding:42px 10px;}

/* ---------- Khoá ô cấu hình sau khi lưu ---------- */
.cfg-lockbar{display:flex;align-items:center;gap:9px;}
.cfg-lockbar .st{font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:20px;}
.cfg-lockbar .st.on{background:var(--teal-light);color:#0d3c34;border:1px solid #bfe3dc;}
.cfg-lockbar .st.off{background:var(--gold-light);color:#6b4c15;border:1px solid #ecd9ad;}
.card.cfg-locked .card-pad input:not([type=file]),
.card.cfg-locked .card-pad select,
.card.cfg-locked .card-pad textarea{
  background:#F3F5F8 !important;color:#93A0B0 !important;border-color:#E4E9EF !important;
  cursor:not-allowed;-webkit-text-fill-color:#93A0B0;}
.card.cfg-locked .card-pad label{color:#9AA6B4;}
.card.cfg-locked .card-pad .btn:not(.cfg-allow){opacity:.45;pointer-events:none;}
.card.cfg-locked .card-pad .hint,.card.cfg-locked .card-pad .legal{opacity:.6;}
.cfg-lockmsg{font-size:11.5px;color:var(--text-muted);margin-top:10px;font-style:italic;}

/* ---------- Quét mã QR ---------- */
.scan-modes{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
.scan-modes button{flex:1 1 130px;border:1.5px solid var(--border);background:#fff;border-radius:9px;padding:11px 10px;
  cursor:pointer;font-size:12.5px;font-weight:700;color:var(--navy);display:flex;flex-direction:column;align-items:center;gap:5px;}
.scan-modes button:hover{border-color:var(--navy-3);background:#F5F8FB;}
.scan-modes button.on{border-color:var(--teal);background:var(--teal-light);color:#0d3c34;}
.scan-modes .ic{font-size:19px;line-height:1;}
.scan-stage{position:relative;background:#0d1620;border-radius:10px;overflow:hidden;aspect-ratio:4/3;display:none;}
.scan-stage.on{display:block;}
.scan-stage video{width:100%;height:100%;object-fit:cover;display:block;}
.scan-reticle{position:absolute;top:50%;left:50%;width:58%;aspect-ratio:1;transform:translate(-50%,-50%);
  border:2.5px solid rgba(255,255,255,.85);border-radius:14px;box-shadow:0 0 0 2000px rgba(0,0,0,.35);}
.scan-hint{position:absolute;left:0;right:0;bottom:8px;text-align:center;color:#fff;font-size:11.5px;
  text-shadow:0 1px 3px rgba(0,0,0,.8);}
.scan-wedge{border:1.5px dashed #bfe3dc;background:var(--teal-light);border-radius:9px;padding:10px 12px;margin-bottom:12px;}
.scan-wedge input{width:100%;border:1px solid var(--border);border-radius:6px;padding:8px 10px;font-family:Consolas,monospace;
  font-size:13px;letter-spacing:1px;background:#fff;}
.scan-log{font-size:11.5px;color:var(--text-muted);margin-top:8px;}
.dash-filter{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;}
.dash-presets{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;}
.dash-presets button{border:1px solid var(--border);background:#fff;border-radius:20px;font-size:11.5px;font-weight:600;
  color:var(--text-muted);padding:5px 12px;cursor:pointer;}
.dash-presets button.on{background:var(--navy);border-color:var(--navy);color:#fff;}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px;margin-bottom:18px;}
.kpi{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:14px 15px;position:relative;overflow:hidden;box-shadow:var(--shadow);}
.kpi:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--navy-3);}
.kpi.k-teal:before{background:var(--teal);} .kpi.k-gold:before{background:var(--gold);} .kpi.k-red:before{background:var(--danger);}
.kpi .lb{font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.4px;}
.kpi .vl{font-size:25px;font-weight:800;color:var(--navy);line-height:1.15;margin-top:5px;font-variant-numeric:tabular-nums;}
.kpi .ft{font-size:11px;color:var(--text-muted);margin-top:3px;}
.rp-page{width:210mm;min-height:297mm;background:#fff;padding:15mm 15mm 12mm;box-sizing:border-box;
  font-family:'Times New Roman',Times,serif;color:#000;position:relative;}
.rp-page h1{font-size:16pt;text-align:center;margin:0 0 2mm;color:#142C46;}
.rp-page h2{font-size:12pt;margin:6mm 0 2mm;color:#142C46;border-bottom:1px solid #d9dfe6;padding-bottom:1mm;}
.rp-meta{font-size:9.5pt;text-align:center;color:#444;margin-bottom:4mm;}
.rp-tbl{width:100%;border-collapse:collapse;font-size:8.6pt;}
.rp-tbl th,.rp-tbl td{border:1px solid #c9d1da;padding:1.6mm 2mm;}
.rp-tbl th{background:#EEF2F6;font-weight:700;text-align:left;}
.rp-kpi{display:flex;flex-wrap:wrap;gap:3mm;margin-bottom:3mm;}
.rp-kpi>div{flex:1 1 40mm;border:1px solid #c9d1da;border-radius:2mm;padding:2.5mm 3mm;}
.rp-kpi .l{font-size:8pt;color:#555;} .rp-kpi .v{font-size:14pt;font-weight:700;color:#142C46;}
.badge-gold{background:var(--gold-light);color:#8a651f;}
.badge-gray{background:#EEF1F4;color:var(--text-muted);}
.badge-danger{background:var(--danger-light);color:var(--danger);}

.empty{padding:44px 20px;text-align:center;color:var(--text-muted);}
.empty .ic{font-size:30px;margin-bottom:8px;}
.empty b{color:var(--navy);}

.modal-bg{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(15,25,40,.5);display:none;align-items:flex-start;justify-content:center;z-index:100;padding:40px 16px;overflow-y:auto;}
.modal-bg.open{display:flex;}
.modal{background:#fff;border-radius:12px;max-width:640px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3);}
.modal-head{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
.modal-head h3{margin:0;font-size:15.5px;color:var(--navy);}
.modal-body{padding:20px 22px;max-height:70vh;overflow-y:auto;}
.modal-foot{padding:16px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;}
.modal-close{background:none;border:none;font-size:20px;color:var(--text-muted);line-height:1;}

.toast-wrap{position:fixed;bottom:22px;right:22px;z-index:200;display:flex;flex-direction:column;gap:8px;}
.toast{background:var(--navy);color:#fff;padding:11px 16px;border-radius:8px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.2);min-width:220px;}
.toast.err{background:var(--danger);}
.toast.ok{background:var(--teal);}

.tag-pill{display:inline-block;padding:2px 8px;border-radius:6px;background:#EEF1F4;font-size:11.5px;color:var(--navy-2);font-weight:600;}
.legal{font-size:11px;color:var(--text-muted);background:#F6F8FA;border-left:3px solid var(--teal);padding:8px 12px;border-radius:0 6px 6px 0;margin-top:10px;line-height:1.5;}
.checkbox-cell{width:34px;}
.right{text-align:right;}
.center{text-align:center;}
.mono{font-variant-numeric:tabular-nums;}
.link-btn{background:none;border:none;color:var(--teal);font-weight:600;font-size:12.5px;padding:0;}
.hstack{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.spacer{flex:1;}
.search-box{position:relative;}
.search-box input{padding-left:30px;}
.search-box:before{content:"⌕";position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text-muted);font-size:15px;}

/* ---------- Certificate ---------- */
.cert-stage{background:#DCE3EA;padding:34px;border-radius:12px;display:flex;justify-content:center;overflow-x:auto;}
.cert-page{
  width:210mm;min-height:297mm;background:#fff;
  box-shadow:0 6px 24px rgba(0,0,0,.22);
  padding:20mm 22mm 18mm;
  font-family:"Times New Roman",Times,serif;color:#000;
  position:relative;
}
.cert-header-tbl{width:100%;border-collapse:collapse;}
.cert-header-tbl td{vertical-align:top;padding:0;border:none;width:50%;}
.cert-org{text-align:center;font-weight:400;font-size:13pt;line-height:1.35;}
.cert-org b{font-weight:700;}
.cert-nation{text-align:center;font-weight:700;font-size:13pt;line-height:1.35;}
.cert-nation .line1{white-space:nowrap;display:inline-block;font-size:12.6pt;}
.cert-nation .line2{display:inline-block;border-bottom:1px solid #000;padding-bottom:3px;line-height:1.3;}
.cert-hr-left{border-bottom:1px solid #000;width:70px;margin:5px auto 0;}
.cert-so{text-align:center;font-size:13pt;margin-top:6px;}
.cert-title-wrap{text-align:center;margin-top:26px;}
.cert-title{font-size:22pt;font-weight:700;letter-spacing:1px;color:#C00000;}
.cert-subtitle{font-size:14pt;font-weight:700;margin-top:8px;line-height:1.45;color:#C00000;}
.cert-body{margin-top:26px;font-size:13pt;line-height:1.9;text-align:justify;}
.cert-body .ln{margin-bottom:2px;}
.cert-body .field-val{font-weight:700;}
.cert-body .indent{padding-left:0;}
.cert-quydoi{text-align:center;font-size:13pt;font-weight:700;margin-top:14px;}
.cert-bangchu{text-align:center;font-size:12.5pt;font-style:italic;margin-top:2px;}
.cert-sign-wrap{width:100%;border-collapse:collapse;margin-top:34px;}
.cert-sign-wrap td{border:none;vertical-align:top;width:50%;}
.cert-sign-right{text-align:center;font-size:13pt;}
.cert-sign-right .place{font-style:italic;}
.cert-sign-right .role{font-weight:700;margin-top:4px;text-transform:uppercase;}
.cert-sign-name{margin-top:80px;font-weight:700;}
.cert-seal-hint{position:absolute;font-size:9pt;color:#bbb;bottom:8mm;left:22mm;}
.cert-toolbar{display:flex;justify-content:center;gap:10px;margin-bottom:16px;flex-wrap:wrap;}

/* ---------- Hộp thoại "Xuất & In giấy chứng nhận" ---------- */
.exp-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-top:4px;}
.exp-card{position:relative;text-align:left;border:1.5px solid var(--border);border-radius:10px;background:#fff;padding:14px 14px 13px;cursor:pointer;transition:all .15s;display:flex;flex-direction:column;gap:5px;}
.exp-card:hover{border-color:var(--navy);box-shadow:0 4px 14px rgba(20,50,80,.13);transform:translateY(-1px);}
.exp-card:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none;}
.exp-card .exp-ico{font-size:22px;line-height:1;}
.exp-card .exp-name{font-weight:700;font-size:13.5px;color:var(--navy);}
.exp-card .exp-desc{font-size:11.5px;color:var(--text-muted);line-height:1.5;}
.exp-card .exp-tag{position:absolute;top:9px;right:9px;font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;background:var(--teal-light);color:#0d3c34;border:1px solid #bfe3dc;}
.exp-card.exp-best{border-color:#bfe3dc;background:linear-gradient(180deg,#fbfffe,#fff);}
.exp-opts{display:flex;flex-wrap:wrap;gap:14px;align-items:center;background:#F5F7F9;border:1px solid var(--border);border-radius:10px;padding:11px 13px;margin:14px 0 4px;font-size:12.5px;font-weight:600;color:var(--navy);}
.exp-opts label{display:flex;align-items:center;gap:6px;}
.exp-opts select{padding:4px 6px;border:1px solid var(--border);border-radius:6px;font-size:12px;background:#fff;}
.exp-busy{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--navy);font-weight:600;margin-top:12px;}
.exp-busy .spin{width:15px;height:15px;border:2px solid #d7dee5;border-top-color:var(--navy);border-radius:50%;animation:expspin .7s linear infinite;}
@keyframes expspin{to{transform:rotate(360deg);}}

.editor-toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:10px 12px;background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5;border-radius:var(--radius) var(--radius) 0 0;}
.editor-toolbar button{padding:6px 10px;border:1px solid var(--border);background:#fff;border-radius:6px;font-size:12.5px;cursor:pointer;color:var(--navy);}
.editor-toolbar button:hover{background:#EEF2F5;border-color:var(--navy-3);}
.editor-toolbar select, .editor-toolbar input[type=color]{padding:5px 6px;border:1px solid var(--border);border-radius:6px;font-size:12.5px;background:#fff;}
.editor-toolbar input[type=color]{width:38px;height:30px;padding:2px;}
.editor-toolbar .tb-sep{width:1px;align-self:stretch;background:var(--border);margin:2px 2px;}
.editor-canvas{outline:none;min-height:180mm;}
.editor-canvas .merge-field{background:#FFF3C4;border:1px dashed #B8873A;border-radius:3px;padding:0 4px;color:#6b4c15;font-weight:700;cursor:default;white-space:nowrap;}

/* ============================================================================
   IN TRỰC TIẾP — khổ A4 cố định
   LỖI CŨ: quy tắc ".cert-page{width:auto;min-height:0}" làm trang giấy co lại
   đúng bằng chiều cao chữ khi in. Khung viền / hoạ tiết góc được đặt tuyệt đối
   theo trang nên bị "kéo lên" theo, không còn ôm trọn tờ A4 (đúng lỗi đã gặp).
   NAY: khi in, trang giấy được ép cứng 210x297mm y hệt bản xem trước.
   ============================================================================ */
@media print{
  #app{display:none !important;}
  .toast-wrap, .modal-bg{display:none !important;}
  html,body{background:#fff !important;margin:0 !important;padding:0 !important;}
  .content{padding:0;max-width:none;}
  #printArea{display:block !important;position:static !important;left:auto !important;}
  #shapeOverlay{display:none !important;}
  .cert-stage{background:#fff;padding:0;box-shadow:none;}
  .cert-toolbar{display:none;}
  /* Ép đúng khổ A4: KHÔNG dùng width:auto / min-height:0 */
  #printArea .cert-page{
    box-shadow:none !important;
    width:210mm !important;
    height:297mm !important;
    min-height:297mm !important;
    max-height:297mm !important;
    padding:20mm 22mm 18mm !important;
    margin:0 !important;
    position:relative !important;
    overflow:hidden !important;
    break-inside:avoid; page-break-inside:avoid;
  }
  #printArea .cert-page + .cert-page{ break-before:page; page-break-before:always; }
  #printArea .cert-page:last-child{ page-break-after:auto; break-after:auto; }
  /* Bắt buộc trình duyệt in đúng màu nền, khung viền, hoạ tiết và hình chìm */
  #printArea, #printArea *{
    -webkit-print-color-adjust:exact !important;
    print-color-adjust:exact !important;
    color-adjust:exact !important;
  }
  @page{size:A4 portrait;margin:0;}
}
/* Vùng in luôn tồn tại trong DOM (không display:none) để trình duyệt tải xong
   ảnh nền/hình chìm trước khi mở hộp thoại in — tránh in ra trang trắng khung. */
#printArea{position:absolute;left:-99999px;top:0;width:210mm;}

.tabs-hidden{display:none;}
.help-box{background:var(--teal-light);border:1px solid #cfe9e3;border-radius:8px;padding:12px 14px;font-size:12.5px;color:#125349;line-height:1.55;margin-bottom:16px;}
.help-box b{color:#0d3c34;}
.rate-table td,.rate-table th{font-size:12px;}
.small-muted{font-size:11.5px;color:var(--text-muted);}

/* ==================== BỔ SUNG: Trình hướng dẫn lần đầu ==================== */
.wizard{max-width:720px;}
.wiz-steps{display:flex;gap:0;margin-bottom:18px;}
.wiz-step{flex:1;text-align:center;font-size:11.5px;color:var(--text-muted);position:relative;padding-top:26px;font-weight:600;}
.wiz-step:before{content:attr(data-n);position:absolute;top:0;left:50%;transform:translateX(-50%);width:22px;height:22px;border-radius:50%;background:#E3E8ED;color:var(--text-muted);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;}
.wiz-step.done:before{background:var(--teal);color:#fff;content:"✓";}
.wiz-step.active:before{background:var(--navy);color:#fff;}
.wiz-step.active{color:var(--navy);}
.wiz-step:after{content:"";position:absolute;top:11px;left:50%;width:100%;height:2px;background:#E3E8ED;z-index:-1;}
.wiz-step:last-child:after{display:none;}
.wiz-body{min-height:210px;}
.choice{display:flex;gap:12px;align-items:flex-start;border:1.5px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:10px;cursor:pointer;background:#fff;transition:border-color .15s,background .15s;}
.choice:hover{border-color:var(--navy-3);background:#FAFCFE;}
.choice.sel{border-color:var(--teal);background:var(--teal-light);}
.choice .ci{font-size:20px;flex:none;line-height:1.2;}
.choice .ct{font-weight:700;color:var(--navy);font-size:13.5px;}
.choice .cd{font-size:12px;color:var(--text-muted);margin-top:3px;line-height:1.5;}
.choice.disabled{opacity:.5;cursor:not-allowed;}
.path-box{font-family:Consolas,"Courier New",monospace;background:#0F2233;color:#9FE8D8;padding:9px 12px;border-radius:7px;font-size:12.5px;word-break:break-all;}
.kv{display:grid;grid-template-columns:170px 1fr;gap:6px 14px;font-size:13px;}
.kv .k{color:var(--text-muted);font-weight:600;}
.kv .v{color:var(--text);font-weight:600;}
.status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle;}
.dot-ok{background:var(--teal);} .dot-warn{background:var(--gold);} .dot-err{background:var(--danger);} .dot-off{background:#B9C3CE;}

/* ==================== BỔ SUNG: Nhập từ Excel ==================== */
.imp-summary{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;}
.imp-pill{border:1px solid var(--border);border-radius:8px;padding:8px 14px;font-size:12px;font-weight:700;background:#fff;}
.imp-pill b{display:block;font-size:19px;margin-top:2px;}
.imp-pill.ok b{color:var(--teal);} .imp-pill.warn b{color:var(--gold);} .imp-pill.err b{color:var(--danger);}
.row-ok{background:#fff;} .row-warn{background:#FFFBF0;} .row-err{background:#FDF3F2;}
.msg-err{color:var(--danger);font-size:11.5px;font-weight:600;}
.msg-warn{color:#8a651f;font-size:11.5px;font-weight:600;}
.dropzone{border:2px dashed var(--border);border-radius:10px;padding:26px;text-align:center;color:var(--text-muted);background:#FAFCFE;}
.dropzone.over{border-color:var(--teal);background:var(--teal-light);color:var(--teal);}

/* ==================== BỔ SUNG: Ràng buộc xoá ==================== */
.block-list{margin:0;padding-left:18px;font-size:13px;line-height:1.7;}
.block-list li{margin-bottom:4px;}
.danger-box{background:var(--danger-light);border:1px solid #f0c9c7;border-left:3px solid var(--danger);border-radius:0 8px 8px 0;padding:11px 14px;font-size:12.5px;color:#8a2a27;line-height:1.55;}
.warn-box{background:var(--gold-light);border:1px solid #ecd9ad;border-left:3px solid var(--gold);border-radius:0 8px 8px 0;padding:11px 14px;font-size:12.5px;color:#6b4c15;line-height:1.55;}

/* ==================== BỔ SUNG: Google & QR ==================== */
.gsync-log{max-height:190px;overflow-y:auto;font-family:Consolas,"Courier New",monospace;font-size:11.5px;background:#0F2233;color:#C7D6E2;border-radius:8px;padding:10px 12px;line-height:1.6;}
.gsync-log .l-ok{color:#7FE3CB;} .gsync-log .l-err{color:#FF9C96;} .gsync-log .l-info{color:#9DB6CC;}
.qr-card{display:flex;gap:18px;align-items:flex-start;border:1px solid var(--border);border-radius:10px;padding:16px;background:#fff;}
.qr-img{width:150px;height:150px;flex:none;border:1px solid var(--border);border-radius:8px;padding:6px;background:#fff;}
.qr-img img,.qr-img canvas{width:100%;height:100%;display:block;}
.pass-code{font-family:Consolas,"Courier New",monospace;font-size:22px;font-weight:700;letter-spacing:4px;color:var(--navy);background:var(--gold-light);border:1px dashed var(--gold);border-radius:8px;padding:8px 14px;display:inline-block;}
.lookup-wrap{max-width:1080px;margin:0 auto;}
.lk-grid{display:grid;grid-template-columns:1.35fr .9fr;gap:18px;align-items:start;}
@media(max-width:1040px){.lk-grid{grid-template-columns:1fr;}}
.lk-hero{background:linear-gradient(135deg,var(--navy) 0%,var(--navy-2) 62%,#1d5468 100%);color:#fff;
  border-radius:var(--radius);padding:20px 22px;margin-bottom:16px;position:relative;overflow:hidden;}
.lk-hero:after{content:"";position:absolute;right:-40px;top:-50px;width:190px;height:190px;border-radius:50%;
  background:rgba(255,255,255,.06);}
.lk-hero h2{margin:0 0 5px;font-size:17px;font-weight:700;}
.lk-hero p{margin:0;font-size:12.5px;color:rgba(255,255,255,.72);line-height:1.55;max-width:62ch;}
.lk-chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px;}
.lk-chip{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);
  border-radius:20px;padding:4px 11px;font-size:11.5px;font-weight:600;}
.lk-chip.ok{background:rgba(46,183,151,.22);border-color:rgba(120,225,200,.4);}
.lk-chip.off{background:rgba(255,255,255,.07);color:rgba(255,255,255,.6);}
.lk-tabs{display:flex;gap:4px;background:#EDF1F5;border-radius:10px;padding:4px;margin-bottom:16px;}
.lk-tabs button{flex:1;border:none;background:transparent;border-radius:7px;padding:9px 10px;cursor:pointer;
  font-size:13px;font-weight:700;color:var(--text-muted);display:flex;align-items:center;justify-content:center;gap:7px;}
.lk-tabs button.on{background:#fff;color:var(--navy);box-shadow:0 1px 4px rgba(20,44,70,.13);}
.scan-stage{position:relative;background:#0b131c;border-radius:12px;overflow:hidden;aspect-ratio:4/3;
  display:flex;align-items:center;justify-content:center;}
.scan-stage video{width:100%;height:100%;object-fit:cover;display:none;}
.scan-stage.on video{display:block;}
.scan-stage .idle{color:rgba(255,255,255,.5);font-size:12.5px;text-align:center;padding:0 20px;}
.scan-stage.on .idle{display:none;}
.scan-reticle{position:absolute;top:50%;left:50%;width:56%;aspect-ratio:1;transform:translate(-50%,-50%);
  border-radius:16px;display:none;}
.scan-stage.on .scan-reticle{display:block;}
.scan-reticle:before,.scan-reticle:after{content:"";position:absolute;width:26px;height:26px;border:3px solid #4ade9f;}
.scan-reticle:before{top:-2px;left:-2px;border-right:none;border-bottom:none;border-radius:12px 0 0 0;}
.scan-reticle:after{bottom:-2px;right:-2px;border-left:none;border-top:none;border-radius:0 0 12px 0;}
.scan-scanline{position:absolute;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,#4ade9f,transparent);
  animation:scanmove 2.1s ease-in-out infinite;}
@keyframes scanmove{0%,100%{top:4%;}50%{top:96%;}}
.scan-hint{position:absolute;left:0;right:0;bottom:10px;text-align:center;color:#fff;font-size:11.5px;
  text-shadow:0 1px 4px rgba(0,0,0,.85);}
.scan-ctrl{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
.scan-wedge{border:1px solid var(--border);background:#F7F9FB;border-radius:10px;padding:12px 13px;}
.scan-wedge.on{border-color:#bfe3dc;background:var(--teal-light);}
.scan-wedge input{width:100%;border:1px solid var(--border);border-radius:7px;padding:9px 11px;
  font-family:Consolas,monospace;font-size:13px;letter-spacing:1px;background:#fff;}
.scan-log{font-size:11.5px;color:var(--text-muted);margin-top:8px;line-height:1.5;}
.lk-steps{counter-reset:s;list-style:none;padding:0;margin:0;}
.lk-steps li{counter-increment:s;position:relative;padding:0 0 14px 34px;font-size:12.5px;color:var(--text);line-height:1.55;}
.lk-steps li:before{content:counter(s);position:absolute;left:0;top:-1px;width:23px;height:23px;border-radius:50%;
  background:var(--navy);color:#fff;font-size:11.5px;font-weight:700;display:flex;align-items:center;justify-content:center;}
.lk-steps li:last-child{padding-bottom:0;}
.lk-recent{list-style:none;padding:0;margin:0;}
.lk-recent li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--border);font-size:12px;}
.lk-recent li:last-child{border-bottom:none;}
.lk-recent .c{font-family:Consolas,monospace;font-weight:700;color:var(--navy);cursor:pointer;}
.lk-recent .c:hover{text-decoration:underline;}
.slip{border:1.5px dashed #999;border-radius:8px;padding:14px 16px;font-family:"Times New Roman",serif;font-size:12pt;}

/* ==================== BỔ SUNG: Shape line trong trình soạn thảo ============ */
.editor-canvas{position:relative;}
.cert-content{position:relative;}
.cc-shapes{position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:3;}
.cc-shape{position:absolute;pointer-events:auto;cursor:move;transform-origin:left center;}
.cc-shape .cc-line-body{width:100%;height:100%;}
.editor-canvas .cc-shape:hover{outline:1px dashed rgba(31,122,108,.7);outline-offset:3px;}
#shapeOverlay{position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:20;}
.sh-handle{position:absolute;width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid var(--teal);pointer-events:auto;cursor:ew-resize;transform:translate(-50%,-50%);box-shadow:0 1px 3px rgba(0,0,0,.3);}
.sh-box{position:absolute;border:1px dashed var(--teal);pointer-events:none;}
.sh-bar{position:absolute;display:flex;gap:5px;align-items:center;background:var(--navy);color:#fff;padding:5px 7px;border-radius:8px;pointer-events:auto;box-shadow:0 6px 18px rgba(0,0,0,.28);font-size:11.5px;white-space:nowrap;z-index:30;}
.sh-bar button{background:rgba(255,255,255,.12);border:none;color:#fff;border-radius:5px;padding:3px 7px;font-size:11.5px;cursor:pointer;}
.sh-bar button:hover{background:rgba(255,255,255,.26);}
.sh-bar button.del{background:rgba(192,67,63,.85);}
.sh-bar select,.sh-bar input[type=color]{border:none;border-radius:5px;font-size:11.5px;padding:2px 4px;background:#fff;color:var(--navy);}
.sh-bar input[type=color]{width:26px;height:22px;padding:1px;}
.sh-bar .lbl{opacity:.75;}
.sh-bar .val{font-variant-numeric:tabular-nums;min-width:38px;text-align:center;background:rgba(255,255,255,.14);border-radius:4px;padding:2px 4px;}

/* Gạch chân tự động 1/3 */
.auto-ul{display:inline-block;text-align:center;}
.auto-ul-line{display:block;height:1.4px;background:#000;width:33%;margin:2px auto 0;}
.editor-canvas .auto-ul{outline:1px dotted rgba(184,135,58,.55);outline-offset:2px;}
.ul-preview{display:inline-block;text-align:center;font-family:"Times New Roman",serif;font-weight:700;font-size:13pt;margin-top:6px;}
.ul-preview .auto-ul-line{background:#000;}

/* Trạng thái đồng bộ trên bảng */
.sync-chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 7px;border-radius:20px;}
.sync-yes{background:var(--teal-light);color:var(--teal);}
.sync-no{background:#EEF1F4;color:var(--text-muted);}
.sync-err{background:var(--danger-light);color:var(--danger);}

</style>

/* ---------------- Số -> chữ tiếng Việt (cho "bằng chữ") ------------------ */
function soThanhChuVN(num){
  if(num===null||num===undefined||isNaN(num)) return '';
  const isHalf = Math.abs(num*2 - Math.round(num*2)) < 1e-9 && Math.round(num*2)%2!==0;
  let intPart = Math.floor(num);
  const CHU=['không','một','hai','ba','bốn','năm','sáu','bảy','tám','chín'];
  function docBa(n, hasHigher){
    let s='';
    const tr=Math.floor(n/100), ch=Math.floor((n%100)/10), dv=n%10;
    if(tr>0 || hasHigher){ s+=CHU[tr]+' trăm '; if(ch===0 && dv>0) s+='lẻ '; }
    if(ch>1){ s+=CHU[ch]+' mươi '; if(dv===1) s+='mốt '; else if(dv===5) s+='lăm '; else if(dv>0) s+=CHU[dv]+' '; }
    else if(ch===1){ s+='mười '; if(dv===1) s+='một '; else if(dv===5) s+='lăm '; else if(dv>0) s+=CHU[dv]+' '; }
    else if(ch===0 && dv>0){ s+= (tr>0||hasHigher) ? CHU[dv]+' ' : CHU[dv]+' '; }
    return s.trim();
  }
  let words='';
  if(intPart===0){ words='không'; }
  else{
    const groups=[]; let n=intPart;
    while(n>0){ groups.unshift(n%1000); n=Math.floor(n/1000); }
    const donVi=['','nghìn','triệu','tỷ'];
    let parts=[];
    for(let i=0;i<groups.length;i++){
      const g=groups[i];
      if(g===0) continue;
      const hasHigher = i>0 && groups.slice(0,i).some(x=>x>0) === false ? false : true;
      let txt = docBa(g, i>0);
      const idx=donVi[groups.length-1-i]||'';
      parts.push((txt+' '+idx).trim());
    }
    words = parts.join(' ').replace(/\s+/g,' ').trim();
  }
  words = words.charAt(0).toUpperCase()+words.slice(1);
  if(isHalf) words += ' giờ rưỡi'; else words += ' giờ';
  return words;
}

function sealHasArtwork(){ return !!(SEAL.signImage || SEAL.sealImage); }
function sealSessionActive(){ return SEAL_SESSION.until > Date.now(); }
function sealIsTempLocked(){ return SEAL_SESSION.lockedUntil > Date.now(); }
function sealHasPassword(){ return !!SEAL.passHash; }
/* Điều kiện đủ để được vẽ chữ ký/dấu lên một tờ giấy cụ thể */
function sealAllowedFor(ctx){
  if(!SEAL.enabled || !sealHasArtwork()) return false;
  if(ctx && ctx.copyMode && !SEAL.showInLookup) return false;   /* bản sao tra cứu */
  if(SEAL.requirePassword && !sealSessionActive()) return false;
  return true;
}
function sealLogUse(action, ctxs){
  const list = (ctxs||[]).map(c=>c.soGiay).filter(Boolean);
  SEAL.log = SEAL.log || [];
  SEAL.log.unshift({
    t:new Date().toISOString(), action:action,
    n:list.length, soGiay:list.slice(0,12).join(', ') + (list.length>12?' …':''),
    by: SEAL_SESSION.by || SEAL.operator || ''
  });
  if(SEAL.log.length>500) SEAL.log.length=500;
  saveSeal();
}

/* Đọc & thu nhỏ ảnh do người dùng tải lên trước khi lưu (giữ dung lượng nhỏ) */
function readAndResizeImage(file, maxDim, quality, cb){
  const reader = new FileReader();
  reader.onload = function(ev){
    const img = new Image();
    img.onload = function(){
      let w=img.width, h=img.height;
      if(w>maxDim || h>maxDim){
        if(w>=h){ h=Math.round(h*maxDim/w); w=maxDim; } else { w=Math.round(w*maxDim/h); h=maxDim; }
      }
      const canvas=document.createElement('canvas'); canvas.width=w; canvas.height=h;
      const cx=canvas.getContext('2d'); cx.drawImage(img,0,0,w,h);
      const mime = (file.type==='image/png') ? 'image/png' : 'image/jpeg';
      cb(canvas.toDataURL(mime, quality||0.86));
    };
    img.onerror=function(){ cb(null); };
    img.src=ev.target.result;
  };
  reader.onerror=function(){ cb(null); };
  reader.readAsDataURL(file);
}

function patternBorderHtml(patternId, color, insetMm, thicknessMm){
  const p = PATTERN_BORDERS[patternId]; if(!p) return '';
  const uri = svgTileDataUri(p.size, p.tile, color);
  const bg = `background-image:url('${uri}');background-size:${p.size}px ${p.size}px;`;
  const t = thicknessMm||8;
  let html='';
  html += `<div style="position:absolute;top:${insetMm}mm;left:${insetMm}mm;right:${insetMm}mm;height:${t}mm;${bg}background-repeat:repeat-x;z-index:1;pointer-events:none;"></div>`;
  html += `<div style="position:absolute;bottom:${insetMm}mm;left:${insetMm}mm;right:${insetMm}mm;height:${t}mm;${bg}background-repeat:repeat-x;z-index:1;pointer-events:none;"></div>`;
  html += `<div style="position:absolute;top:${insetMm}mm;bottom:${insetMm}mm;left:${insetMm}mm;width:${t}mm;${bg}background-repeat:repeat-y;z-index:1;pointer-events:none;"></div>`;
  html += `<div style="position:absolute;top:${insetMm}mm;bottom:${insetMm}mm;right:${insetMm}mm;width:${t}mm;${bg}background-repeat:repeat-y;z-index:1;pointer-events:none;"></div>`;
  return html;
}
function borderFrameStyleAttr(){
  const d=DESIGN, c=d.borderColor||'#B8873A', t=d.borderThickness||2;
  if(d.borderLine==='solid') return `border:${t}px solid ${c};`;
  if(d.borderLine==='double') return `border:${Math.max(t*3,6)}px double ${c};`;
  if(d.borderLine==='dashed') return `border:${t}px dashed ${c};`;
  if(d.borderLine==='dotted') return `border:${Math.max(t,2.5)}px dotted ${c};`;
  if(d.borderLine==='goldframe') return `box-shadow:inset 0 0 0 2px ${c}, inset 0 0 0 7px #ffffff, inset 0 0 0 9px ${c};`;
  return '';
}
function certPageStyleAttr(extra){
  const d=DESIGN;
  let s=`background-color:${d.bgColor||'#ffffff'};`;
  if(extra) s+=extra;
  return s;
}
/* Lớp chữ ký + con dấu. Toạ độ gốc đặt tại tâm khối ký (nửa phải tờ giấy, cách
   mép trên 213mm) — người dùng tinh chỉnh bằng độ lệch mm trong màn hình quản lý. */
const SEAL_BASE_LEFT_PCT = 73;   /* tâm ngang khối ký */
const SEAL_BASE_TOP_MM   = 216;  /* tâm dọc khối ký: giữa dòng chức danh và dòng họ tên người ký */
function sealLayerHtml(){
  const s = SEAL; let html='';
  const pos = (dx,dy) => `position:absolute;left:calc(${SEAL_BASE_LEFT_PCT}% + ${dx||0}mm);top:${SEAL_BASE_TOP_MM+(dy||0)}mm;`;
  /* Con dấu vẽ trước để chữ ký nằm đè lên trên, giống thực tế ký rồi đóng dấu */
  if(s.sealImage){
    html += `<div style="${pos(s.sealOffsetX,s.sealOffsetY)}transform:translate(-50%,-50%) rotate(${s.sealRotate||0}deg);z-index:4;pointer-events:none;">
      <img src="${s.sealImage}" style="width:${s.sealWidth||36}mm;display:block;opacity:${s.sealOpacity!=null?s.sealOpacity:0.88};"></div>`;
  }
  if(s.signImage){
    html += `<div style="${pos(s.signOffsetX,s.signOffsetY)}transform:translate(-50%,-50%);z-index:5;pointer-events:none;">
      <img src="${s.signImage}" style="width:${s.signWidth||40}mm;display:block;opacity:${s.signOpacity!=null?s.signOpacity:1};"></div>`;
  }
  return html;
}
/* Dấu "BẢN SAO" cho bản xem/tải qua mã QR: chữ chìm lặp kín trang để nếu ai đó
   tải về rồi dùng công cụ chỉnh sửa thì buộc phải xoá lớp chữ phủ trên toàn bộ
   mặt giấy — việc này để lại vết rất rõ, khác hẳn sửa một dòng chữ. */
function copyStampHtml(ctx){

  const now = new Date();

  let tiles='';

      color:rgba(176,32,32,.13);white-space:nowrap;">BẢN SAO</div>`;
  }));
  return `<div style="position:absolute;top:0;left:0;right:0;bottom:0;z-index:6;pointer-events:none;overflow:hidden;">
    ${tiles}
    <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-30deg);

      color:rgba(176,32,32,.17);white-space:nowrap;">BẢN SAO</div>
    <div style="position:absolute;top:238mm;left:24mm;transform:rotate(-8deg);border:2.2px solid rgba(176,32,32,.62);
      border-radius:4px;padding:3mm 5mm;text-align:center;color:rgba(176,32,32,.78);font-family:Arial,Helvetica,sans-serif;">
      <div style="font-size:15pt;font-weight:900;letter-spacing:3px;line-height:1.1;">BẢN SAO</div>
      <div style="font-size:6.6pt;font-weight:700;margin-top:1mm;line-height:1.25;">KHÔNG THAY THẾ BẢN GỐC<br>DO ĐƠN VỊ CẤP</div>
    </div>
    <div style="position:absolute;bottom:7mm;left:16mm;right:16mm;text-align:center;font-family:Arial,Helvetica,sans-serif;
      font-size:6.6pt;color:rgba(90,90,90,.85);">
      Bản sao điện tử kết xuất từ hệ thống tra cứu${code?(' — mã tra cứu '+esc(code)):''} — ${stamp}.
      Đối chiếu bản gốc tại đơn vị cấp giấy khi cần giá trị pháp lý.
    </div>
  </div>`;
}
function certOverlaysHtml(opt){
  opt = opt || {};
  const d=DESIGN; let html='';
  if(d.useBgImage && d.bgImageData){
    html += `<div style="position:absolute;top:0;left:0;right:0;bottom:0;background-image:url('${d.bgImageData}');background-size:${d.bgImageFit==='contain'?'contain':'cover'};background-position:center;background-repeat:no-repeat;opacity:${d.bgImageOpacity!=null?d.bgImageOpacity:1};z-index:0;"></div>`;
  }
  if(d.useLogo && d.logoImageData){
    html += `<div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:${d.watermarkSize||52}%;opacity:${d.watermarkOpacity!=null?d.watermarkOpacity:0.12};z-index:0;pointer-events:none;text-align:center;"><img src="${d.logoImageData}" style="width:100%;display:block;"></div>`;
  }
  const inset = Math.max(d.borderInset||8, 6); /* an toàn tối thiểu 6mm để không bị cắt mất khi in */
  if(d.borderLine && d.borderLine!=='none'){
    if(PATTERN_BORDERS[d.borderLine]){
      html += patternBorderHtml(d.borderLine, d.borderColor||'#B8873A', inset, d.patternThickness||8);
    } else {
      html += `<div style="position:absolute;top:${inset}mm;left:${inset}mm;right:${inset}mm;bottom:${inset}mm;z-index:1;pointer-events:none;${borderFrameStyleAttr()}"></div>`;
    }
  }
  if(d.cornerStyle && d.cornerStyle!=='none'){
    const cclr=d.borderColor||'#B8873A';
    const sz = d.cornerSize||20;
    const off = inset - 2 < 0 ? 0 : inset - 2; /* hoạ tiết đặt sát mép trong của khung, không vượt ra ngoài vùng an toàn */
    const mk=(pos,tf)=>`<div style="position:absolute;${pos};width:${sz}mm;height:${sz}mm;z-index:2;transform:${tf};">${cornerSVGMarkup(d.cornerStyle, cclr)}</div>`;
    html += mk(`top:${off}mm;left:${off}mm`,'none');
    html += mk(`top:${off}mm;right:${off}mm`,'scaleX(-1)');
    html += mk(`bottom:${off}mm;left:${off}mm`,'scaleY(-1)');
    html += mk(`bottom:${off}mm;right:${off}mm`,'scale(-1,-1)');
  }
  if(opt.seal) html += sealLayerHtml();
  if(opt.copy) html += copyStampHtml(opt.ctx);
  return html;
}
/* Suy ra các lớp phủ cần vẽ cho một tờ giấy cụ thể */
function renderOptsFor(ctx){

/* Ưu tiên window.storage (khi chạy trong Claude); nếu không có (mở file .html
   độc lập ngoài trình duyệt) thì dùng localStorage làm phương án dự phòng để
   dữ liệu vẫn được lưu lại giữa các lần mở. */
const HAS_APP_STORAGE = (typeof window!=='undefined' && window.storage && typeof window.storage.get==='function');
async function storageGet(key){
  if(HAS_APP_STORAGE){ try{ return await window.storage.get(key,false); }catch(e){ return null; } }
  try{ const v=localStorage.getItem(key); return v?{value:v}:null; }catch(e){ return null; }
}
async function storageSet(key,val){
  if(HAS_APP_STORAGE){ return window.storage.set(key,val,false); }
  try{ localStorage.setItem(key,val); }catch(e){ /* im lặng bỏ qua nếu trình duyệt chặn */ }
}
async function loadData(){
  try{
    const res = await storageGet(DB_KEY);
    if(res && res.value){
      const parsed = JSON.parse(res.value);
      DATA = Object.assign(JSON.parse(JSON.stringify(DEFAULT_DATA)), parsed);
      if(!DATA.hospital) DATA.hospital = DEFAULT_DATA.hospital;
    }
  }catch(e){ /* chưa có dữ liệu -> dùng mặc định */ }
  STORAGE_READY = true;
}
let saveTimer=null;
function saveData(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async ()=>{
    try{ await storageSet(DB_KEY, JSON.stringify(DATA)); }
    catch(e){ showToast('Không thể lưu dữ liệu: '+e.message,'err'); }
  }, 250);
}
function nextId(kind){ const n = DATA.nextIds[kind]++; saveData(); return kind.slice(0,2).toUpperCase()+String(n).padStart(4,'0'); }

   ---------------------------------------------------------------------
   Ghi nhớ các giá trị người dùng từng nhập ở một số ô nhập liệu hay lặp
   lại (đơn vị công tác, chức danh, đơn vị tổ chức, người chỉ đạo...).
   Dùng thẻ <datalist> gốc của trình duyệt (list="...") — gợi ý tự hiện
   ra khi gõ, bấm chọn nhanh, hoạt động trên mọi trình duyệt hiện đại,
   không cần thư viện ngoài.
===================================================================== */
const INPUT_HISTORY_KEY = 'cme_manager_input_history_v1';
let INPUT_HISTORY = {};
let inputHistorySaveTimer = null;
async function loadInputHistory(){
  try{
    const res = await storageGet(INPUT_HISTORY_KEY);
    if(res && res.value) INPUT_HISTORY = JSON.parse(res.value) || {};
  }catch(e){ INPUT_HISTORY = {}; }
}
function saveInputHistory(){
  clearTimeout(inputHistorySaveTimer);
  inputHistorySaveTimer = setTimeout(()=>{ storageSet(INPUT_HISTORY_KEY, JSON.stringify(INPUT_HISTORY)); }, 300);
}
/* Ghi nhớ 1 giá trị vào lịch sử gợi ý của 1 trường (fieldKey). Đưa lên đầu danh
   sách nếu đã có (giá trị dùng gần nhất hiện lên trước), giới hạn 30 mục/trường. */
function recordSuggestion(fieldKey, value){
  const v = (value||'').trim();
  if(!v) return;
  if(!INPUT_HISTORY[fieldKey]) INPUT_HISTORY[fieldKey] = [];
  const arr = INPUT_HISTORY[fieldKey];
  const idx = arr.findIndex(x=>x.toLowerCase()===v.toLowerCase());
  if(idx>=0) arr.splice(idx,1);
  arr.unshift(v);
  if(arr.length>30) arr.length=30;
  saveInputHistory();
}
/* Trả về HTML <datalist> cho 1 trường; đặt id="dl_<fieldKey>" để input dùng
   thuộc tính list="dl_<fieldKey>" trỏ tới. */
function suggestDatalist(fieldKey){
  const arr = INPUT_HISTORY[fieldKey] || [];
  if(arr.length===0) return `<datalist id="dl_${fieldKey}"></datalist>`;
  return `<datalist id="dl_${fieldKey}">${arr.map(v=>`<option value="${esc(v)}"></option>`).join('')}</datalist>`;
}
/* Thuộc tính list="..." kèm dấu cách để chèn trực tiếp vào thẻ <input ...> */
function suggestListAttr(fieldKey){ return ` list="dl_${fieldKey}"`; }

/* ------------------------------- Helpers --------------------------------- */
function $(sel,root){ return (root||document).querySelector(sel); }
function $all(sel,root){ return Array.from((root||document).querySelectorAll(sel)); }
function esc(s){ return (s===undefined||s===null) ? '' : String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(iso){ if(!iso) return '..............'; const d=new Date(iso+'T00:00:00'); if(isNaN(d)) return iso; return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear(); }
function fmtDateParts(iso){ if(!iso) return {d:'......',m:'......',y:'20......'}; const d=new Date(iso+'T00:00:00'); if(isNaN(d)) return {d:'......',m:'......',y:'20......'}; return {d:String(d.getDate()).padStart(2,'0'), m:String(d.getMonth()+1).padStart(2,'0'), y:d.getFullYear()}; }
function todayISO(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fmtNum(n){ if(n===null||n===undefined||isNaN(n)) return '0'; return (Math.round(n*100)/100).toString().replace('.', ','); }
function byId(arr,id){ return arr.find(x=>x.id===id); }
function download(filename, content, mime){
  const blob = content instanceof Blob ? content : new Blob([content], {type:mime});
  if(window.saveAs) saveAs(blob, filename);
  else{
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  }
}

  $all('.nav-item', nav).forEach(b=>b.addEventListener('click', ()=>{
    NAV_SCROLL = nav.scrollTop;
    STATE.tab=b.dataset.tab; STATE.editing=null;
    switchTab();
  }));
  /* Đưa mục đang chọn vào vùng nhìn thấy nếu nó đang nằm ngoài khung */
  const act = nav.querySelector('.nav-item.active');
  if(act){
    const top = act.offsetTop, bot = top + act.offsetHeight;
    if(top < nav.scrollTop + 4) nav.scrollTop = Math.max(0, top - 8);
    else if(bot > nav.scrollTop + nav.clientHeight - 4) nav.scrollTop = bot - nav.clientHeight + 12;
  }
  NAV_SCROLL = nav.scrollTop;
}

/* ==========================================================================
 *  BỘ VẼ BIỂU ĐỒ (SVG thuần, không phụ thuộc thư viện ngoài)
 *  Vẽ bằng SVG thay vì canvas vì: in ra không vỡ nét ở mọi cỡ giấy, tải về
 *  được cả .svg để đưa vào slide/ấn phẩm, và chuyển sang .png bằng chính
 *  trình duyệt nên chữ tiếng Việt luôn đúng dấu.
 * ========================================================================== */
const CH_PALETTE = ['#1F4E7A','#1F7A6C','#B8873A','#7A4A8C','#C0433F','#2F8FBF','#6B8E23','#A65C2E','#4A5D75','#0E7490','#9A6324','#3F6212'];
const CH_FONT = "'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif";
function chEsc(t){ return String(t===undefined||t===null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function chNum(n){ return fmtNum(n); }
/* Làm tròn trục lên số "đẹp" (1 / 2 / 2,5 / 5 × 10^k) để lưới chia đều */
function chNiceMax(v){
  if(!v || v<=0) return 1;
  const exp = Math.floor(Math.log10(v)), base = v/Math.pow(10,exp);
  const step = base<=1?1: base<=2?2: base<=2.5?2.5: base<=5?5:10;
  return step*Math.pow(10,exp);
}
function chTruncate(t, n){ t=String(t||''); return t.length>n ? t.slice(0,n-1)+'…' : t; }
function chOpen(w,h){
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" xmlns="http://www.w3.org/2000/svg" data-w="${w}" data-h="${h}"
    style="display:block;font-family:${CH_FONT};background:#ffffff;">`;
}
function chNoData(w,h,msg){
  return chOpen(w,h)+`<text x="${w/2}" y="${h/2}" text-anchor="middle" font-size="13" fill="#8A94A3">${chEsc(msg||'Chưa có dữ liệu trong khoảng đã chọn')}</text></svg>`;
}
function chGrid(x0,y0,w,h,max,ticks,unit){
  let g='';
  for(let i=0;i<=ticks;i++){
    const y = y0+h - (h*i/ticks);
    const v = max*i/ticks;
    g += `<line x1="${x0}" y1="${y.toFixed(1)}" x2="${x0+w}" y2="${y.toFixed(1)}" stroke="${i===0?'#9AA5B4':'#EDF0F4'}" stroke-width="${i===0?1.2:1}"/>`;
    g += `<text x="${x0-7}" y="${(y+4).toFixed(1)}" text-anchor="end" font-size="10.5" fill="#77839A">${chEsc(chNum(v))}</text>`;
  }
  if(unit) g += `<text x="${x0-7}" y="${y0-8}" text-anchor="end" font-size="10" fill="#8A94A3">${chEsc(unit)}</text>`;
  return g;
}
/* --- Biểu đồ cột đứng --- */
function chartBars(data, o){
  o = o || {};
  const w = o.w||640, h = o.h||280;
  if(!data || !data.length) return chNoData(w,h,o.empty);
  const padL=48, padR=14, padT=18, padB= o.rotate?58:36;
  const cw = w-padL-padR, ch = h-padT-padB;
  const max = chNiceMax(Math.max(...data.map(d=>d.value), 0)) || 1;
  const n = data.length, slot = cw/n, bw = Math.min(o.barW||46, slot*0.62);
  let svg = chOpen(w,h) + chGrid(padL,padT,cw,ch,max,4,o.unit);
  data.forEach((d,i)=>{
    const bh = Math.max(0, ch*(d.value/max));
    const x = padL + slot*i + (slot-bw)/2, y = padT+ch-bh;
    const col = o.color || CH_PALETTE[0];
    svg += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="3" fill="${col}" fill-opacity="${d.dim?0.42:0.92}"/>`;
    if(d.value>0) svg += `<text x="${(x+bw/2).toFixed(1)}" y="${(y-5).toFixed(1)}" text-anchor="middle" font-size="10.5" font-weight="700" fill="#33415A">${chEsc(chNum(d.value))}</text>`;
    const lx = padL+slot*i+slot/2, ly = padT+ch+16;
    svg += o.rotate
      ? `<text x="${lx.toFixed(1)}" y="${ly}" font-size="10.5" fill="#5A6678" text-anchor="end" transform="rotate(-38 ${lx.toFixed(1)} ${ly})">${chEsc(chTruncate(d.label,22))}</text>`
      : `<text x="${lx.toFixed(1)}" y="${ly}" font-size="10.8" fill="#5A6678" text-anchor="middle">${chEsc(chTruncate(d.label,14))}</text>`;
  });
  return svg+'</svg>';
}
/* --- Biểu đồ đường có tô vùng (dùng cho luỹ kế) --- */
function chartLine(data, o){
  o = o || {};
  const w = o.w||640, h = o.h||280;
  if(!data || data.length<1) return chNoData(w,h,o.empty);
  const padL=52, padR=16, padT=18, padB=36;
  const cw = w-padL-padR, ch = h-padT-padB;
  const max = chNiceMax(Math.max(...data.map(d=>d.value),0)) || 1;
  const n = data.length;
  const px = i => padL + (n===1 ? cw/2 : cw*i/(n-1));
  const py = v => padT + ch - ch*(v/max);
  let svg = chOpen(w,h) + chGrid(padL,padT,cw,ch,max,4,o.unit);
  const pts = data.map((d,i)=>`${px(i).toFixed(1)},${py(d.value).toFixed(1)}`).join(' ');
  const col = o.color || CH_PALETTE[1];
  svg += `<defs><linearGradient id="chg${o.gid||'1'}" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="${col}" stop-opacity="0.30"/><stop offset="100%" stop-color="${col}" stop-opacity="0.02"/></linearGradient></defs>`;
  svg += `<polygon points="${px(0).toFixed(1)},${(padT+ch).toFixed(1)} ${pts} ${px(n-1).toFixed(1)},${(padT+ch).toFixed(1)}" fill="url(#chg${o.gid||'1'})"/>`;
  svg += `<polyline points="${pts}" fill="none" stroke="${col}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>`;
  data.forEach((d,i)=>{
    svg += `<circle cx="${px(i).toFixed(1)}" cy="${py(d.value).toFixed(1)}" r="3.4" fill="#fff" stroke="${col}" stroke-width="2"/>`;
    const step = Math.ceil(n/9);
    if(i%step===0 || i===n-1)
      svg += `<text x="${px(i).toFixed(1)}" y="${padT+ch+16}" font-size="10.5" fill="#5A6678" text-anchor="middle">${chEsc(chTruncate(d.label,10))}</text>`;
  });
  if(n) svg += `<text x="${px(n-1).toFixed(1)}" y="${(py(data[n-1].value)-9).toFixed(1)}" font-size="11" font-weight="800" fill="${col}" text-anchor="end">${chEsc(chNum(data[n-1].value))}</text>`;
  return svg+'</svg>';
}
/* --- Biểu đồ vành khuyên kèm chú giải --- */
function chartDonut(data, o){
  o = o || {};
  const w = o.w||620, h = o.h||280;
  const items = (data||[]).filter(d=>d.value>0);
  if(!items.length) return chNoData(w,h,o.empty);
  const total = items.reduce((s,d)=>s+d.value,0);
  const cx = 128, cy = h/2, R = Math.min(96, h/2-16), r = R*0.60;
  let a0 = -Math.PI/2, svg = chOpen(w,h);
  items.forEach((d,i)=>{
    const ang = (d.value/total)*Math.PI*2, a1 = a0+ang;
    const col = d.color || CH_PALETTE[i%CH_PALETTE.length];
    const big = ang>Math.PI ? 1 : 0;
    const P=(rad,a)=>[(cx+rad*Math.cos(a)).toFixed(2),(cy+rad*Math.sin(a)).toFixed(2)];
    const [x1,y1]=P(R,a0),[x2,y2]=P(R,a1),[x3,y3]=P(r,a1),[x4,y4]=P(r,a0);
    if(items.length===1){
      svg += `<circle cx="${cx}" cy="${cy}" r="${(R+r)/2}" fill="none" stroke="${col}" stroke-width="${R-r}"/>`;
    } else {
      svg += `<path d="M${x1},${y1} A${R},${R} 0 ${big} 1 ${x2},${y2} L${x3},${y3} A${r},${r} 0 ${big} 0 ${x4},${y4} Z" fill="${col}"/>`;
    }
    a0 = a1;
  });
  svg += `<text x="${cx}" y="${cy-2}" text-anchor="middle" font-size="21" font-weight="800" fill="#142C46">${chEsc(chNum(total))}</text>`;
  svg += `<text x="${cx}" y="${cy+16}" text-anchor="middle" font-size="10.5" fill="#77839A">${chEsc(o.centerLabel||'tổng')}</text>`;
  const lx = 262; let ly = cy - Math.min(items.length,9)*13 + 6;
  items.slice(0,9).forEach((d,i)=>{
    const col = d.color || CH_PALETTE[i%CH_PALETTE.length];
    const pct = (d.value/total*100);
    svg += `<rect x="${lx}" y="${ly-9}" width="11" height="11" rx="2.5" fill="${col}"/>`;
    svg += `<text x="${lx+18}" y="${ly}" font-size="11.5" fill="#33415A">${chEsc(chTruncate(d.label,42))}</text>`;
    svg += `<text x="${w-14}" y="${ly}" font-size="11.5" font-weight="700" fill="#142C46" text-anchor="end">${chEsc(chNum(d.value))} · ${pct.toFixed(1).replace('.',',')}%</text>`;
    ly += 26;
  });
  return svg+'</svg>';
}
/* --- Biểu đồ thanh ngang (tên dài, xếp hạng) --- */
function chartHBar(data, o){
  o = o || {};
  const items = (data||[]).slice(0, o.max||8);
  const rowH = o.rowH||30, w = o.w||640;
  if(!items.length) return chNoData(w, o.h||220, o.empty);
  const h = 22 + items.length*rowH + 10;
  const padL = o.labelW||190, padR = 62;
  const bw = w-padL-padR;
  const max = Math.max(...items.map(d=>d.value), 1);
  let svg = chOpen(w,h);
  items.forEach((d,i)=>{
    const y = 16 + i*rowH;
    const len = Math.max(2, bw*(d.value/max));
    const col = d.color || CH_PALETTE[i%CH_PALETTE.length];
    svg += `<text x="${padL-10}" y="${y+14}" font-size="11.5" fill="#33415A" text-anchor="end">${chEsc(chTruncate(d.label, o.labelChars||30))}</text>`;
    svg += `<rect x="${padL}" y="${y+3}" width="${bw}" height="17" rx="4" fill="#F0F3F7"/>`;
    svg += `<rect x="${padL}" y="${y+3}" width="${len.toFixed(1)}" height="17" rx="4" fill="${col}" fill-opacity="0.92"/>`;
    const extra = d.sub ? ` · ${d.sub}` : '';
    svg += `<text x="${w-12}" y="${y+16}" font-size="11.5" font-weight="700" fill="#142C46" text-anchor="end">${chEsc(chNum(d.value))}${chEsc(extra)}</text>`;
  });
  return svg+'</svg>';
}

/* --------- Tải biểu đồ về máy: .svg giữ nguyên nét, .png để dán nhanh --------- */
function chartSvgString(el){
  if(!el) return '';
  const clone = el.cloneNode(true);
  clone.setAttribute('xmlns','http://www.w3.org/2000/svg');
  clone.setAttribute('width', clone.getAttribute('data-w')||'640');
  clone.setAttribute('height', clone.getAttribute('data-h')||'280');
  return '<?xml version="1.0" encoding="UTF-8"?>\n' + new XMLSerializer().serializeToString(clone);
}
function svgToPngDataUrl(el, scale){
  return new Promise((resolve,reject)=>{
    const W = parseFloat(el.getAttribute('data-w'))||640;
    const H = parseFloat(el.getAttribute('data-h'))||280;
    const sc = scale||2.5;
    const src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(chartSvgString(el))));
    const img = new Image();
    img.onload = ()=>{
      const cv = document.createElement('canvas');
      cv.width = Math.round(W*sc); cv.height = Math.round(H*sc);
      const g = cv.getContext('2d');
      g.fillStyle='#ffffff'; g.fillRect(0,0,cv.width,cv.height);
      g.drawImage(img,0,0,cv.width,cv.height);
      resolve(cv.toDataURL('image/png'));
    };
    img.onerror = ()=>reject(new Error('Không dựng được ảnh từ biểu đồ'));
    img.src = src;
  });
}
async function downloadChart(boxId, name, kind){
  const el = document.querySelector('#'+boxId+' svg');
  if(!el){ showToast('Không tìm thấy biểu đồ','err'); return; }
  try{
    if(kind==='svg'){
      download(name+'.svg', new Blob([chartSvgString(el)],{type:'image/svg+xml;charset=utf-8'}));
    } else {
      const url = await svgToPngDataUrl(el, 3);
      const bin = atob(url.split(',')[1]); const arr = new Uint8Array(bin.length);
      for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
      download(name+'.png', new Blob([arr],{type:'image/png'}));
    }
    showToast('Đã tải biểu đồ về máy','ok');
  }catch(e){ showToast('Lỗi khi tải biểu đồ: '+e.message,'err'); }
}
