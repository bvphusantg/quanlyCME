/* ==========================================================================
 *  KHOÁ Ô CẤU HÌNH SAU KHI LƯU
 *  Sau khi lưu, các ô trong khối cấu hình chuyển sang trạng thái chỉ đọc và làm
 *  mờ — nội dung vẫn hiển thị để người dùng biết ô đó đã có dữ liệu, nhưng không
 *  sửa nhầm được. Muốn sửa phải bấm "Chỉnh sửa", đây là một thao tác có chủ ý.
 *  Cách làm: không sửa từng biểu mẫu, mà tự nhận diện thẻ chứa một ô mốc rồi
 *  gắn thanh khoá vào — nhờ vậy các biểu mẫu thêm sau này cũng dùng lại được.
 * ========================================================================== */
/* Mỗi khối cấu hình khai báo: ô mốc để nhận diện thẻ, và nút Lưu sẵn có (nếu có).
   Khối ĐÃ CÓ nút Lưu riêng thì KHÔNG sinh thêm nút "Lưu & khoá" — bấm chính nút
   Lưu của biểu mẫu là phần mềm tự khoá lại, tránh hai nút cùng làm một việc.
   Khối không có nút Lưu (tự lưu ngay khi gõ) mới cần nút khoá riêng. */
const LOCK_SECTIONS = [
  { key:'hospital',  anchor:'#f_tenDonVi', label:'Thông tin đơn vị',  save:'#saveHospital' },
  { key:'numbering', anchor:'#f_mauSo',    label:'Quy tắc đánh số',   save:'#saveNumbering' },
  { key:'qr',        anchor:'#qrViewer',   label:'Mã QR & mật mã',    save:null },
  { key:'google',    anchor:'#gClientId',  label:'Kết nối Google',    save:null },
  { key:'archive',   anchor:'#arYears',    label:'Quy tắc lưu trữ',   save:null },
  { key:'sealcfg',   anchor:'#sUnlockMin', label:'Quy tắc con dấu',   save:null }
];
function lockSection(key){ return LOCK_SECTIONS.find(x=>x.key===key); }
function cfgLocks(){ return (CFG.locks = CFG.locks || {}); }
function isCfgLocked(key){ return !!cfgLocks()[key]; }
function setCfgLock(key, val){ cfgLocks()[key] = !!val; saveCfg(); }
/* Gắn thanh khoá vào mọi khối cấu hình đang hiển thị trên màn hình */
function initCfgLocks(){
  LOCK_SECTIONS.forEach(sec=>{
    const el = document.querySelector(sec.anchor);
    if(!el) return;
    const card = el.closest ? el.closest('.card') : null;
    if(!card || card.dataset.lockKey) return;
    card.dataset.lockKey = sec.key;
    const head = card.querySelector('.card-head');
    if(head){
      const bar = document.createElement('div');
      bar.className = 'cfg-lockbar';
      bar.innerHTML = `<span class="st"></span><button class="btn btn-sm cfg-allow" data-lockbtn="${sec.key}"></button>`;
      head.appendChild(bar);
    }
    /* Khối có nút Lưu riêng: gắn thêm việc khoá lại NGAY SAU khi người dùng bấm Lưu,
       để không phải bấm hai nút cho cùng một hành động. */
    if(sec.save){
      const sv = card.querySelector(sec.save);
      if(sv && !sv.dataset.lockHook){
        sv.dataset.lockHook = '1';
        sv.addEventListener('click', ()=>{
          setCfgLock(sec.key, true);
          const cur = document.querySelector('.card[data-lock-key="'+sec.key+'"]');
          if(cur) applyCfgLock(cur);
        });
      }
    }
    applyCfgLock(card);
  });
  $all('[data-lockbtn]').forEach(b=>{
    if(b.dataset.bound) return; b.dataset.bound='1';
    b.addEventListener('click', ()=>{
      const key = b.dataset.lockbtn;
      const sec = lockSection(key);
      const card = document.querySelector('.card[data-lock-key="'+key+'"]') || b.closest('.card');
      if(isCfgLocked(key)){
        setCfgLock(key,false); applyCfgLock(card);
        showToast(sec && sec.save
          ? 'Đã mở khoá. Sửa xong bấm nút Lưu của biểu mẫu, phần mềm sẽ tự khoá lại.'
          : 'Đã mở khoá để chỉnh sửa. Sửa xong bấm “Lưu & khoá”.', 'ok');
      } else {
        /* Khối tự lưu khi gõ thì nút này vừa ghi cấu hình xuống, vừa khoá.
           Khối có nút Lưu riêng thì nút này CHỈ khoá, không lưu trùng. */
        if(!sec || !sec.save) saveCfg();
        setCfgLock(key,true); applyCfgLock(card);
        showToast(sec && sec.save ? 'Đã khoá khối cấu hình này' : 'Đã lưu và khoá khối cấu hình này','ok');
      }
    });
  });
}
function applyCfgLock(card){
  if(!card) return;
  const key = card.dataset.lockKey;
  const locked = isCfgLocked(key);
  card.classList.toggle('cfg-locked', locked);
  card.querySelectorAll('.card-pad input, .card-pad select, .card-pad textarea').forEach(f=>{
    if(f.type==='file'){ f.disabled = locked; return; }
    if(f.type==='checkbox' || f.type==='radio'){ f.disabled = locked; return; }
    f.readOnly = locked;
    if(f.tagName==='SELECT') f.disabled = locked;
  });
  const sec = lockSection(key);
  const hasOwnSave = !!(sec && sec.save);
  const st = card.querySelector('.cfg-lockbar .st');
  const bt = card.querySelector('.cfg-lockbar [data-lockbtn]');
  if(st){ st.className = 'st ' + (locked?'on':'off'); st.textContent = locked ? '🔒 Đã cấu hình' : '✎ Đang chỉnh sửa'; }
  if(bt){
    /* Có nút Lưu riêng thì chỉ hiện "Khoá lại" — việc lưu để nút Lưu của biểu mẫu lo */
    bt.textContent = locked ? 'Chỉnh sửa' : (hasOwnSave ? 'Khoá lại' : 'Lưu & khoá');
    bt.classList.toggle('btn-primary', locked);
  }
  let msg = card.querySelector('.cfg-lockmsg');
  const text = locked
    ? 'Các ô đang hiển thị mờ vì khối cấu hình đã được lưu và khoá. Bấm “Chỉnh sửa” ở góc trên để mở khoá.'
    : (hasOwnSave ? 'Đang mở để chỉnh sửa. Bấm nút Lưu của biểu mẫu bên dưới, phần mềm sẽ tự khoá lại.' : '');
  if(text){
    if(!msg){ msg = document.createElement('div'); msg.className='cfg-lockmsg';
      const pad = card.querySelector('.card-pad'); if(pad) pad.appendChild(msg); }
    if(msg) msg.textContent = text;
  } else if(msg){ msg.remove(); }
}

/* ==========================================================================
 *  QUÉT MÃ QR — hỗ trợ ba cách, không cần thư viện ngoài
 *  1) Máy quét mã vạch/QR chuyên dụng (USB hoặc Bluetooth): loại thiết bị này
 *     hoạt động như một bàn phím, bắn rất nhanh chuỗi ký tự rồi kết thúc bằng
 *     phím Enter. Phần mềm nhận ra nhịp gõ bất thường đó để phân biệt với người
 *     gõ tay, nên nhân viên chỉ cần bắn mã là hệ thống tự tra cứu.
 *  2) Camera của máy tính hoặc điện thoại, dùng BarcodeDetector có sẵn trong
 *     trình duyệt nhân Chromium (Chrome, Edge, Cốc Cốc).
 *  3) Chọn tệp ảnh chụp mã QR để giải mã, dùng khi máy không có camera.
 * ========================================================================== */
let QR_SCAN = {
  mode:null, stream:null, raf:null, det:null, buf:'', last:0,
  wedgeOn:true,            /* nhận mã từ máy quét chuyên dụng */
  engine:null,             /* 'native' | 'jsqr' | 'none' | null = chưa dò */
  devices:[], deviceIdx:0, torch:false, canvas:null, ctx:null,
  history:[]               /* các mã đã quét trong phiên, để đối chiếu nhanh */
};

/* Nạp một thư viện ngoài, thử lần lượt nhiều địa chỉ dự phòng */
function loadScriptOnce(urls){
  return new Promise((resolve, reject)=>{
    let i = 0;
    const next = ()=>{
      if(i >= urls.length){ reject(new Error('Không tải được thư viện giải mã')); return; }
      const el = document.createElement('script');
      el.src = urls[i++]; el.async = true;
      el.onload = ()=>resolve(true);
      el.onerror = next;
      document.head.appendChild(el);
    };
    next();
  });
}
/* ==========================================================================
 *  BỘ GIẢI MÃ QR — hai lớp, tự chọn lớp khả dụng
 *  Lớp 1: BarcodeDetector dựng sẵn trong trình duyệt. Nhanh nhất, nhưng trên
 *         Windows thì Chrome và Edge đều CHƯA có (chỉ Android, macOS, ChromeOS),
 *         nên đây chính là lý do máy của bạn báo "trình duyệt chưa hỗ trợ".
 *  Lớp 2: thư viện jsQR tải kèm. Chạy được trên mọi trình duyệt, mọi hệ điều hành.
 *  Chỉ khi cả hai lớp đều không dùng được, phần mềm mới GỠ HẲN các lựa chọn
 *  liên quan tới camera và ảnh khỏi giao diện, thay vì hiện nút rồi báo lỗi.
 * ========================================================================== */
async function ensureQrDecoder(){
  if(QR_SCAN.engine) return QR_SCAN.engine;
  try{
    if(typeof window.BarcodeDetector !== 'undefined'){
      let ok = true;
      if(window.BarcodeDetector.getSupportedFormats){
        const fmts = await window.BarcodeDetector.getSupportedFormats();
        ok = !!(fmts && fmts.indexOf('qr_code') >= 0);
      }
      if(ok){ QR_SCAN.det = new window.BarcodeDetector({formats:['qr_code']}); QR_SCAN.engine='native'; return 'native'; }
    }
  }catch(e){ /* rơi xuống lớp 2 */ }
  if(typeof window.jsQR === 'function'){ QR_SCAN.engine='jsqr'; return 'jsqr'; }
  try{
    await loadScriptOnce([
      'https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js',
      'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js',
      'https://unpkg.com/jsqr@1.4.0/dist/jsQR.js'
    ]);
    if(typeof window.jsQR === 'function'){ QR_SCAN.engine='jsqr'; return 'jsqr'; }
  }catch(e){ /* không có mạng hoặc bị chặn */ }
  QR_SCAN.engine = 'none';
  return 'none';
}
function qrEngineName(){
  return QR_SCAN.engine==='native' ? 'bộ giải mã sẵn có của trình duyệt'
       : QR_SCAN.engine==='jsqr'   ? 'bộ giải mã jsQR'
       : 'chưa có bộ giải mã';
}
function cameraPossible(){
  return QR_SCAN.engine && QR_SCAN.engine!=='none'
      && !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
}
function imagePossible(){ return QR_SCAN.engine && QR_SCAN.engine!=='none'; }

/* Đọc một khung hình bất kỳ (thẻ video hoặc ảnh) và trả về nội dung mã QR */
async function decodeQrFrom(source, w, h){
  if(QR_SCAN.engine==='native' && QR_SCAN.det){
    const found = await QR_SCAN.det.detect(source);
    return (found && found.length) ? (found[0].rawValue||'') : '';
  }
  if(QR_SCAN.engine==='jsqr' && typeof window.jsQR==='function'){
    if(!QR_SCAN.canvas){ QR_SCAN.canvas = document.createElement('canvas'); QR_SCAN.ctx = QR_SCAN.canvas.getContext('2d', {willReadFrequently:true}); }
    /* Thu nhỏ khung hình trước khi dò cho nhẹ máy mà vẫn đủ nét để đọc mã */
    const maxW = 720;
    const sc = w > maxW ? maxW/w : 1;
    const cw = Math.max(1, Math.round(w*sc)), chh = Math.max(1, Math.round(h*sc));
    QR_SCAN.canvas.width = cw; QR_SCAN.canvas.height = chh;
    QR_SCAN.ctx.drawImage(source, 0, 0, cw, chh);
    const img = QR_SCAN.ctx.getImageData(0, 0, cw, chh);
    const res = window.jsQR(img.data, cw, chh, {inversionAttempts:'attemptBoth'});
    return res ? (res.data||'') : '';
  }
  return '';
}

/* Bóc mã tra cứu và mật mã từ nội dung quét được, chấp nhận nhiều dạng khác nhau */
function parseLookupPayload(text){
  let t = String(text||'').trim();
  if(!t) return null;
  let code='', pass='';
  if(/^https?:\/\//i.test(t)){
    try{
      const u = new URL(t);
      code = u.searchParams.get('code') || u.searchParams.get('ma') || '';
      pass = u.searchParams.get('pass') || u.searchParams.get('p') || '';
      if(!code){ const seg=u.pathname.split('/').filter(Boolean); code = seg[seg.length-1]||''; }
    }catch(e){ /* không phải URL hợp lệ, xử lý như chuỗi thường */ }
  }
  if(!code && /^CME-TRACUU:/i.test(t)) code = t.replace(/^CME-TRACUU:/i,'').trim();
  if(!code){
    const parts = t.split(/[|;,\s]+/).filter(Boolean);
    code = parts[0]||'';
    if(parts[1] && parts[1].length<=12) pass = parts[1];
  }
  code = code.trim().toUpperCase();
  if(!code) return null;
  return { code, pass: (pass||'').trim().toUpperCase() };
}
/* Nhận kết quả quét từ bất kỳ nguồn nào rồi tra cứu ngay */
function handleScanned(text, source){
  const r = parseLookupPayload(text);
  if(!r){ showToast('Không đọc được nội dung mã vừa quét','err'); return false; }
  STATE.lookup = STATE.lookup || {};
  STATE.lookup.code = r.code;
  if(r.pass) STATE.lookup.pass = r.pass;
  QR_SCAN.history.unshift({ code:r.code, at:new Date(), src:source||'thiết bị quét' });
  if(QR_SCAN.history.length>6) QR_SCAN.history.length=6;
  const ec=$('#lkCode'), ep=$('#lkPass');
  if(ec) ec.value = r.code;
  if(ep && r.pass) ep.value = r.pass;
  const note = $('#lkScanLog');
  if(note) note.innerHTML = `✓ Đã nhận mã <b>${esc(r.code)}</b> từ ${esc(source||'thiết bị quét')} lúc ${new Date().toLocaleTimeString('vi-VN')}.`;
  if(typeof beepOk==='function') beepOk();
  if(r.pass || !CFG.qr.requirePassword) doLookup();
  else { if(ep){ ep.focus(); ep.select && ep.select(); } showToast('Đã nhận mã tra cứu — nhập tiếp mật mã trên phiếu','ok'); }
  return true;
}
/* Tiếng “tinh” xác nhận đã quét được, giúp nhân viên không phải nhìn màn hình */
function beepOk(){
  try{
    const AC = window.AudioContext || window.webkitAudioContext; if(!AC) return;
    const ac = new AC(); const o = ac.createOscillator(), g = ac.createGain();
    o.type='sine'; o.frequency.value=880; g.gain.value=0.05;
    o.connect(g); g.connect(ac.destination); o.start();
    setTimeout(()=>{ o.stop(); ac.close&&ac.close(); }, 110);
  }catch(e){}
}

/* --- 1) Máy quét chuyên dụng: nhận diện theo nhịp gõ --- */
function wedgeKeyHandler(e){
  if(!QR_SCAN.wedgeOn || STATE.tab!=='lookup') return;
  const tag = (e.target && e.target.tagName)||'';
  const inField = tag==='INPUT' || tag==='TEXTAREA' || tag==='SELECT';
  const now = Date.now();
  if(now - QR_SCAN.last > 120) QR_SCAN.buf = '';   /* nghỉ lâu -> coi như gõ tay */
  QR_SCAN.last = now;
  if(e.key === 'Enter'){
    const data = QR_SCAN.buf; QR_SCAN.buf='';
    if(data.length>=6){ if(handleScanned(data, 'máy quét chuyên dụng')) e.preventDefault(); }
    return;
  }
  if(e.key && e.key.length===1){
    QR_SCAN.buf += e.key;
    if(QR_SCAN.buf.length>512) QR_SCAN.buf='';
    if(!inField && QR_SCAN.buf.length>0) e.preventDefault();
  }
}

/* --- 2) Camera --- */
async function listCameras(){
  try{
    const all = await navigator.mediaDevices.enumerateDevices();
    QR_SCAN.devices = all.filter(d=>d.kind==='videoinput');
  }catch(e){ QR_SCAN.devices = []; }
  return QR_SCAN.devices;
}
async function startQrCamera(){
  const stage = $('#lkStage'), video = $('#lkVideo');
  if(!stage || !video) return;
  const eng = await ensureQrDecoder();
  if(eng==='none' || !cameraPossible()){ renderTab(); return; }
  try{
    const dev = QR_SCAN.devices[QR_SCAN.deviceIdx];
    const constraints = { video: dev && dev.deviceId
      ? { deviceId:{ exact: dev.deviceId }, width:{ideal:1280}, height:{ideal:720} }
      : { facingMode:{ ideal:'environment' }, width:{ideal:1280}, height:{ideal:720} } };
    QR_SCAN.stream = await navigator.mediaDevices.getUserMedia(constraints);
    video.srcObject = QR_SCAN.stream;
    await video.play();
    await listCameras();
    stage.classList.add('on');
    QR_SCAN.mode = 'camera';
    updateScanUi();
    let busy = false;
    const tick = async ()=>{
      if(QR_SCAN.mode!=='camera') return;
      if(!busy && video.videoWidth){
        busy = true;
        try{
          const val = await decodeQrFrom(video, video.videoWidth, video.videoHeight);
          if(val){ stopQrCamera(); handleScanned(val, 'camera'); return; }
        }catch(e){ /* khung hình chưa sẵn sàng */ }
        busy = false;
      }
      QR_SCAN.raf = requestAnimationFrame(tick);
    };
    QR_SCAN.raf = requestAnimationFrame(tick);
  }catch(e){
    const why = (e && e.name==='NotAllowedError') ? 'Bạn chưa cho phép trình duyệt dùng camera.'
              : (e && e.name==='NotFoundError') ? 'Máy không có camera nào khả dụng.'
              : (location.protocol!=='https:' && location.hostname!=='localhost') ? 'Trình duyệt chỉ cho dùng camera trên địa chỉ https.'
              : ('Không bật được camera: '+(e.message||e.name));
    showToast(why,'err');
    QR_SCAN.mode=null; updateScanUi();
  }
}
function stopQrCamera(){
  QR_SCAN.mode = null;
  if(QR_SCAN.raf){ cancelAnimationFrame(QR_SCAN.raf); QR_SCAN.raf=null; }
  if(QR_SCAN.stream){ QR_SCAN.stream.getTracks().forEach(t=>t.stop()); QR_SCAN.stream=null; }
  QR_SCAN.torch = false;
  const stage=$('#lkStage'); if(stage) stage.classList.remove('on');
  updateScanUi();
}
async function switchCamera(){
  if(!QR_SCAN.devices.length) await listCameras();
  if(QR_SCAN.devices.length<2){ showToast('Máy chỉ có một camera','ok'); return; }
  QR_SCAN.deviceIdx = (QR_SCAN.deviceIdx+1) % QR_SCAN.devices.length;
  stopQrCamera(); startQrCamera();
}
async function toggleTorch(){
  try{
    const track = QR_SCAN.stream && QR_SCAN.stream.getVideoTracks()[0];
    if(!track) return;
    const caps = track.getCapabilities ? track.getCapabilities() : {};
    if(!caps.torch){ showToast('Camera này không có đèn trợ sáng','ok'); return; }
    QR_SCAN.torch = !QR_SCAN.torch;
    await track.applyConstraints({ advanced:[{ torch: QR_SCAN.torch }] });
    updateScanUi();
  }catch(e){ showToast('Không bật được đèn: '+e.message,'err'); }
}
/* --- 3) Ảnh chụp mã QR --- */
async function scanQrFromFile(file){
  if(!file) return;
  const eng = await ensureQrDecoder();
  if(eng==='none'){ renderTab(); return; }
  try{
    let src, w, h;
    if(window.createImageBitmap){
      src = await createImageBitmap(file); w = src.width; h = src.height;
    } else {
      src = await new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=rej; im.src=URL.createObjectURL(file); });
      w = src.naturalWidth; h = src.naturalHeight;
    }
    const val = await decodeQrFrom(src, w, h);
    if(val) handleScanned(val, 'ảnh mã QR');
    else showToast('Không tìm thấy mã QR trong ảnh. Thử chụp lại rõ hơn, đủ sáng, mã nằm trọn trong khung.','err');
  }catch(e){ showToast('Không đọc được ảnh: '+e.message,'err'); }
}
/* Cập nhật riêng phần điều khiển quét, không vẽ lại cả trang cho đỡ giật */
function updateScanUi(){
  const on = QR_SCAN.mode==='camera';
  const b = $('#lkStart'); if(b) b.innerHTML = on ? '⏹ Dừng camera' : '▶ Bật camera';
  if(b) b.classList.toggle('btn-danger', on);
  const sw = $('#lkSwitch'); if(sw) sw.style.display = on ? '' : 'none';
  const tr = $('#lkTorch');
  if(tr){ tr.style.display = on ? '' : 'none'; tr.classList.toggle('btn-gold', QR_SCAN.torch); }
  const hint = $('#lkStageHint');
  if(hint) hint.textContent = on ? 'Đưa mã QR vào giữa khung — hệ thống tự nhận và tra cứu'
                                 : 'Camera đang tắt';
}

/* ============================== DASHBOARD ================================ */
/* ==========================================================================
 *  BẢNG ĐIỀU KHIỂN — LỚP TÍNH TOÁN SỐ LIỆU
 *  Mọi biểu đồ đều lấy từ một hàm tổng hợp duy nhất để các con số trên màn hình,
 *  trong PDF và trong Word luôn khớp nhau tuyệt đối.
 * ========================================================================== */
function dashDefaultFilter(){
  const now = new Date(), y = now.getFullYear();
  return { preset:'year', tu:y+'-01-01', den:todayISO(), programId:'', hinhThuc:'', donVi:'',
           groupBy:'auto', includeInactive:false };
}
function dashPeriodKey(iso, mode){
  if(!iso) return '';
  const y = iso.slice(0,4), m = iso.slice(5,7);
  if(mode==='year') return y;
  if(mode==='quarter') return y+'-Q'+(Math.floor((parseInt(m)-1)/3)+1);
  return y+'-'+m;
}
function dashPeriodLabel(key, mode){
  if(mode==='year') return 'Năm '+key;
  if(mode==='quarter') return key.replace('-',' ');
  const [y,m] = key.split('-'); return 'T'+parseInt(m)+'/'+y.slice(2);
}
/* Sinh đủ các mốc thời gian giữa hai đầu mút để biểu đồ không bị "nhảy cóc"
   ở những kỳ không cấp giấy nào — nhìn đúng thực tế hơn. */
function dashPeriodRange(tu, den, mode){
  const out=[]; if(!tu||!den) return out;
  let a=new Date(tu+'T00:00:00'), b=new Date(den+'T00:00:00');
  if(isNaN(a)||isNaN(b)||a>b) return out;
  if(mode==='year'){ for(let y=a.getFullYear(); y<=b.getFullYear(); y++) out.push(String(y)); return out; }
  if(mode==='quarter'){
    let y=a.getFullYear(), q=Math.floor(a.getMonth()/3)+1;
    const ye=b.getFullYear(), qe=Math.floor(b.getMonth()/3)+1;
    while(y<ye || (y===ye && q<=qe)){ out.push(y+'-Q'+q); q++; if(q>4){q=1;y++;} if(out.length>200) break; }
    return out;
  }
  let y=a.getFullYear(), m=a.getMonth()+1;
  const ye=b.getFullYear(), me=b.getMonth()+1;
  while(y<ye || (y===ye && m<=me)){ out.push(y+'-'+String(m).padStart(2,'0')); m++; if(m>12){m=1;y++;} if(out.length>400) break; }
  return out;
}
function dashCompute(f){
  const inRange = iso => (!f.tu || (iso||'') >= f.tu) && (!f.den || (iso||'') <= f.den);
  const alive = c => c.trangThai!=='huy' && c.trangThai!=='thu_hoi';

  /* --- Giấy chứng nhận lọt bộ lọc --- */
  const certs = DATA.certificates.filter(c=>{
    if(!inRange(c.ngayCap)) return false;
    if(!f.includeInactive && !alive(c)) return false;
    if(f.programId && c.programId!==f.programId) return false;
    const rec = byId(DATA.records, c.recordId) || {};
    const ht = c.hinhThucSnapshot || rec.hinhThuc || '';
    if(f.hinhThuc && ht!==f.hinhThuc) return false;
    if(f.donVi){
      const p = byId(DATA.participants,c.participantId) || c.participantSnapshot || {};
      if(!String(p.donViCongTac||'').toLowerCase().includes(f.donVi.toLowerCase())) return false;
    }
    return true;
  });
  const certsAlive = certs.filter(alive);

  /* --- Ghi nhận giờ tín chỉ chưa cấp giấy (đo tiến độ cấp) --- */
  const issuedRecIds = new Set(DATA.certificates.filter(alive).map(c=>c.recordId));
  const recPending = DATA.records.filter(r=>{
    if(issuedRecIds.has(r.id)) return false;
    if(f.programId && r.programId!==f.programId) return false;
    if(f.hinhThuc && r.hinhThuc!==f.hinhThuc) return false;
    const pg = byId(DATA.programs, r.programId);
    if(pg && pg.ngayKetThuc && !inRange(pg.ngayKetThuc)) return false;
    return true;
  });

  /* --- Nhóm theo kỳ --- */
  let mode = f.groupBy;
  if(mode==='auto'){
    const days = (f.tu && f.den) ? daysBetween(f.tu, f.den) : 400;
    mode = days<=200 ? 'month' : (days<=1200 ? 'quarter' : 'year');
  }
  const keys = dashPeriodRange(f.tu||(certs.length?certs.map(c=>c.ngayCap).sort()[0]:todayISO()), f.den||todayISO(), mode);
  const byPeriodCount={}, byPeriodHours={};
  keys.forEach(k=>{ byPeriodCount[k]=0; byPeriodHours[k]=0; });
  certsAlive.forEach(c=>{
    const k = dashPeriodKey(c.ngayCap, mode);
    if(byPeriodCount[k]===undefined){ byPeriodCount[k]=0; byPeriodHours[k]=0; keys.push(k); }
    byPeriodCount[k]++; byPeriodHours[k]+=(c.gioTinChi||0);
  });
  keys.sort();
  const seriesCount = keys.map(k=>({label:dashPeriodLabel(k,mode), value:byPeriodCount[k]||0}));
  let run=0;
  const seriesCum = keys.map(k=>{ run += (byPeriodHours[k]||0); return {label:dashPeriodLabel(k,mode), value:Math.round(run*100)/100}; });

  /* --- Cơ cấu theo hình thức CME --- */
  const byHT={};
  certsAlive.forEach(c=>{
    const rec = byId(DATA.records, c.recordId) || {};
    const id = c.hinhThucSnapshot || rec.hinhThuc || 'khac';
    const h = hinhThucById(id);
    const name = h ? h.ten : (typeof id==='string' && id!=='khac' ? id : 'Khác');
    byHT[name] = (byHT[name]||0) + (c.gioTinChi||0);
  });
  const htData = Object.entries(byHT).map(([k,v])=>({label:k, value:Math.round(v*100)/100})).sort((a,b)=>b.value-a.value);

  /* --- Xếp hạng chương trình / đơn vị công tác --- */
  const progAgg={};
  certsAlive.forEach(c=>{
    const pg = byId(DATA.programs,c.programId) || c.programSnapshot || {};
    const key = c.programId || (pg.ten||'—');
    if(!progAgg[key]) progAgg[key]={ ten:pg.ten||'(không rõ)', hoc:0, gio:0, ngayKT:pg.ngayKetThuc||'', ngayBD:pg.ngayBatDau||'', ht:pg.hinhThuc||'' , ids:new Set()};
    progAgg[key].hoc++; progAgg[key].gio += (c.gioTinChi||0); progAgg[key].ids.add(c.participantId);
  });
  const progRows = Object.entries(progAgg).map(([id,v])=>({
    id, ten:v.ten, hoc:v.hoc, nguoi:v.ids.size, gio:Math.round(v.gio*100)/100,
    tb: v.hoc? Math.round(v.gio/v.hoc*100)/100 : 0, ngayBD:v.ngayBD, ngayKT:v.ngayKT
  })).sort((a,b)=>b.hoc-a.hoc);
  const topPrograms = progRows.slice(0,8).map(r=>({label:r.ten, value:r.hoc, sub:'học viên'}));

  const unitAgg={};
  certsAlive.forEach(c=>{
    const p = byId(DATA.participants,c.participantId) || c.participantSnapshot || {};
    const key = (p.donViCongTac||'(chưa ghi đơn vị)').trim();
    unitAgg[key] = (unitAgg[key]||0)+1;
  });
  const topUnits = Object.entries(unitAgg).map(([k,v])=>({label:k, value:v, sub:'giấy'})).sort((a,b)=>b.value-a.value).slice(0,8);

  /* --- Tiến độ chu kỳ 120 giờ tín chỉ / 5 năm (Điều 3 TT 32/2023/TT-BYT) --- */
  const cycleFrom = addYears(todayISO(), -5);
  const perPerson = {};
  DATA.certificates.filter(alive).forEach(c=>{
    if((c.ngayCap||'') < cycleFrom) return;
    perPerson[c.participantId] = (perPerson[c.participantId]||0) + (c.gioTinChi||0);
  });
  const buckets = [
    {label:'Đạt từ 120 giờ trở lên', min:120, max:Infinity, color:'#1F7A6C'},
    {label:'Từ 90 đến dưới 120 giờ', min:90,  max:120,      color:'#4E8F5A'},
    {label:'Từ 60 đến dưới 90 giờ',  min:60,  max:90,       color:'#B8873A'},
    {label:'Từ 30 đến dưới 60 giờ',  min:30,  max:60,       color:'#C97B32'},
    {label:'Dưới 30 giờ',            min:0,   max:30,       color:'#C0433F'}
  ].map(b=>({label:b.label, color:b.color, value:0}));
  const allPeople = DATA.participants.length ? DATA.participants.map(p=>p.id) : Object.keys(perPerson);
  allPeople.forEach(pid=>{
    const g = perPerson[pid]||0;
    if(g>=120) buckets[0].value++;
    else if(g>=90) buckets[1].value++;
    else if(g>=60) buckets[2].value++;
    else if(g>=30) buckets[3].value++;
    else buckets[4].value++;
  });
  const cycleDone = buckets[0].value;

  /* --- Tình trạng giấy & tiến độ cấp --- */
  const statusAgg={};
  DATA.certificates.filter(c=>inRange(c.ngayCap)).forEach(c=>{
    const st = STATUS_LABEL[c.trangThai] || STATUS_LABEL.valid;
    statusAgg[st[0]] = (statusAgg[st[0]]||0)+1;
  });
  const statusColors = {'Còn hiệu lực':'#1F7A6C','Đã hủy bỏ':'#C0433F','Đã thu hồi':'#8C2F2C','Đã đính chính':'#B8873A'};
  const statusData = Object.entries(statusAgg).map(([k,v])=>({label:k, value:v, color:statusColors[k]}));

  const withQr = certsAlive.filter(c=>c.maTraCuu).length;
  const withFile = certsAlive.filter(c=>c.filePath || c.driveLink || c.published).length;
  const funnel = [
    {label:'Ghi nhận giờ tín chỉ', value: certsAlive.length + recPending.length, color:'#4A5D75'},
    {label:'Đã cấp giấy chứng nhận', value: certsAlive.length, color:'#1F4E7A'},
    {label:'Đã sinh mã QR tra cứu', value: withQr, color:'#1F7A6C'},
    {label:'Đã lưu bản điện tử', value: withFile, color:'#B8873A'}
  ];

  /* --- Hồ sơ lưu trữ --- */
  const ab = (typeof archiveBuckets==='function') ? archiveBuckets() : {active:[],pending:[],archived:[],due:[],soon:[]};

  const totalHours = certsAlive.reduce((s,c)=>s+(c.gioTinChi||0),0);
  return {
    mode, f, certs, certsAlive, recPending,
    kpi:{
      certs: certsAlive.length,
      hours: Math.round(totalHours*100)/100,
      people: new Set(certsAlive.map(c=>c.participantId)).size,
      programs: progRows.length,
      avg: certsAlive.length ? Math.round(totalHours/certsAlive.length*100)/100 : 0,
      pending: recPending.length,
      cycleDone: cycleDone,
      cyclePct: allPeople.length ? Math.round(cycleDone/allPeople.length*1000)/10 : 0,
      revoked: DATA.certificates.filter(c=>inRange(c.ngayCap) && !alive(c)).length
    },
    seriesCount, seriesCum, htData, topPrograms, topUnits, progRows,
    buckets, statusData, funnel,
    archive:{ pending:ab.pending.length, archived:ab.archived.length, soon:ab.soon.length, due:ab.due.length }
  };
}
function dashFilterText(f){
  const parts=[];
  parts.push('Từ ngày '+(f.tu?fmtDate(f.tu):'…')+' đến ngày '+(f.den?fmtDate(f.den):'…'));
  if(f.programId){ const pg=byId(DATA.programs,f.programId); parts.push('Chương trình: '+(pg?pg.ten:f.programId)); }
  if(f.hinhThuc){ const h=hinhThucById(f.hinhThuc); parts.push('Hình thức: '+(h?h.ten:f.hinhThuc)); }
  if(f.donVi) parts.push('Đơn vị công tác chứa: “'+f.donVi+'”');
  if(f.includeInactive) parts.push('Bao gồm giấy đã hủy/thu hồi');
  return parts.join(' · ');
}

function dashKpiBlock(D){
  const k=D.kpi;
  const item=(l,v,s)=>`<div><div class="l">${esc(l)}</div><div class="v">${esc(String(v))}</div><div class="l">${esc(s||'')}</div></div>`;
  return `<div class="rp-kpi">
    ${item('Giấy đã cấp', k.certs, 'trong kỳ báo cáo')}
    ${item('Tổng giờ tín chỉ', fmtNum(k.hours), 'trung bình '+fmtNum(k.avg)+' giờ/giấy')}
    ${item('Học viên', k.people, 'người được cấp giấy')}
    ${item('Chương trình', k.programs, 'có phát sinh cấp giấy')}
  </div>
  <div class="rp-kpi">
    ${item('Chờ cấp giấy', k.pending, 'ghi nhận chưa xuất giấy')}
    ${item('Đạt 120 giờ/5 năm', k.cycleDone, fmtNum(k.cyclePct)+'% người hành nghề')}
    ${item('Hủy bỏ / thu hồi', k.revoked, 'giấy không còn hiệu lực')}
    ${item('Hồ sơ đang lưu trữ', D.archive.archived, D.archive.pending+' chờ đưa vào lưu trữ')}
  </div>`;
}
function dashProgramTableHtml(D, limit){
  const rows = D.progRows.slice(0, limit||24);
  return `<table class="rp-tbl">
    <thead><tr><th style="width:8mm;">#</th><th>Chương trình / khóa đào tạo</th><th style="width:34mm;">Thời gian</th>
      <th style="width:16mm;text-align:right;">Học viên</th><th style="width:16mm;text-align:right;">Lượt cấp</th>
      <th style="width:20mm;text-align:right;">Tổng giờ</th><th style="width:20mm;text-align:right;">TB/HV</th></tr></thead>
    <tbody>${rows.length===0?'<tr><td colspan="7" style="text-align:center;">Không có dữ liệu</td></tr>':
      rows.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.ten)}</td>
        <td>${r.ngayBD?fmtDate(r.ngayBD):'—'} → ${r.ngayKT?fmtDate(r.ngayKT):'—'}</td>
        <td style="text-align:right;">${r.nguoi}</td><td style="text-align:right;">${r.hoc}</td>
        <td style="text-align:right;">${fmtNum(r.gio)}</td><td style="text-align:right;">${fmtNum(r.tb)}</td></tr>`).join('')}
    </tbody></table>
    ${D.progRows.length>rows.length?`<div style="font-size:8.5pt;font-style:italic;margin-top:2mm;">… và ${D.progRows.length-rows.length} chương trình khác, xem đầy đủ trong bản Excel xuất từ màn hình Bảng điều khiển.</div>`:''}`;
}
/* Bộ biểu đồ dùng chung cho cả PDF lẫn Word — khai báo một lần, dùng hai nơi */
function dashChartSet(D){
  const groupName = D.mode==='year'?'năm':(D.mode==='quarter'?'quý':'tháng');
  return [
    { key:'issued', title:'Số giấy chứng nhận cấp theo '+groupName,
      svg: chartBars(D.seriesCount,{w:640,h:280,unit:'giấy',rotate:D.seriesCount.length>9,color:'#1F4E7A'}) },
    { key:'cum', title:'Lũy kế giờ tín chỉ đã cấp',
      svg: chartLine(D.seriesCum,{w:640,h:280,unit:'giờ',gid:'r1',color:'#1F7A6C'}) },
    { key:'mix', title:'Cơ cấu giờ tín chỉ theo hình thức CME',
      svg: chartDonut(D.htData,{w:640,h:280,centerLabel:'giờ tín chỉ'}) },
    { key:'cycle', title:'Tiến độ tích lũy 120 giờ tín chỉ trong 5 năm',
      svg: chartHBar(D.buckets,{w:640,max:5,labelW:230,labelChars:34,rowH:32}) },
    { key:'programs', title:'Chương trình có nhiều học viên nhất',
      svg: chartHBar(D.topPrograms,{w:640,max:8,labelW:230,labelChars:36}) },
    { key:'units', title:'Đơn vị công tác có nhiều lượt cấp nhất',
      svg: chartHBar(D.topUnits,{w:640,max:8,labelW:230,labelChars:36}) },
    { key:'funnel', title:'Tiến độ cấp giấy và hoàn thiện hồ sơ',
      svg: chartHBar(D.funnel,{w:640,max:4,labelW:220,labelChars:34,rowH:34}) },
    { key:'status', title:'Tình trạng giấy chứng nhận',
      svg: chartDonut(D.statusData,{w:640,h:250,centerLabel:'giấy'}) }
  ];
}
function dashReportPages(D){
  const ch = dashChartSet(D);
  const box = c => `<h2>${esc(c.title)}</h2><div style="width:100%;">${c.svg}</div>`;
  const pages = [];
  pages.push(`${dashReportHeader(D,1,3)}<h2>I. Số liệu tổng hợp</h2>${dashKpiBlock(D)}
    ${box(ch[0])}${box(ch[1])}`);
  pages.push(`${dashReportHeader(D,2,3)}<h2>II. Cơ cấu và tiến độ đào tạo</h2>
    ${box(ch[2])}${box(ch[3])}${box(ch[6])}`);
  pages.push(`${dashReportHeader(D,3,3)}<h2>III. Xếp hạng và chi tiết theo chương trình</h2>
    ${box(ch[4])}${box(ch[5])}
    <h2>Chi tiết theo chương trình / khóa đào tạo</h2>${dashProgramTableHtml(D,22)}
    <div style="margin-top:8mm;font-size:9pt;font-style:italic;text-align:right;">
      Người lập báo cáo<br><br><br><br>(Ký, ghi rõ họ tên)</div>`);
  return pages;
}
async function exportDashboardPDF(D){
  D = D || STATE.dashData; if(!D){ showToast('Chưa có số liệu để xuất','err'); return; }
  if(typeof html2canvas==='undefined' || !window.jspdf){ showToast('Chưa nạp được thư viện tạo PDF. Kiểm tra kết nối mạng rồi thử lại.','err'); return; }
  showToast('Đang dựng báo cáo PDF...','ok');
  try{
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({unit:'mm', format:'a4', orientation:'portrait', compress:true});
    const pages = dashReportPages(D);
    for(let i=0;i<pages.length;i++){
      const wrap = document.createElement('div');
      wrap.style.cssText='position:fixed;left:-99999px;top:0;';
      wrap.innerHTML = `<div class="rp-page">${pages[i]}</div>`;
      document.body.appendChild(wrap);
      try{
        const el = wrap.querySelector('.rp-page');
        await waitForImages(wrap);
        const canvas = await html2canvas(el, {scale:2, backgroundColor:'#ffffff', logging:false,
          width: el.offsetWidth, height: el.offsetHeight});
        if(i>0) pdf.addPage('a4','portrait');
        pdf.addImage(canvas.toDataURL('image/jpeg',0.95),'JPEG',0,0,210,297,undefined,'FAST');
      } finally { wrap.remove(); }
    }
    pdf.save('BaoCaoTrucQuan_CME_'+todayISO()+'.pdf');
    showToast('Đã tạo báo cáo PDF','ok');
  }catch(e){ showToast('Lỗi khi tạo báo cáo PDF: '+e.message,'err'); }
}

    const set = dashChartSet(D);

    h.diaChi=$('#f_diaChi').value.trim();
    h.dienThoai=$('#f_dienThoai').value.trim();
    h.email=$('#f_email').value.trim();
    h.chucDanhKy=$('#f_chucDanhKy').value.trim()||'GIÁM ĐỐC';
    h.tenGiamDoc=$('#f_tenGiamDoc').value.trim();
    h.soQuyetDinh=$('#f_soQuyetDinh').value.trim();
    h.ngayHieuLuc=$('#f_ngayHieuLuc').value;
    saveData();
    showToast('Đã lưu thông tin đơn vị','ok');
    if(CFG.google.enabled && CFG.google.autoSync && GS.token) gsPushAll().catch(()=>{});
    renderApp();
  });
}

/* =============================== PROGRAMS ================================= */
function renderPrograms(c,tr){
  tr.innerHTML = `<div class="search-box"><input type="text" id="progSearch" placeholder="Tìm chương trình..." value="${esc(STATE.search)}"></div>
    <button class="btn btn-primary" id="addProgram">+ Thêm chương trình</button>`;
  const list = DATA.programs.filter(p=>{
    if(!STATE.search) return true;
    const s=STATE.search.toLowerCase();
    return (p.ten||'').toLowerCase().includes(s) || (p.ma||'').toLowerCase().includes(s);
  }).sort((a,b)=>(b.ngayBatDau||'').localeCompare(a.ngayBatDau||''));

  c.innerHTML = `
    <div class="card">
      <div class="tbl-wrap"><table class="tbl">
        <thead><tr><th>Mã</th><th>Tên / Nội dung, chủ đề</th><th>Hình thức</th><th>Thời gian</th><th>Số tiết/buổi</th><th></th></tr></thead>
        <tbody>
        ${list.length===0?`<tr><td colspan="6" class="empty"><div class="ic">▤</div>Chưa có chương trình nào. Nhấn <b>"+ Thêm chương trình"</b> để bắt đầu.</td></tr>`:
        list.map(p=>{
          const h=hinhThucById(p.hinhThuc);
          const cnt = DATA.records.filter(r=>r.programId===p.id).length;
          return `<tr>
            <td class="mono">${esc(p.ma)}</td>
            <td><b>${esc(p.ten)}</b><div class="small-muted">${esc(p.donViChiuTrachNhiem||'')}</div></td>
            <td><span class="tag-pill">${esc(h?h.ten:p.hinhThuc)}</span><div class="small-muted">${h?h.dieu:''}</div></td>
            <td>${fmtDate(p.ngayBatDau)} → ${fmtDate(p.ngayKetThuc)}</td>
            <td class="mono">${esc(p.soTiet||'-')}${p.soBuoi?(' / '+p.soBuoi+' buổi'):''}</td>
            <td class="hstack">
              <button class="btn btn-sm" data-edit="${p.id}">Sửa</button>
              <button class="btn btn-sm" data-recs="${p.id}">${cnt} người</button>
              <button class="btn btn-sm btn-danger" data-del="${p.id}">Xóa</button>
            </td>
          </tr>`;
        }).join('')}
        </tbody>
      </table></div>
    </div>`;

  $('#progSearch').addEventListener('input', e=>{ STATE.search=e.target.value; renderTab(); });
  $('#addProgram').addEventListener('click', ()=>openProgramModal(null));
  $all('[data-edit]', c).forEach(b=>b.addEventListener('click', ()=>openProgramModal(b.dataset.edit)));
  $all('[data-del]', c).forEach(b=>b.addEventListener('click', ()=>{
    const id = b.dataset.del;
    const pg = byId(DATA.programs, id) || {};
    const guard = guardDeleteProgram(id);
    if(guard.ok){
      if(!confirm('Xoá chương trình "'+(pg.ten||'')+'"?')) return;
      performDeleteProgram(id); return;
    }
    openDeleteGuardModal({
      title:'Xoá chương trình / hoạt động CME', subject:pg.ten||'', guard,
      onConfirm:()=>performDeleteProgram(id)
    });
  }));
  $all('[data-recs]', c).forEach(b=>b.addEventListener('click', ()=>{ STATE.tab='records'; STATE.filterProgram=b.dataset.recs; renderApp(); }));
}

function openProgramModal(id){
  const editing = id ? byId(DATA.programs, id) : null;
  const p = editing || { id:null, ma:'CT-'+String(DATA.programs.length+1).padStart(3,'0'), ten:'', hinhThuc:'khoa_dao_tao', donViToChuc:'', donViChiuTrachNhiem:'', ngayBatDau:'', ngayKetThuc:'', soTiet:'', soBuoi:'', ghiChu:'' };
  const htOptions = HINH_THUC.map(h=>`<option value="${h.id}" ${p.hinhThuc===h.id?'selected':''}>${esc(h.ten)} (${h.dieu})</option>`).join('');
  openModal(editing?'Sửa chương trình / hoạt động CME':'Thêm chương trình / hoạt động CME', `

    <div class="card" style="margin-bottom:14px;">

        <tbody>
        ${list.length===0?`<tr><td colspan="8" class="empty"><div class="ic">◒</div>Chưa có người tham gia nào.<div style="margin-top:8px;">Thêm từng người bằng nút <b>"+ Thêm người tham gia"</b>, hoặc tải file Excel mẫu rồi nhập hàng loạt.</div></td></tr>`:
        list.map(p=>{
          const certs = DATA.certificates.filter(x=>x.participantId===p.id);
          const active = certs.filter(ACTIVE_CERT);
          const hours = active.reduce((s,x)=>s+(x.gioTinChi||0),0);
          return `<tr>

            <td class="right mono">${fmtNum(hours)}</td>

              <button class="btn btn-sm btn-danger" data-del="${p.id}">Xóa</button>
            </td>
          </tr>`;

  $('#parSearch').addEventListener('input', e=>{ STATE.search=e.target.value; renderTab(); });
  $('#addPar').addEventListener('click', ()=>openParticipantModal(null));

  $('#impPar2').addEventListener('click', openImportParticipantsModal);
  $('#dlTemplate').addEventListener('click', downloadParticipantTemplate);
  $('#expPar').addEventListener('click', exportParticipantsExcel);
  $all('[data-edit]', c).forEach(b=>b.addEventListener('click', ()=>openParticipantModal(b.dataset.edit)));
  $all('[data-del]', c).forEach(b=>b.addEventListener('click', ()=>{
    const id = b.dataset.del;
    const p = byId(DATA.participants, id) || {};
    const guard = guardDeleteParticipant(id);

      if(!confirm('Xoá người tham gia "'+(p.hoTen||'')+'" khỏi danh mục?')) return;
      performDeleteParticipant(id); return;

      title:'Xoá người tham gia', subject:p.hoTen||'', guard,

        recordSuggestion('chucDanh', obj.chucDanh);

function renderRecords(c,tr){
  tr.innerHTML = `<button class="btn btn-primary" id="addRec">+ Ghi nhận giờ tín chỉ</button>`;
  let list = DATA.records.slice();
  if(STATE.filterProgram){ list = list.filter(r=>r.programId===STATE.filterProgram); }
  list.sort((a,b)=>(b.id||'').localeCompare(a.id||''));

  const filterProgramName = STATE.filterProgram ? (byId(DATA.programs, STATE.filterProgram)||{}).ten : null;

  c.innerHTML = `
    ${filterProgramName ? `<div class="hstack" style="margin-bottom:12px;"><span class="badge badge-gold">Lọc theo chương trình: ${esc(filterProgramName)}</span><button class="link-btn" id="clearFilter">Xóa lọc</button></div>` : ''}
    <div class="card">
      <div class="tbl-wrap"><table class="tbl">
        <thead><tr><th class="checkbox-cell"></th><th>Người tham gia</th><th>Chương trình / hoạt động</th><th>Hình thức</th><th>Vai trò</th><th>Số lượng</th><th>Giờ TC</th><th>Đã cấp giấy?</th><th></th></tr></thead>
        <tbody>
        ${list.length===0?`<tr><td colspan="9" class="empty"><div class="ic">✎</div>Chưa có ghi nhận nào. Nhấn <b>"+ Ghi nhận giờ tín chỉ"</b>.</td></tr>`:
        list.map(r=>{
          const p=byId(DATA.participants,r.participantId), pg=byId(DATA.programs,r.programId);
          const h=hinhThucById(r.hinhThuc), vt=vaiTroById(r.hinhThuc, r.vaiTro);
          const cert = DATA.certificates.find(x=>x.recordId===r.id && x.trangThai!=='huy' && x.trangThai!=='thu_hoi');
          return `<tr>
            <td class="checkbox-cell"><input type="checkbox" class="recChk" value="${r.id}"></td>
            <td><b>${esc(p?p.hoTen:'(đã xóa)')}</b><div class="small-muted">${esc(p?p.donViCongTac:'')}</div></td>
            <td>${esc(pg?pg.ten:'(đã xóa)')}</td>
            <td><span class="tag-pill">${esc(h?h.ten:r.hinhThuc)}</span></td>
            <td>${esc(vt?vt.ten:r.vaiTro)}</td>
            <td class="mono">${esc(r.soLuong)} ${esc(vt?vt.donVi:'')}</td>
            <td class="mono"><b>${fmtNum(r.gioTinChi)}</b></td>
            <td>${cert?`<span class="badge badge-teal">${esc(cert.soGiay)}</span>`:'<span class="badge badge-gray">Chưa cấp</span>'}</td>
            <td class="hstack">
              <button class="btn btn-sm" data-edit="${r.id}">Sửa</button>
              <button class="btn btn-sm btn-danger" data-del="${r.id}">Xóa</button>
            </td>
          </tr>`;
        }).join('')}
        </tbody>
      </table></div>
      ${list.length>0?`<div class="card-pad" style="border-top:1px solid var(--border);"><button class="btn btn-teal btn-sm" id="goIssue">🎓 Cấp giấy cho các mục đã chọn</button></div>`:''}
    </div>`;

  if($('#clearFilter')) $('#clearFilter').addEventListener('click', ()=>{ STATE.filterProgram=null; renderTab(); });
  $('#addRec').addEventListener('click', ()=>openRecordModal(null));
  $all('[data-edit]', c).forEach(b=>b.addEventListener('click', ()=>openRecordModal(b.dataset.edit)));
  $all('[data-del]', c).forEach(b=>b.addEventListener('click', ()=>{
    const id = b.dataset.del;
    const r = byId(DATA.records, id) || {};
    const p = byId(DATA.participants, r.participantId) || {};
    const pg = byId(DATA.programs, r.programId) || {};
    const guard = guardDeleteRecord(id);
    if(guard.ok){
      if(!confirm('Xoá ghi nhận giờ tín chỉ này?')) return;
      performDeleteRecord(id); return;
    }
    openDeleteGuardModal({
      title:'Xoá ghi nhận giờ tín chỉ',
      subject:(p.hoTen||'')+' — '+(pg.ten||''), guard,
      onConfirm:()=>performDeleteRecord(id)
    });
  }));
  if($('#goIssue')) $('#goIssue').addEventListener('click', ()=>{
    const ids = $all('.recChk:checked', c).map(x=>x.value);
    if(ids.length===0){ showToast('Hãy chọn ít nhất một ghi nhận','err'); return; }
    STATE.tab='issue'; STATE.issueRecordIds=ids; renderApp();
  });
}

function openRecordModal(id){
  const editing = id ? byId(DATA.records, id) : null;
  const r = editing || { id:null, participantId: STATE.lastParticipant||'', programId: STATE.filterProgram||'', hinhThuc:'', vaiTro:'', soLuong:1, gioTinChi:0, ghiChu:'' };
  if(editing){ /* derive hinhThuc from program if missing */ }
  const parOptions = DATA.participants.slice().sort((a,b)=>(a.hoTen||'').localeCompare(b.hoTen||'','vi')).map(p=>`<option value="${p.id}" ${r.participantId===p.id?'selected':''}>${esc(p.hoTen)} — ${esc(p.donViCongTac||'')}</option>`).join('');
  const progOptions = DATA.programs.slice().sort((a,b)=>(b.ngayBatDau||'').localeCompare(a.ngayBatDau||'')).map(p=>`<option value="${p.id}" data-ht="${p.hinhThuc}" ${r.programId===p.id?'selected':''}>${esc(p.ma)} — ${esc(p.ten)}</option>`).join('');

  if(DATA.participants.length===0){ showToast('Vui lòng thêm người tham gia trước','err'); return; }
  if(DATA.programs.length===0){ showToast('Vui lòng thêm chương trình / hoạt động trước','err'); return; }

  openModal(editing?'Sửa ghi nhận giờ tín chỉ':'Ghi nhận giờ tín chỉ', `
    <div class="field"><label>Người tham gia <span style="color:var(--danger)">*</span></label><select id="m_par">${parOptions}</select></div>
    <div class="field"><label>Chương trình / hoạt động <span style="color:var(--danger)">*</span></label><select id="m_prog">${progOptions}</select></div>
    <div class="field"><label>Vai trò <span style="color:var(--danger)">*</span></label><select id="m_role"></select><div class="hint" id="m_role_hint"></div></div>
    <div class="grid grid-2">
      <div class="field"><label id="m_qty_label">Số lượng</label><input type="number" step="0.5" min="0" id="m_qty" value="${r.soLuong}"></div>
      <div class="field"><label>Giờ tín chỉ (tự tính, có thể sửa)</label><input type="number" step="0.5" min="0" id="m_hours" value="${r.gioTinChi}"></div>
    </div>
    <div class="field"><label>Ghi chú / minh chứng hồ sơ</label><textarea id="m_ghichu">${esc(r.ghiChu||'')}</textarea></div>
  `, [
    { id:'cancelM', label:'Hủy', onClick:closeModal },
    { id:'saveM', label: editing?'Lưu thay đổi':'Thêm ghi nhận', cls:'btn-primary', onClick:()=>{
        const participantId=$('#m_par').value, programId=$('#m_prog').value, htId=$('#m_prog').selectedOptions[0].dataset.ht, roleId=$('#m_role').value;
        if(!participantId||!programId||!roleId){ showToast('Vui lòng chọn đầy đủ thông tin','err'); return; }
        const dupRec = findDuplicateRecord(participantId, programId, roleId, editing?editing.id:null);
        if(dupRec && !confirm('Người này đã có ghi nhận cùng chương trình và cùng vai trò.\n\nĐiều 3 của Quy định: không tính lặp lại cùng một hoạt động, cùng thời gian và vai trò. Vẫn tiếp tục lưu?')) return;
        const obj = { id: editing?editing.id:('RC'+Date.now()), participantId, programId, hinhThuc:htId, vaiTro:roleId, soLuong:parseFloat($('#m_qty').value)||0, gioTinChi:parseFloat($('#m_hours').value)||0, ghiChu:$('#m_ghichu').value.trim() };
        if(editing) Object.assign(editing, obj); else DATA.records.push(obj);
        STATE.lastParticipant = participantId;
        saveData(); closeModal(); showToast('Đã lưu ghi nhận','ok'); renderTab();
      }}
  ]);

  function refreshRoles(){
    const htId = $('#m_prog').selectedOptions[0] ? $('#m_prog').selectedOptions[0].dataset.ht : '';
    const h = hinhThucById(htId);
    const roleSel = $('#m_role');
    roleSel.innerHTML = h ? h.roles.map(role=>`<option value="${role.id}" ${r.vaiTro===role.id?'selected':''}>${esc(role.ten)}</option>`).join('') : '<option value="">— chọn chương trình trước —</option>';
    updateCalc();
  }
  function updateCalc(){
    const htId = $('#m_prog').selectedOptions[0] ? $('#m_prog').selectedOptions[0].dataset.ht : '';
    const role = vaiTroById(htId, $('#m_role').value);
    $('#m_role_hint').textContent = role ? (role.ct||'') : '';
    $('#m_qty_label').textContent = role ? ('Số lượng ('+role.donVi+')') : 'Số lượng';
    if(role && role.rate!==null){
      const qty = parseFloat($('#m_qty').value)||0;
      $('#m_hours').value = Math.round(qty*role.rate*100)/100;
    }
  }
  $('#m_prog').addEventListener('change', refreshRoles);
  $('#m_role').addEventListener('change', updateCalc);
  $('#m_qty').addEventListener('input', updateCalc);
  refreshRoles();
  if(editing){ $('#m_role').value = r.vaiTro; updateCalc(); $('#m_hours').value = r.gioTinChi; }
}

  { key:'soYTe', label:'Tên cơ quan chủ quản (Sở Y tế)' },
  { key:'tenDonVi', label:'Tên đơn vị cấp giấy' },
  { key:'maTraCuu', label:'Mã tra cứu giấy chứng nhận' },
  { key:'qrCode', label:'Ảnh mã QR tra cứu' }
];
function mergeFieldValue(key, ctx){
  const { hospital:h, participant:p, program:pg, record:r, vaiTro, soGiay, ngayCap } = ctx;
  switch(key){
    case 'hoTen': return p?p.hoTen:'';
    case 'danhXung': return (p && p.gioiTinh==='Nữ') ? 'Bà' : 'Ông';
    case 'ngaySinh': return p&&p.ngaySinh ? fmtDate(p.ngaySinh) : '';
    case 'donViCongTac': return p?p.donViCongTac:'';
    case 'hinhThuc': return vaiTro&&vaiTro.htTen ? vaiTro.htTen : ((hinhThucById(r?r.hinhThuc:'')||{}).ten||'');
    case 'noiDung': return pg?pg.ten:'';
    case 'donViChiuTrachNhiem': return pg?(pg.donViChiuTrachNhiem||h.tenDonVi):'';
    case 'thoiGian': { const bd=fmtDateParts(pg?pg.ngayBatDau:''), kt=fmtDateParts(pg?pg.ngayKetThuc:''); return `từ ngày ${bd.d} tháng ${bd.m} năm ${bd.y}, đến ngày ${kt.d} tháng ${kt.m} năm ${kt.y}`; }
    case 'soLuong': return r?(r.soLuong+' '+(vaiTro?vaiTro.donVi:'')):'';
    case 'gioTinChi': return r? fmtNum(r.gioTinChi) : '0';
    case 'bangChu': return soThanhChuVN(r?(Math.round((r.gioTinChi||0)*100)/100):0);
    case 'soGiay': return soGiay||'';
    case 'ngayCap': return ngayCap ? fmtDate(ngayCap) : '';
    case 'diaDanhNgayKy': { const dd=fmtDateParts(ngayCap); return `${h.diaChiTinh||''}, ngày ${dd.d} tháng ${dd.m} năm ${dd.y}`; }
    case 'chucDanhKy': return h.chucDanhKy||'GIÁM ĐỐC';
    case 'tenNguoiKy': return h.tenGiamDoc||'';
    case 'soYTe': return (h.soYTe||'').toUpperCase();
    case 'tenDonVi': return (h.tenDonVi||'').toUpperCase();
    case 'maTraCuu': return (ctx.cert && ctx.cert.maTraCuu) ? ctx.cert.maTraCuu : '';
    case 'qrCode': return '';
    default: return '';
  }
}
function mergeFieldSpan(key){
  const mf = MERGE_FIELDS.find(m=>m.key===key);
  return `<span class="merge-field" contenteditable="false" data-field="${key}">${esc(mf?mf.label:key)}</span>`;
}
/* Thay các trường dữ liệu động trong nội dung tuỳ chỉnh bằng giá trị thực khi in/xuất */
function renderCustomContent(html, ctx){
  const div = document.createElement('div');
  div.innerHTML = html;
  div.querySelectorAll('.merge-field').forEach(span=>{
    const key = span.dataset.field;
    if(key==='qrCode'){
      const url = ctx.cert && ctx.cert.qrDataUrl ? ctx.cert.qrDataUrl : '';
      span.outerHTML = url
        ? `<img src="${url}" style="width:26mm;height:26mm;display:inline-block;vertical-align:middle;">`
        : `<span style="display:inline-block;width:26mm;height:26mm;border:1px dashed #999;"></span>`;
      return;
    }
    const val = mergeFieldValue(key, ctx);
    span.textContent = val || '';
    span.removeAttribute('contenteditable');
    span.classList.remove('merge-field');
  });
  /* Giữ nguyên các đường kẻ hình vẽ và gạch chân 1/3 (không phải trường động) */
  return div.innerHTML;
}

/* Tên đơn vị cấp giấy luôn có đường gạch dài bằng 1/3 độ dài dòng chữ ngay bên
   dưới. Dùng span inline-block để width:33% tính theo đúng bề rộng chữ đã nhập,

function orgNameLinesHtml(h){
  const raw = (h.tenDonVi||'').toUpperCase().trim();
  if(!raw) return '';
  let line1 = raw, line2 = '';
  const m = raw.match(/^(BỆNH VIỆN|TRUNG TÂM|TRƯỜNG|SỞ Y TẾ|VIỆN)\s+(.+)$/);
  if(m){ line1 = m[1]; line2 = m[2]; }
  const ul = txt => `<span style="display:inline-block;text-align:center;">${esc(txt)}<span style="display:block;height:1.4px;background:#000;width:33%;margin:2px auto 0;"></span></span>`;
  if(!line2) return ul(line1);
  return `${esc(line1)}<br>${ul(line2)}`;
}

function suggestCertNumber(seq){
  const h=DATA.hospital;
  const padding = h.sttPadding ? parseInt(h.sttPadding) : 3;
  const stt = String(seq!==undefined?seq:DATA.nextCertSeq).padStart(padding,'0');
  return (h.mauSoGiay||'{stt}/GCN-{ma}').replace('{stt}',stt).replace('{ma}', h.maCoSo||'GCN');
}
function ctxFromRecord(record, soGiay, ngayCap){
  const participant = byId(DATA.participants, record.participantId);
  const program = byId(DATA.programs, record.programId);
  const roleRaw = vaiTroById(record.hinhThuc, record.vaiTro);
  const role = roleRaw ? Object.assign({}, roleRaw, {htTen: (hinhThucById(record.hinhThuc)||{}).ten}) : null;
  return { hospital:DATA.hospital, participant, program, record, soGiay, ngayCap, vaiTro: role, cert:null };
}
function ctxFromCert(cert){
  const record = byId(DATA.records, cert.recordId) || { hinhThuc:cert.hinhThucSnapshot, vaiTro:cert.vaiTroSnapshot, soLuong:cert.soLuongSnapshot, gioTinChi:cert.gioTinChi, participantId:cert.participantId, programId:cert.programId };
  const participant = byId(DATA.participants, cert.participantId) || cert.participantSnapshot;
  const program = byId(DATA.programs, cert.programId) || cert.programSnapshot;
  const roleRaw = vaiTroById(record.hinhThuc, record.vaiTro);
  const role = roleRaw ? Object.assign({}, roleRaw, {htTen:(hinhThucById(record.hinhThuc)||{}).ten}) : { donVi:'', ten:cert.vaiTroSnapshot, htTen:cert.hinhThucSnapshot };
  return { hospital:DATA.hospital, participant, program, record, soGiay:cert.soGiay, ngayCap:cert.ngayCap, vaiTro: role, cert:cert };
}

function slug(s){ return (s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').replace(/[^a-zA-Z0-9]+/g,'_').replace(/^_+|_+$/g,''); }

/* Chạy lần lượt: sinh mã QR, ghi file ra thư mục, đẩy lên Google — có bảng tiến trình */
async function runPublishBatch(certs, opts){
  const rows = certs.map((c,i)=>`<tr id="pb_${i}"><td>${esc(c.soGiay)}</td><td>${esc((byId(DATA.participants,c.participantId)||c.participantSnapshot||{}).hoTen||'')}</td><td class="pb-state">Đang chờ…</td></tr>`).join('');
  openModal('Đang hoàn tất hồ sơ giấy chứng nhận', `
    <div class="help-box" style="margin-bottom:12px;">Phần mềm đang tạo bản PDF, sinh mã QR kèm mật mã${opts.google?', và đẩy dữ liệu lên Google Sheets / Drive':''}. Vui lòng không đóng cửa sổ cho tới khi hoàn tất.</div>
    <div class="tbl-wrap" style="max-height:280px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;">
      <table class="tbl"><thead><tr><th>Số giấy</th><th>Người được cấp</th><th>Trạng thái</th></tr></thead><tbody>${rows}</tbody></table>
    </div>`, []);
  const setState = (i, html)=>{ const el=document.querySelector('#pb_'+i+' .pb-state'); if(el) el.innerHTML=html; };

  const savedGoogle = CFG.google.enabled;
  const savedFolder = CFG.storage.autoWrite;
  CFG.google.enabled = !!opts.google && !!CFG.google.clientId;
  CFG.storage.autoWrite = !!opts.folder;
  try{
    if(CFG.google.enabled){
      try{ await gsEnsureToken(); }
      catch(e){ CFG.google.enabled=false; gsLog('Bỏ qua đồng bộ Google: '+e.message,'err'); }
    }
    for(let i=0;i<certs.length;i++){
      setState(i, '<span class="small-muted">Đang xử lý…</span>');
      try{
        const r = await publishCertificate(certs[i], { qr:opts.qr });
        const bits = [];
        if(r.qr) bits.push('<span class="sync-chip sync-yes">Mã QR</span>');
        if(opts.folder) bits.push('<span class="sync-chip sync-yes">Đã lưu thư mục</span>');
        if(r.drive) bits.push('<span class="sync-chip sync-yes">Drive</span>');
        if(r.sheet) bits.push('<span class="sync-chip sync-yes">Sheets</span>');
        if(r.errors.length) bits.push('<span class="sync-chip sync-err">'+esc(r.errors[0])+'</span>');
        setState(i, bits.join(' ') || '<span class="sync-chip sync-no">Đã cấp</span>');
      }catch(e){ setState(i, '<span class="sync-chip sync-err">'+esc(e.message)+'</span>'); }
    }
  }finally{
    CFG.google.enabled = savedGoogle;
    CFG.storage.autoWrite = savedFolder;
    saveCfg(); saveData();
  }
  await new Promise(r=>setTimeout(r,500));
  closeModal();
}

/* ==========================================================================
 *  BỘ MÁY XUẤT FILE DÙNG CHUNG (v5)
 *  Nguyên tắc: MỌI định dạng xuất ra đều lấy đúng một nguồn thiết kế duy nhất
 *  là bản xem trước. Phần TRANG TRÍ (màu nền, ảnh nền, hình chìm, khung viền,
 *  hoạ tiết góc) được "chụp" thành MỘT ảnh khổ A4 nguyên trang, rồi đặt xuống
 *  lớp dưới cùng của trang trong Word/RTF. Nhờ vậy Word không phải tự dựng lại
 *  khung viền bằng CSS (việc mà Word làm sai, gây lỗi khung bị kéo lên), còn
 *  phần chữ vẫn là chữ thật — sửa được, tìm kiếm được, in nét.
 * ========================================================================== */
const EXPORT_CFG = { deco:true, scale:2, pdfQuality:0.95, rtfImage:true };

const DECO_FIELDS = ['bgColor','useBgImage','bgImageData','bgImageOpacity','bgImageFit',
  'borderLine','borderColor','borderInset','borderThickness','patternThickness',
  'cornerStyle','cornerSize','useLogo','logoImageData','watermarkOpacity','watermarkSize'];

function designHasDecoration(opt){
  opt = opt || {};
  if(opt.seal || opt.copy) return true;   /* có dấu / có chữ BẢN SAO thì luôn phải vẽ lớp phủ */
  const d = DESIGN;
  return !!((d.useBgImage && d.bgImageData)
    || (d.useLogo && d.logoImageData)
    || (d.borderLine && d.borderLine!=='none')
    || (d.cornerStyle && d.cornerStyle!=='none')
    || ((d.bgColor||'#FFFFFF').toUpperCase()!=='#FFFFFF'));
}
let DECO_CACHE = { key:null, url:null };
/* Chụp lớp trang trí thành ảnh PNG/JPEG đúng khổ A4 (210x297mm) */
async function getDecorationImage(opt){
  opt = opt || {};
  const scale = opt.scale || EXPORT_CFG.scale || 2;
  const mime  = opt.mime  || 'image/png';
  const q     = opt.quality!=null ? opt.quality : 0.92;
  const layers = { ctx:opt.ctx||null, seal:!!opt.seal, copy:!!opt.copy };
  if(!EXPORT_CFG.deco && !layers.seal && !layers.copy) return null;
  if(!designHasDecoration(layers)) return null;
  if(typeof html2canvas === 'undefined') return null;
  const sealKey = layers.seal ? JSON.stringify([SEAL.signImage?SEAL.signImage.length:0, SEAL.sealImage?SEAL.sealImage.length:0,
        SEAL.signWidth,SEAL.signOffsetX,SEAL.signOffsetY,SEAL.signOpacity,
        SEAL.sealWidth,SEAL.sealOffsetX,SEAL.sealOffsetY,SEAL.sealOpacity,SEAL.sealRotate]) : '0';
  /* Bản sao có mốc thời gian in nên không được dùng lại ảnh cũ trong bộ nhớ đệm */
  const key = layers.copy ? null
    : JSON.stringify(DECO_FIELDS.map(k=>DESIGN[k])) + '|' + scale + '|' + mime + '|' + q + '|' + sealKey;
  if(key && DECO_CACHE.key === key) return DECO_CACHE.url;
  const wrap = document.createElement('div');
  wrap.style.cssText = 'position:fixed;left:-99999px;top:0;z-index:-1;pointer-events:none;';
  wrap.innerHTML = `<div class="deco-page" style="width:210mm;height:297mm;position:relative;overflow:hidden;background-color:${DESIGN.bgColor||'#ffffff'};">${certOverlaysHtml(layers)}</div>`;
  document.body.appendChild(wrap);
  try{
    await waitForImages(wrap);
    const canvas = await html2canvas(wrap.querySelector('.deco-page'), {
      scale: scale, useCORS:true, backgroundColor:null, logging:false,
      width: wrap.firstChild.offsetWidth, height: wrap.firstChild.offsetHeight
    });
    const url = canvas.toDataURL(mime, q);
    if(key) DECO_CACHE = { key:key, url:url };
    return url;
  }catch(e){ console.warn('Không chụp được lớp trang trí:', e); return null; }
  finally{ wrap.remove(); }
}
function invalidateDecoCache(){ DECO_CACHE = { key:null, url:null }; }
function dataUrlPayload(u){ return u ? u.split(',')[1] : ''; }
function b64ToHex(b64){
  const bin = atob(b64); let out = new Array(bin.length);
  for(let i=0;i<bin.length;i++){ out[i] = bin.charCodeAt(i).toString(16).padStart(2,'0'); }
  return out.join('');
}
/* Các lớp phủ cần đưa vào ảnh nền khi xuất Word/RTF (chữ ký, dấu, chữ BẢN SAO) */
function exportLayersFor(ctxs){
  const c0 = (ctxs && ctxs[0]) || null;
  return { ctx:c0, copy: !!(c0 && c0.copyMode), seal: sealAllowedFor(c0) };
}
/* Cổng kiểm soát: mọi thao tác in/xuất có chèn dấu đều phải đi qua đây.
   Trả về false nếu người dùng huỷ, khi đó lệnh in/xuất dừng lại. */
async function ensureSealReady(ctxs, action){
  if(!SEAL.enabled || !sealHasArtwork()) return true;
  const c0 = (ctxs && ctxs[0]) || null;
  if(c0 && c0.copyMode && !SEAL.showInLookup) return true;   /* bản sao không đóng dấu */
  if(!SEAL.requirePassword){ sealLogUse(action||'xuất', ctxs); return true; }
  if(sealSessionActive()){ sealLogUse(action||'xuất', ctxs); return true; }
  const ok = await openSealUnlockModal(action||'in/xuất giấy chứng nhận');
  if(ok) sealLogUse(action||'xuất', ctxs);
  return ok;
}

/* Kết xuất một trang giấy (đủ cả trang trí + chữ) thành canvas — dùng cho PDF/ảnh */
async function renderCertCanvas(ctx, scale){
  const wrap = renderCertToHiddenDiv(ctx);
  try{
    const pageEl = wrap.querySelector('.cert-page');
    pageEl.style.height = '297mm';
    pageEl.style.boxShadow = 'none';
    await waitForImages(wrap);
    return await html2canvas(pageEl, {
      scale: scale || EXPORT_CFG.scale || 2, useCORS:true, backgroundColor:'#FFFFFF', logging:false,
      width: pageEl.offsetWidth, height: pageEl.offsetHeight
    });
  } finally { wrap.remove(); }
}

/* ============================ EXPORT: PRINT / PDF / WORD =================== */
/* Chờ mọi ảnh (hình chìm, ảnh nền, mã QR, hoạ tiết SVG) tải xong rồi mới thao tác,
   nếu không html2canvas/hộp thoại in sẽ chụp thiếu phần trang trí. */
function waitForImages(root, timeoutMs){
  const imgs = Array.from(root.querySelectorAll('img'));
  const pending = imgs.filter(im=>!im.complete || im.naturalWidth===0);
  const all = Promise.all(pending.map(im=>new Promise(res=>{ im.addEventListener('load',res,{once:true}); im.addEventListener('error',res,{once:true}); })));
  const timer = new Promise(res=>setTimeout(res, timeoutMs||2500));
  return Promise.race([all, timer]).then(()=>new Promise(r=>requestAnimationFrame(()=>setTimeout(r,30))));
}

/* IN TRỰC TIẾP — mỗi giấy là một trang A4 hoàn chỉnh, giống hệt bản xem trước.
   Không còn chèn "page-break-after" vào style trang cuối (gây thừa 1 trang trắng);
   việc ngắt trang do CSS @media print đảm nhiệm. */
async function printCertificates(ctxs){
  if(!ctxs || !ctxs.length){ showToast('Không có dữ liệu để in','err'); return; }
  if(!(await ensureSealReady(ctxs,'in trực tiếp'))) return;
  const area = document.getElementById('printArea');
  area.innerHTML = ctxs.map(cx=>buildCertPageHTML(cx)).join('');
  await waitForImages(area);
  const cleanup = ()=>{ area.innerHTML=''; window.removeEventListener('afterprint', cleanup); };
  window.addEventListener('afterprint', cleanup);
  window.print();
  setTimeout(cleanup, 60000);
}

function renderCertToHiddenDiv(ctx){
  const wrap = document.createElement('div');
  wrap.style.position='fixed'; wrap.style.left='-9999px'; wrap.style.top='0';
  wrap.innerHTML = buildCertPageHTML(ctx);
  document.body.appendChild(wrap);
  return wrap;
}

async function exportCertPDF(ctxs, filename){
  if(!ctxs || !ctxs.length){ showToast('Không có dữ liệu để xuất','err'); return; }
  if(!(await ensureSealReady(ctxs,'xuất PDF'))) return;
  showToast('Đang tạo file PDF...','ok');
  try{
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({unit:'mm', format:'a4', orientation:'portrait', compress:true});
    for(let i=0;i<ctxs.length;i++){
      const canvas = await renderCertCanvas(ctxs[i], EXPORT_CFG.scale);
      const imgData = canvas.toDataURL('image/jpeg', EXPORT_CFG.pdfQuality);
      if(i>0) pdf.addPage('a4','portrait');
      pdf.addImage(imgData, 'JPEG', 0, 0, 210, 297, undefined, 'FAST');
    }
    pdf.save(filename+'.pdf');
    showToast('Đã tạo file PDF — đúng khổ A4, giống hệt bản xem trước','ok');
  }catch(e){ showToast('Lỗi khi tạo PDF: '+e.message,'err'); }
}

/* Xuất ảnh PNG từng giấy (dùng để chèn vào email, Zalo, slide...) */
async function exportCertPNG(ctxs, filename){
  if(!ctxs || !ctxs.length){ showToast('Không có dữ liệu để xuất','err'); return; }
  if(!(await ensureSealReady(ctxs,'xuất ảnh PNG'))) return;
  showToast('Đang tạo ảnh PNG...','ok');
  try{
    for(let i=0;i<ctxs.length;i++){
      const canvas = await renderCertCanvas(ctxs[i], Math.max(EXPORT_CFG.scale,2));
      const blob = await new Promise(r=>canvas.toBlob(r,'image/png'));
      download(filename + (ctxs.length>1?('_'+(i+1)):'') + '.png', blob);
    }
    showToast('Đã tạo ảnh PNG độ phân giải cao','ok');
  }catch(e){ showToast('Lỗi khi tạo ảnh: '+e.message,'err'); }
}

/* ==========================================================================
 *  XUẤT .DOC (Word HTML) — ĐÃ SỬA LỖI "KHUNG VIỀN BỊ KÉO LÊN"
 *
 *  NGUYÊN NHÂN LỖI CŨ: bản cũ vẽ khung bằng một thẻ <div> có border bao quanh
 *  nội dung. Word không có khái niệm "chiều cao trang" cho thẻ div — nó chỉ vẽ
 *  đường viền ôm sát đúng phần chữ. Chữ chỉ chiếm khoảng 2/3 tờ A4 nên khung
 *  viền co lại đúng 2/3 và trông như bị "kéo lên", trong khi bản xem trước và
 *  PDF vẽ khung theo trang nên vẫn đúng.
 *
 *  CÁCH SỬA: không vẽ khung bằng div nữa. Toàn bộ lớp trang trí được đặt vào
 *  PHẦN ĐẦU TRANG (header) của Word dưới dạng một ảnh khổ A4 neo theo mép trang
 *  (mso-position-*-relative:page) — đây đúng là cơ chế Word dùng cho hình mờ
 *  watermark, nên nó lặp lại chính xác trên MỌI trang và không bao giờ bị lệch.
 *  Dự phòng khi không chụp được ảnh: dùng viền trang gốc của Word qua @page.
 * ========================================================================== */
function wordPageBorderCss(){
  const d = DESIGN;
  if(!d.borderLine || d.borderLine==='none') return '';
  const c = d.borderColor || '#B8873A';
  const t = Math.max(0.75, (d.borderThickness||2)*0.75);
  let style = 'solid';
  if(d.borderLine==='double' || d.borderLine==='goldframe') style='double';
  else if(d.borderLine==='dashed') style='dashed';
  else if(d.borderLine==='dotted') style='dotted';
  const w = (style==='double') ? Math.max(t*2,3) : t;
  const pad = Math.round(Math.max(d.borderInset||8,6) * 2.835); /* mm -> pt */
  /* Ghi cả thuộc tính CSS chuẩn lẫn thuộc tính riêng của Word để mọi phiên bản đều nhận */
  return `border:${style} ${c} ${w}pt; padding:${pad}pt ${pad}pt ${pad}pt ${pad}pt;
  mso-border-top-alt:${style} ${c} ${w}pt; mso-border-left-alt:${style} ${c} ${w}pt;
  mso-border-bottom-alt:${style} ${c} ${w}pt; mso-border-right-alt:${style} ${c} ${w}pt;
  mso-border-surround-header:no; mso-border-surround-footer:no;
  mso-page-border-surround-header:no; mso-page-border-surround-footer:no;`;
}
function wordDocWrapper(bodyHtml, opt){
  opt = opt || {};
  const decoImg = opt.decoImg || null;
  /* Có ảnh trang trí thì KHÔNG dùng thêm viền @page, tránh vẽ chồng hai lớp khung */
  const pageBorder = decoImg ? '' : wordPageBorderCss();

async function exportCertWordDoc(ctxs, filename){
  if(!ctxs || !ctxs.length){ showToast('Không có dữ liệu để xuất','err'); return; }
  if(!(await ensureSealReady(ctxs,'xuất .doc'))) return;
  showToast('Đang tạo file .doc...','ok');
  try{
    /* Ảnh trang trí dùng PNG để giữ nét đường viền mảnh và nền trong suốt */
    const decoImg = await getDecorationImage(Object.assign({ scale: Math.max(EXPORT_CFG.scale,2), mime:'image/png' }, exportLayersFor(ctxs)));
    /* Word/LibreOffice bố trí bảng theo thuộc tính HTML chắc chắn hơn theo CSS lớp,
       nên bổ sung width/cellspacing trực tiếp cho hai bảng bố cục của giấy. */
    const body = ctxs.map((cx,i)=>buildCertWordPage(cx, i===0)).join('')
      .replace(/<table class="cert-header-tbl"([^>]*)>/g, '<table class="cert-header-tbl"$1 width="100%" cellspacing="0" cellpadding="0" border="0"><colgroup><col width="40%"><col width="60%"></colgroup>')
      .replace(/<table class="cert-sign-wrap"([^>]*)>/g, '<table class="cert-sign-wrap"$1 width="100%" cellspacing="0" cellpadding="0" border="0"><colgroup><col width="50%"><col width="50%"></colgroup>');
    const doc = wordDocWrapper(body, { decoImg: decoImg });
    const blob = new Blob(['\ufeff', doc], {type:'application/msword;charset=utf-8'});
    download(filename+'.doc', blob);
    showToast(decoImg
      ? 'Đã tạo .doc — khung viền/hình chìm nằm đúng khổ A4 như bản xem trước'
      : 'Đã tạo .doc (dùng viền trang gốc của Word)','ok');
  }catch(e){ showToast('Lỗi khi tạo .doc: '+e.message,'err'); }
}

function mm2twip(mm){ return Math.round(mm*56.6929); }

function xesc(s){ return (s===undefined||s===null)?'':String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function wRun(text, o){
  o=o||{};
  const sz = o.sz||26;
  let rpr = `<w:rFonts w:ascii="Times New Roman" w:hAnsi="Times New Roman" w:cs="Times New Roman"/>`;
  if(o.b) rpr += '<w:b/>';
  if(o.i) rpr += '<w:i/>';
  if(o.u) rpr += '<w:u w:val="single"/>';
  rpr += `<w:sz w:val="${sz}"/><w:szCs w:val="${sz}"/>`;
  if(o.color) rpr += `<w:color w:val="${o.color}"/>`;
  return `<w:r><w:rPr>${rpr}</w:rPr><w:t xml:space="preserve">${xesc(text)}</w:t></w:r>`;
}
function wPara(runsXml, o){

  if(o.before!=null || o.after!=null) ppr += `<w:spacing w:before="${o.before||0}" w:after="${o.after||0}"/>`;
  return `<w:p>${ppr?'<w:pPr>'+ppr+'</w:pPr>':''}${runsXml}</w:p>`;

/* Bộ chuyển đổi tối giản HTML (nội dung tự soạn) -> OOXML, hỗ trợ b/i/u, div/p (mỗi
   thẻ = 1 đoạn), br, table/tr/td cơ bản. Không đảm bảo 100% mọi định dạng phức tạp
   người dùng tự soạn, nhưng giữ được chữ đậm/nghiêng/gạch chân/canh lề/màu chữ cơ bản. */
function htmlToDocxXml(html){
  const div = document.createElement('div'); div.innerHTML = html;
  function alignFromEl(el){
    const ta = el.style && el.style.textAlign;
    if(ta==='center') return 'center'; if(ta==='right') return 'end'; if(ta==='justify') return 'both'; return null;
  }
  function runsFromInline(node, inherited){
    let xml='';
    node.childNodes.forEach(ch=>{
      if(ch.nodeType===3){ if(ch.textContent) xml += wRun(ch.textContent, inherited); return; }
      if(ch.nodeType!==1) return;
      const tag = ch.tagName.toLowerCase();
      const o = Object.assign({}, inherited);
      if(tag==='b'||tag==='strong') o.b=true;
      if(tag==='i'||tag==='em') o.i=true;
      if(tag==='u') o.u=true;
      if(ch.style && ch.style.color){ const m=ch.style.color.match(/\d+/g); if(m&&m.length>=3) o.color = m.slice(0,3).map(x=>parseInt(x).toString(16).padStart(2,'0')).join(''); }
      if(tag==='br'){ xml += '<w:r><w:br/></w:r>'; return; }
      xml += runsFromInline(ch, o);
    });
    return xml;
  }
  let out='';
  function walk(node){
    node.childNodes.forEach(ch=>{
      if(ch.nodeType!==1){ return; }
      const tag = ch.tagName.toLowerCase();
      if(tag==='table'){
        $all('tr', ch).forEach(tr=>{
          const cells = $all('td,th', tr);
          if(cells.length===2){ out += wTable2Col(runsFromInline(cells[0],{sz:26})||wPara('',{}), runsFromInline(cells[1],{sz:26})||wPara('',{})); }
          else{ cells.forEach(td=> out += wPara(runsFromInline(td,{sz:26}), {align:alignFromEl(td)}) ); }
        });
      } else if(tag==='div'||tag==='p'){
        const runs = runsFromInline(ch, {sz:26});
        out += wPara(runs||'', {align:alignFromEl(ch)});
      } else if(tag==='hr'){
        out += `<w:p><w:pPr><w:pBdr><w:bottom w:val="single" w:sz="8" w:space="1" w:color="000000"/></w:pBdr></w:pPr></w:p>`;
      } else {
        walk(ch);
      }
    });
  }
  walk(div);
  return out || wPara('',{});
}
function pgBorderVal(borderLine){
  const map = { solid:'single', double:'double', dashed:'dashed', dotted:'dotted', goldframe:'triple' };
  return map[borderLine] || (borderLine && borderLine!=='none' ? 'single' : null);
}
function loadImageSize(dataUrl){
  return new Promise(resolve=>{
    const img = new Image();
    img.onload=()=>resolve({w:img.naturalWidth||1, h:img.naturalHeight||1});
    img.onerror=()=>resolve({w:1,h:1});
    img.src = dataUrl;
  });
}
/* "Nướng" độ mờ vào chính ảnh (alpha thật) để hình chìm luôn mờ đúng trong Word,
   không phụ thuộc CSS opacity (Word không hỗ trợ opacity cho ảnh neo) */
function bakeWatermarkOpacity(dataUrl, opacity){
  return new Promise(resolve=>{
    const img = new Image();
    img.onload=()=>{
      const canvas=document.createElement('canvas'); canvas.width=img.naturalWidth; canvas.height=img.naturalHeight;
      const cx=canvas.getContext('2d'); cx.globalAlpha = opacity!=null?opacity:0.12; cx.drawImage(img,0,0);
      resolve(canvas.toDataURL('image/png'));
    };
    img.onerror=()=>resolve(null);
    img.src=dataUrl;
  });
}
